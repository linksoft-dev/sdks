syntax = "proto3";

package exports;

option go_package = "comps/pb/exports";

// ExportMetadata contains metadata about the export
message ExportMetadata {
  string version = 1; // Schema version (e.g., "1.0")

  string entity = 2; // Entity name

  string exported_at = 3; // ISO8601 datetime

  int64 total_records = 4; // Total records exported

  string org_id = 5; // Organization ID

  repeated string fields = 6; // Fields that were exported
}

// ExportResponse is the standard response for export operations
message ExportResponse {
  string file_content = 1; // File content in base64

  string file_name = 2; // Suggested file name

  string content_type = 3; // MIME type (application/json, text/csv)

  ExportMetadata metadata = 4; // Export metadata
}

// ExportFormat defines the supported export formats
enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;

  EXPORT_FORMAT_JSON = 1;

  EXPORT_FORMAT_CSV = 2;
}
