syntax = "proto3";

option go_package = "comps/filter";

// generic filter API specification
message Filter {
  string main = 1;

  string main_label = 2;

  repeated condition main_fields = 3;

  repeated string select_fields = 4;

  repeated string ids = 5;

  repeated condition conditions = 6;

  repeated condition or_conditions = 7;

  repeated OrderBy orderBy = 8;

  repeated string where = 9;

  int64 limit = 10;

  int64 skip = 11;

  int64 first = 12;

  int64 last = 13;

  //  // free field to be sent filter compatible with Filter implementation
  string rawFilter = 14;

  //  // add raw conditions to be sent to Filter implementation
  //  string rawConditions = 12;
  //
  //  // this field can be used to add "additional conditions", similar to where clause in SQL language
  //  repeated string additionalConditions = 13;
  // some implementations use soft delete, this field would help the Filter implementation to decide how the filter
  //  including records "deleted"
  bool ignoreSoftDelete = 15;

  int64 page = 16;

  repeated string excludeFields = 17;

  // texto de ajuda da busca principal, mostrado ao lado do campo de consulta
  string main_help = 18;
}

enum FieldType {
  STRING = 0;

  INT = 1;

  FLOAT = 2;

  BOOLEAN = 3;

  DATE_TIME = 4;

  DATE = 5;

  MULTI_SELECT = 6;

  SELECT = 7;

  LOOKUP = 8;
}

message Values {
  string value = 1;

  string label = 2;
}

message condition {
  string field_name = 1;

  string label = 2;

  FieldType field_type = 3;

  Operator operator = 4;

  string value = 5;

  string lookup_url = 6;

  string lookup_value = 7;

  repeated Values values = 8; // used for multi-select fields

  bool not = 9;

  string filter_operator = 10;

  string raw = 11;

  bool pin = 12;

  // Condicao que controla a visao da listagem em vez de restringir dados. Quem
  // consome o catalogo para montar consulta propria deve ignora-la.
  bool view_only = 13;
}

message OrderBy {
  string field_name = 1;

  Direction direction = 2;
}

enum Direction {
  ASC = 0;

  DESC = 1;
}

enum Operator {
  EQUALS = 0;

  CONTAINS = 1;

  STARTS = 2;

  ENDS = 3;

  IN = 4;

  GT = 5;

  GTE = 6;

  LT = 7;

  LTE = 8;

  NOT_NULL = 9;

  NULL = 10;

  BETWEEN = 11;
}
