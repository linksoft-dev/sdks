syntax = "proto3";

package service;

import "google/protobuf/descriptor.proto";

option go_package = "comps/grpc/plugins/service";

extend google.protobuf.MessageOptions {
  bool crud = 1000;

  // this field is used to generate the table name
  string tableName = 1001;

  bool protojsonMarshaling = 1002;
}

extend google.protobuf.FieldOptions {
  Field field = 1001;
}

enum Boolean {
  UNSPECIFIED = 0;

  YES = 1;

  NO = 2;
}

message Field {
  Boolean upperNoSpaceNoAccent = 1;

  Boolean upperCase = 2;

  Boolean trimSpace = 3;

  Boolean removeAccent = 4;

  Boolean onlyNumber = 5;

  Boolean ignoreVersion = 6;
}
