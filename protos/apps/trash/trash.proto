syntax = "proto3";

package trash;

import "google/api/annotations.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/trash";

// Registros excluídos das telas que aceitam restauração, e a restauração deles.
service TrashService {
  rpc List ( ListTrashRequest ) returns ( ListTrashResponse );

  // Devolve o registro excluído para a tela de origem. Exige o módulo Lixeira no plano, a
  // permissão de restaurar e a de excluir da tela.
  rpc Restore ( RestoreTrashRequest ) returns ( RestoreTrashResponse );
}

message ListTrashRequest {
  // Tela dos registros, pelo prefixo de permissão (ex.: area.modulo).
  string module = 1;

  // Texto procurado, com a mesma busca da consulta da tela.
  string search = 2;

  int64 limit = 3;
}

message TrashItem {
  string id = 1;

  // Identificação do registro para quem vai escolher o que restaurar.
  string description = 2;

  google.protobuf.Timestamp deleted_at = 3;

  // Nome de quem excluiu; vazio quando a exclusão não registrou o usuário.
  string deleted_by = 4;
}

message ListTrashResponse {
  // Excluídos mais recentes primeiro.
  repeated TrashItem items = 1;
}

message RestoreTrashRequest {
  string module = 1;

  string id = 2;
}

message RestoreTrashResponse {
}
