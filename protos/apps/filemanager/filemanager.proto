syntax = "proto3";

package filemanager;

import "plugins/service/service.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/filemanager";

// Dados do File
message File {
  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  string user_id = 4;

  string user_name = 5;

  string path = 6;

  string file_id = 7;

  string file_name = 8;

  string file_extension = 9;

  int32 file_size = 10;

  string content_type = 11;

  bool temp = 12;

  string file_hash = 13;

  string file_type = 14;

  string path_table = 15;

  string base64_content = 16;

  repeated FileHistory history = 17;

  string name = 18;

  string link = 19;

  string bucket_name = 20;

  string provider = 21;

  string provider_link = 22;

  repeated FileAction actions = 23; // Histórico de ações realizadas no arquivo

  int32 download_count = 24; // Contador de downloads para facilitar consultas

  // Quando true, o objeto recebe ACL pública no provider durante o upload
  // e o campo `link` passa a apontar para a URL pública direta do storage
  // (ex.: https://storage.googleapis.com/<bucket>/<path>) em vez do link
  // interno /api/<org>/filemanager/download/<hash>. Permite servir mídia
  // sem assinatura, evitando latência extra e o risco de troca por ordem
  // ao assinar várias URLs de uma vez.
  bool is_public = 25;

  FileApprovalStatus approval_status = 26;

  string approval_note = 27; // motivo da recusa, quando approval_status é REJECTED
}

// Situação de moderação do arquivo. UNSPECIFIED significa que o arquivo não
// passa por aprovação — é o caso de tudo que é enviado por quem já opera o
// sistema; só quem envia sem essa confiança nasce PENDING.
enum FileApprovalStatus {
  FILE_APPROVAL_STATUS_UNSPECIFIED = 0;

  FILE_APPROVAL_STATUS_PENDING = 1;

  FILE_APPROVAL_STATUS_APPROVED = 2;

  FILE_APPROVAL_STATUS_REJECTED = 3;
}

// Informações de ações realizadas no arquivo
message FileAction {
  string action_type = 1; // Tipo de ação (ex: "download", "view", "share")

  google.protobuf.Timestamp timestamp = 2; // Data e hora da ação

  string origin = 3; // Origem da ação (IP, user agent, referer, etc)

  string user_id = 4; // ID do usuário que realizou a ação (opcional)

  string user_name = 5; // Nome do usuário que realizou a ação (opcional)

  map<string, string> metadata = 6; // Metadados adicionais da ação
}

// Histórico do arquivo
message FileHistory {
  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  string created_by = 4;

  string updated_by = 5;

  string action = 6;
}
