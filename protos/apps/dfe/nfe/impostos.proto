syntax = "proto3";

package nfe;

import "apps/dfe/tributacao/tributacao.proto";

option go_package = "comps/pb/apps/dfe/nfe";

// =============================================================================
// MENSAGENS DE IMPOSTOS - REFORMA TRIBUTÁRIA 2025
// =============================================================================

// Totalização do Imposto Seletivo
message IsTotal {
  double valor = 1; // Valor total do Imposto Seletivo
}

message IbsCbsTotal {
  double valor_base = 1; // Valor da base de cálculo IBS e CBS

  IbsTotal ibs = 2; // Totalização do IBS

  CbsTotal cbs = 3; // Totalização da CBS

  MonofasiaTotal monofasia = 4; // Monofasia

  EstornoCredito estorno_credito = 5; // Totalização do estorno de crédito
}

// Estorno do crédito de IBS e CBS apropriado na aquisição
message EstornoCredito {
  double valor_ibs = 1; // Valor do IBS a ser estornado

  double valor_cbs = 2; // Valor da CBS a ser estornada
}

// Totalização do IBS
message IbsTotal {
  double valor_uf = 2; // Valor do IBS estadual

  double valor_municipio = 3; // Valor do IBS municipal

  double valor = 4; // Valor total do IBS

  CreditoPresumidoTotal credito_presumido = 5; // Crédito presumido

  DiferimentoTotal diferimento = 6; // Diferimento

  DevolucaoTributosTotal devolucao_tributos = 7; // Devolução de tributos
}

// Totalização da CBS
message CbsTotal {
  double valor = 2; // Valor total da CBS

  CreditoPresumidoTotal credito_presumido = 3; // Crédito presumido

  DiferimentoTotal diferimento = 4; // Diferimento

  DevolucaoTributosTotal devolucao_tributos = 5; // Devolução de tributos
}

// Totalização da Monofasia
message MonofasiaTotal {
  MonofasiaIbsTotal ibs = 1; // IBS monofásico

  MonofasiaCbsTotal cbs = 2; // CBS monofásica
}

// Totalização geral dos impostos da Reforma Tributária 2025
message Totais {
  IsTotal is = 1; // Totalização do Imposto Seletivo

  IbsCbsTotal ibs_cbs_total = 2; // Totalização do IBS e CBS

  // MonofasiaTotal monofasia = 3; // Monofasia
  double valor_nf_tot = 4; // Valor total da NF considerando os impostos por fora
}

// Monofasia IBS
message MonofasiaIbsTotal {
  double valor = 1; // Valor do IBS monofásico

  double valor_reten = 2; // Valor do IBS monofásico retido

  double valor_ret = 3; // Valor do IBS monofásico retornado
}

// Monofasia CBS
message MonofasiaCbsTotal {
  double valor = 1; // Valor da CBS monofásica

  double valor_reten = 2; // Valor da CBS monofásica retida

  double valor_ret = 3; // Valor da CBS monofásica retornada
}

// Crédito Presumido
message CreditoPresumidoTotal {
  double valor_ibs = 1; // Valor do crédito presumido IBS

  double valor_cbs = 2; // Valor do crédito presumido CBS

  double valor_ibs_cond_sus = 3; // Valor do crédito presumido IBS com condições suspensas

  double valor_cbs_cond_sus = 4; // Valor do crédito presumido CBS com condições suspensas
}

// Diferimento
message DiferimentoTotal {
  double valor_ibs = 1; // Valor do diferimento IBS

  double valor_cbs = 2; // Valor do diferimento CBS
}

// Devolução de Tributos
message DevolucaoTributosTotal {
  double valor_ibs = 1; // Valor da devolução de tributos IBS

  double valor_cbs = 2; // Valor da devolução de tributos CBS
}

// =============================================================================
// MENSAGENS DE IMPOSTOS POR ITEM - ORGANIZADAS POR ESCOPO
// =============================================================================

// Imposto Seletivo por item - conforme schema XSD TIS
message ImpostoIs {
  string cst_is = 1; // CST - Código de Situação Tributária do Imposto Seletivo

  string c_class_trib_is = 2; // Código de Classificação Tributária do IS

  double base_valor = 3; // Valor da BC do IS

  double aliquota = 4; // Alíquota do Imposto Seletivo (percentual)

  double aliquota_especifica = 5; // Alíquota do Imposto Seletivo (por valor) - opcional

  string unidade_tributaria = 6; // Unidade de medida apropriada para IS - opcional

  double quantidade_tributada = 7; // Quantidade com base no campo uTrib - opcional

  double valor = 8; // Valor do Imposto Seletivo calculado
}

// IBS e CBS por item - conforme schema XSD TTribNFe e TCIBS
message ImpostoIbsCbs {
  string cst = 1; // CST - Código de Situação Tributária do IBS/CBS

  string c_class_trib = 2; // Código de Classificação Tributária

  double base_valor = 3; // Valor da Base de Cálculo

  // double percentual_reducao_base = 4; // Percentual de redução da base de cálculo
  // double valor_reducao_base = 5; // Valor de redução da base de cálculo
  double exclusao_base = 6; // Exclusão de base de cálculo CST 830

  double fator_conversao_proporcional = 7; // usado para converter a quantidade do item na quantidade esperada para uso no calculo proporcional

  IbsUf ibs_uf = 8; // Grupo de informações do IBS na UF

  IbsMunicipio ibs_municipio = 9; // Grupo de Informações do IBS no Município

  double valor_ibs = 10; // Valor total do IBS

  Cbs cbs = 11; // Grupo de Tributação da CBS

  TribRegular trib_regular = 12; // Grupo de informações da Tributação Regular - opcional

  CredPresIbs cred_pres_ibs = 13; // Grupo de Informações do Crédito Presumido IBS - opcional

  CredPresCbs cred_pres_cbs = 14; // Grupo de Informações do Crédito Presumido CBS - opcional

  TribCompraGov trib_compra_gov = 15; // Grupo de informações da composição do valor - opcional

  Monofasia monofasia = 16; // Grupo de informações da Monofasia - opcional

  bool calculo_manual_bc = 17; // Cálculo Manual da Base de Cálculo

  EstornoCredito estorno_credito = 18; // Grupo de Estorno de Crédito - obrigatório na nota de débito de perda em estoque

  string competencia_apuracao = 19; // Ano e mês (AAAA-MM) do período de apuração ajustado - grupo gAjusteCompet
}

// Monofasia por Item
message Monofasia {
  tributacao.PerfilMonofasico perfil_monofasico = 1; // Perfil Monofásico

  double fator_conversao_monofasico = 2; // Fator de Conversão Monofásico

  double quantidade_base_calculo = 3; // Quantidade Base de Cálculo Monofásica (nem sempre é a quantidade tributável)

  double aliquota_adrem_ibs = 4; // Alíquota Ad Rem IBS

  double aliquota_adrem_cbs = 5; // Alíquota Ad Rem CBS

  MonofasiaPadrao monofasia_padrao = 6; // Monofasia Padrão

  MonofasiaReten monofasia_reten = 7; // Monofasia Retenção

  MonofasiaRet monofasia_ret = 8; // Monofasia Retorno

  MonofasiaDif monofasia_dif = 9; // Monofasia Diferimento

  double total_ibs = 10; // Total monofasico do IBS do item

  double total_cbs = 11; // Total monofasico da CBS do item
}

// Monofasia Padrão
message MonofasiaPadrao {
  double valor_ibs = 1; // Valor do IBS monofásico

  double valor_cbs = 2; // Valor da CBS monofásica
}

// Monofasia Retenção
message MonofasiaReten {
  double valor_ibs = 1; // Valor do IBS monofásico

  double valor_cbs = 2; // Valor da CBS monofásica
}

// Monofasia Retida
message MonofasiaRet {
  double valor_ibs = 1; // Valor do IBS monofásico

  double valor_cbs = 2; // Valor da CBS monofásica
}

// Monofasia com diferimento
message MonofasiaDif {
  double percentual_ibs = 1; // Percentual de Dif IBS

  double percentual_cbs = 2; // Percentual de Dif CBS

  double valor_ibs = 3; // Valor do IBS de Dif

  double valor_cbs = 4; // Valor da CBS de Dif
}

// IBS Estadual - conforme schema XSD gIBSUF
message IbsUf {
  double aliquota = 1; // Alíquota do IBS de competência das UF

  double aliquota_proporcional = 2; // Alíquota proporcional do IBS de competência das UF adRem

  double valor = 3; // Valor do IBS de competência das UF

  Dif diferimento = 4; // Grupo de campos do Diferimento - opcional

  DevTrib devolucao_tributos = 5; // Grupo de Informações da devolução de tributos - opcional

  Red reducao = 6; // Grupo de campos da redução de alíquota - opcional
}

// IBS Municipal - conforme schema XSD gIBSMun
message IbsMunicipio {
  double aliquota = 1; // Alíquota do IBS Municipal

  double aliquota_proporcional = 2; // Alíquota proporcional do IBS Municipal adRem

  double valor = 3; // Valor do IBS Municipal

  Dif diferimento = 4; // Grupo de campos do Diferimento - opcional

  DevTrib devolucao_tributos = 5; // Grupo de Informações da devolução de tributos - opcional

  Red reducao = 6; // Grupo de campos da redução de alíquota - opcional
}

// CBS - conforme schema XSD gCBS
message Cbs {
  double aliquota = 1; // Alíquota da CBS

  double aliquota_proporcional = 2; // Alíquota proporcional da CBS adRem

  double valor = 3; // Valor da CBS

  Dif diferimento = 4; // Grupo de campos do Diferimento - opcional

  DevTrib devolucao_tributos = 5; // Grupo de Informações da devolução de tributos - opcional

  Red reducao = 6; // Grupo de campos da redução de alíquota - opcional
}

// Diferimento - conforme schema XSD TDif
message Dif {
  double valor = 1; // Valor do diferimento

  double percentual = 2; // Percentual do diferimento
}

// Devolução de Tributos - conforme schema XSD TDevTrib
message DevTrib {
  double valor = 1; // Valor da devolução de tributos

  double percentual = 2; // Percentual da devolução de tributos
}

// Redução - conforme schema XSD TRed
message Red {
  double valor = 1; // Valor da redução

  double percentual = 2; // Percentual da redução

  double percentual_efetivo = 3; // Percentual que sera usado para calcular o imposto no lugar da aliquiota normal
}

// Tributação Regular - conforme schema XSD TTribRegular
message TribRegular {
  string cst = 1; // Código da Situação Tributária do Regime Regular (CSTReg)

  string c_class_trib = 2; // Código de Classificação Tributária do Regime Regular (cClassTribReg)

  double aliquota_ibs_uf = 3; // Alíquota efetiva do IBS UF (pAliqEfetRegIBSUF)

  double aliquota_ibs_mun = 4; // Alíquota efetiva do IBS Mun (pAliqEfetRegIBSMun)

  double aliquota_cbs = 5; // Alíquota efetiva da CBS (pAliqEfetRegCBS)

  double valor_ibs_uf = 6; // Valor do IBS na tributação regular (vTribRegIBSUF)

  double valor_ibs_mun = 7; // Valor do IBS Municipal na tributação regular (vTribRegIBSMun)

  double valor_cbs = 8; // Valor da CBS na tributação regular (vTribRegCBS)
}

// Crédito Presumido IBS - conforme schema XSD TCredPres
message CredPresIbs {
  double valor = 1; // Valor do crédito presumido IBS

  double percentual = 2; // Percentual do crédito presumido IBS
}

// Crédito Presumido CBS - conforme schema XSD TCredPres
message CredPresCbs {
  double valor = 1; // Valor do crédito presumido CBS

  double percentual = 2; // Percentual do crédito presumido CBS
}

// Tributação Compra Governamental - conforme schema XSD TTribCompraGov
message TribCompraGov {
  double valor_ibs = 1; // Valor do IBS em compra governamental

  double valor_cbs = 2; // Valor da CBS em compra governamental
}
