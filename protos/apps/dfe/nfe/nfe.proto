  // Integração de IA da empresa que executa a geração. Vazio usa a IA nativa do sistema, cobrada em créditos.
  string ai_integration_id = 2;
}

message ExplainRejectionResponse {
  // codigo cStat oficial usado como base da explicacao
  string cstat = 1;

  // mensagem original retornada pelo webservice
  string original_message = 2;

  // explicacao em linguagem humana do que aconteceu
  string explanation = 3;

  // passo a passo sugerido para resolver
  repeated string recommended_actions = 4;

  // info, warning, critical
  string severity = 5;
}
