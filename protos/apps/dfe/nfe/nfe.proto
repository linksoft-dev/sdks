message NfeEnviaXmlRequest {
  string email = 1; // E-mail para envio (opcional se whatsappNumero estiver preenchido)

  repeated string ids = 2; // IDs das notas para envio

  string tipo_documento = 3; // Tipo do documento (nfe/nfce)

  string whatsapp_numero = 4; // Número do WhatsApp para envio (opcional se email estiver preenchido)

  string whatsapp_nome_destinatario = 5; // Nome do destinatário para WhatsApp (opcional)

  string whatsapp_integration_id = 6; // ID da integração WhatsApp para envio via API (opcional)

  string email_integration_id = 7; // ID da integração de e-mail para envio; vazio usa a resolução padrão do sistema

  // Template aprovado da API oficial; obrigatório quando a conta é oficial e o
  // destinatário está fora da janela de 24h. Variáveis: nome e link, nesta ordem.
  string whatsapp_template_name = 8;

  string whatsapp_template_language = 9; // vazio usa pt_BR

  // Modelo de mensagem a usar; vazio usa o modelo padrão do canal.
  string message_template_id = 10;
}

message NfeEnviaXmlResponse {
  string whatsapp_web_message = 1; // mensagem para envio via whatsapp web

  string public_download_link = 2; // link público para download das notas (JWT)
}

