// Request e Response para gerar o danfe da NF-e
message DanfeRequest {
  repeated string ids = 1; // ids das notas que deseja gerar o danfe

  DanfeTipo danfe_tipo = 2; // tipo do danfe no retorno
}

enum DanfeTipo {
  DANFE_TIPO_UNSPECIFIED = 0;

  DANFE_TIPO_PDF = 1;

  DANFE_TIPO_HTML = 2;

  DANFE_TIPO_REPORT = 3;
}

message DanfeResponse {
  DanfeTipo danfe_tipo = 1;

  message DanfeResponseList {
    uint32 numero = 1;

    uint32 serie = 2;

    string chave = 3;

    string danfe_data = 4; // conteudo do danfe, seja em HTML ou PDF, no caso de report, será retornado os dados para montar o relatório

    string danfe_template = 5; // retorno do template do danfe no caso de report

    string filename = 6; // nome do arquivo do danfe
  }

  repeated DanfeResponseList danfeResponseList = 2;
}

