syntax = "proto3";

package dfedashboard;

import "google/api/annotations.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/dfe/dashboard";

// Servico do painel /dfe/dashboard. Consolida NF-e, NFC-e, NF-e Entrada,
// MDF-e e Inutilizacoes em uma unica resposta.
service DfeDashboardService {
  // GetSummary retorna o payload do dashboard para o periodo informado.
  // Quando from/to nao sao informados, usa o mes corrente.
  rpc GetSummary ( GetSummaryRequest ) returns ( GetSummaryResponse );
}

message GetSummaryRequest {
  // Inicio do periodo (inclusive). Default: inicio do mes corrente.
  google.protobuf.Timestamp from = 1;

  // Fim do periodo (inclusive). Default: fim do dia atual.
  google.protobuf.Timestamp to = 2;
}

message GetSummaryResponse {
  Period period = 1;

  Kpis kpis = 2;

  Resumos resumos = 3;

  // Serie por mes (cobre os ultimos 12 meses).
  repeated StatusMensalItem status_mensal = 4;

  // Impostos por mes do periodo.
  repeated ImpostosItem impostos = 5;

  // Top 50 CFOPs do periodo, ordenados por valor total decrescente.
  repeated CfopItem cfops = 6;

  // Agregacao por tipo de documento (nfe/nfce/entrada) e finalidade de emissao
  // (nor/comp/ajus/dev/outros). O rotulo amigavel e' resolvido no frontend.
  repeated ResumoPorFinalidadeItem resumo_por_finalidade = 7;
}

// Agrupamento para tabela de resumo por tipo e finalidade da nota no periodo.
message ResumoPorFinalidadeItem {
  // Identificadores estaveis para i18n/rotulos no cliente: "nfe" | "nfce" | "entrada".
  string tipo_documento = 1;

  // Codigo da finalidade no doc: nor | dev | comp | ajus | outros.
  string finalidade_codigo = 2;

  int32 quantidade = 3;

  double valor = 4;
}

// Periodo aplicado ao dashboard com o periodo anterior para calculo de variacao.
message Period {
  google.protobuf.Timestamp from = 1;

  google.protobuf.Timestamp to = 2;

  google.protobuf.Timestamp prev_from = 3;

  google.protobuf.Timestamp prev_to = 4;
}

// Valor de um KPI com comparacao ao periodo anterior.
// has_variation = false indica que a variacao nao se aplica (anterior zero).
message KpiValue {
  double value = 1;

  double previous = 2;

  double variation = 3;

  bool has_variation = 4;
}

message Kpis {
  KpiValue valor_total_emitido = 1;

  KpiValue qtd_notas_emitidas = 2;

  KpiValue ticket_medio = 3;

  KpiValue notas_canceladas = 4;

  KpiValue valor_canceladas = 5;
}

message ResumoItem {
  double valor = 1;

  int32 quantidade = 2;
}

message Resumos {
  ResumoItem nfe = 1;

  ResumoItem nfce = 2;

  ResumoItem entrada = 3;

  ResumoItem nfse = 4;

  ResumoItem mdfe = 5;

  // Inutilizacoes sao apenas contagem.
  int32 inutilizacoes = 6;
}

message StatusMensalItem {
  // Label do mes, ex.: "Mai/26".
  string mes = 1;

  int32 nfe_autorizada = 2;

  int32 nfe_pendente = 3;

  int32 nfe_cancelada = 4;

  double nfe_autorizada_valor = 5;

  double nfe_pendente_valor = 6;

  double nfe_cancelada_valor = 7;

  int32 nfce_autorizada = 8;

  int32 nfce_pendente = 9;

  int32 nfce_cancelada = 10;

  double nfce_autorizada_valor = 11;

  double nfce_pendente_valor = 12;

  double nfce_cancelada_valor = 13;
}

message ImpostosItem {
  string mes = 1;

  double icms = 2;

  double pis = 3;

  double cofins = 4;
}

message CfopBucket {
  int32 qtd = 1;

  double valor = 2;

  double total = 3;
}

message CfopItem {
  string cfop = 1;

  string descricao = 2;

  CfopBucket nfe = 3;

  CfopBucket nfce = 4;

  CfopBucket entrada = 5;

  double total_geral = 6;
}
