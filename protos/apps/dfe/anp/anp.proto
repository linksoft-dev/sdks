syntax = "proto3";

package anp;

import "google/api/annotations.proto";

import "filter/filter.proto";

option go_package = "comps/pb/apps/dfe/anp";

// Lista fixa de códigos ANP (combustíveis e lubrificantes). Sem persistência.
service AnpService {
  rpc List ( ListAnpRequest ) returns ( ListAnpResponse );
}

message AnpCodigo {
  // id = codigo (compatível com f-lookup)
  string id = 1;

  string codigo = 2;

  string descricao = 3;

  // ICMS monofásico por unidade vigente hoje; zero quando o combustível não é monofásico no ICMS.
  double icms_monofasico = 4;

  // Unidade do ICMS monofásico: L ou KG.
  string unidade_monofasico = 5;

  // Mistura obrigatória de biodiesel vigente hoje; só no óleo diesel B.
  double percentual_biodiesel = 6;
}

message ListAnpRequest {
  Filter filter = 1;
}

message ListAnpResponse {
  repeated AnpCodigo anp_list = 1;
}
