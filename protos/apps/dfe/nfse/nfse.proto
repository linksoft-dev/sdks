syntax = "proto3";

package nfse;

import "apps/dfe/emitente/emitente.proto";

import "apps/report/report.proto";

import "common/metadata/metadata.proto";

import "filter/filter.proto";

import "google/api/annotations.proto";

import "google/protobuf/timestamp.proto";

import "plugins/service/service.proto";

import "plugins/validate/validate.proto";

option go_package = "comps/pb/apps/dfe/nfse";

// Serviço NFSe
service NfseService {
  rpc EmitirNfse ( EmitirNfseRequest ) returns ( EmitirNfseResponse );

  rpc CancelarNfse ( CancelarNfseRequest ) returns ( CancelarNfseResponse );

  // Substituir uma NFSe autorizada por uma nova (cancela a original e emite nova com referência)
  rpc SubstituirNfse ( SubstituirNfseRequest ) returns ( SubstituirNfseResponse );

  rpc ConsultarLote ( ConsultarLoteRequest ) returns ( ConsultarLoteResponse );

  rpc ConsultaNfse ( ConsultaNfseRequest ) returns ( ConsultaNfseResponse );

  rpc Create ( CreateNfseRequest ) returns ( CreateNfseResponse );

  rpc Update ( UpdateNfseRequest ) returns ( UpdateNfseResponse );

  rpc Delete ( DeleteNfseRequest ) returns ( DeleteNfseResponse );

  rpc Clone ( CloneNfseRequest ) returns ( CloneNfseResponse );

  rpc ImprimeDanfse ( ImprimeDanfseRequest ) returns ( ImprimeDanfseResponse );

  rpc EnviaXmlNfse ( EnviaXmlNfseRequest ) returns ( EnviaXmlNfseResponse );

  rpc List ( ListNfseRequest ) returns ( ListNfseResponse );

  rpc Get ( GetNfseRequest ) returns ( GetNfseResponse );

  rpc AddServico ( AddServicoRequest ) returns ( AddServicoResponse );

  rpc UpdateServico ( UpdateServicoRequest ) returns ( UpdateServicoResponse );

  rpc DeleteServico ( DeleteServicoRequest ) returns ( DeleteServicoResponse );

  rpc GetDownloadLinkXml ( GetDownloadLinkXmlRequest ) returns ( GetDownloadLinkXmlResponse );

  // Registra evento de download (PDF ou XML) na NFSe
  rpc RegistraEventoDownload ( RegistraEventoDownloadRequest ) returns ( RegistraEventoDownloadResponse );

  rpc GetCidadesSuportadas ( GetCidadesSuportadasRequest ) returns ( GetCidadesSuportadasResponse );

  rpc Report ( ReportRequest ) returns ( ReportResponse );

  // Download de XML por competência (mês/ano)
  rpc DownloadXmlCompetencia ( DownloadXmlCompetenciaRequest ) returns ( DownloadXmlCompetenciaResponse );

  // Envio de XML por competência via email/WhatsApp
  rpc EnviaXmlCompetencia ( EnviaXmlCompetenciaRequest ) returns ( EnviaXmlCompetenciaResponse );

  // Importação de XML de NFSe (individual, ZIP ou ListaNfseCompetencia)
  rpc ImportaXml ( ImportaXmlRequest ) returns ( ImportaXmlResponse );
}

message GetCidadesSuportadasRequest {
  // Código do município para verificar suporte (opcional)
  // Se informado, retorna apenas a cidade especificada ou lista vazia se não suportada
  string codigo_municipio = 1;
}

message CidadeSuportada {
  string codigo_municipio = 1;

  string nome = 2;

  string uf = 3;

  string provedor = 4;
}

message GetCidadesSuportadasResponse {
  repeated CidadeSuportada cidades = 1;
}

// Informações do tomador
message Tomador {
  string id = 1; // CNPJ do tomador

  string cpf_cnpj = 2; // CNPJ do tomador

  string nome = 3; // Nome do tomador

  string im = 4; // Inscrição Municipal

  string email = 6; // Email do tomador

  string fone = 7; // Telefone do tomador

  // Endereço do tomador (nacional)
  message Endereco {
    string logradouro = 1; // Logradouro

    string numero = 2; // Número

    string bairro = 3; // Bairro

    string codigo_municipio = 4; // Código do município

    string municipio = 5; // Nome do município

    string uf = 6; // Unidade Federativa

    string cep = 7; // CEP

    string complemento = 8; // Complemento
  }

  Endereco endereco = 8;

  // NIF - Número de Identificação Fiscal do tomador estrangeiro
  string nif = 9;

  // Código do país do tomador (código BACEN, 4 dígitos)
  string codigo_pais = 10;

  // Endereço do tomador no exterior
  message EnderecoExterior {
    string codigo_pais = 1; // Código BACEN do país (4 dígitos)

    string endereco_completo = 2; // Endereço completo (logradouro, número, cidade, etc)
  }

  EnderecoExterior endereco_exterior = 11;
}

// Intermediário da prestação de serviço (terceiro que intermediou a operação)
message Intermediario {
  string cpf_cnpj = 1; // CPF ou CNPJ do intermediário

  string inscricao_municipal = 2; // Inscrição Municipal do intermediário

  string razao_social = 3; // Razão Social/Nome do intermediário

  string localizacao_uf = 4; // UF de localização do intermediário

  string localizacao_cidade = 5; // Cidade de localização do intermediário
}

// Nota Substituta - informações completas de substituição
message NotaSubstituta {
  bool e_substituidora = 1; // Indica se esta nota é substituidora de outra

  string chave_nota_substituida = 2; // Chave de acesso da nota substituída

  string motivo_substituicao = 3; // Motivo da substituição

  string nfse_id_substituida = 4; // ID interno da NFSe substituída (para navegação)

  string numero_nfse_substituida = 5; // Número da NFSe substituída (para exibição)
}

// Informações de quando esta NFSe foi substituída por outra
message NotaSubstituida {
  string nfse_id_substituta = 1; // ID interno da NFSe que substituiu esta

  string chave_nfse_substituta = 2; // Chave de acesso da NFSe substituta

  string numero_nfse_substituta = 3; // Número da NFSe substituta (para exibição)

  google.protobuf.Timestamp data_substituicao = 4; // Data/hora da substituição
}

// Município de Incidência do ISS (pode ser diferente do local de prestação)
message MunicipioIncidencia {
  string uf = 1; // UF do município de incidência

  string codigo_municipio = 2; // Código IBGE do município

  string nome_municipio = 3; // Nome do município
}

// Informações dos serviços
message Servico {
  // ID do item do serviço
  string id = 1;

  // Código do item da lista de serviços (formato LC 116/2003: "01.04", "01.05", etc.)
  string codigo_servico = 2;

  // Código de tributação nacional do ISSQN (6 dígitos numéricos, ex: "010400")
  // Regra de formação: 2 dígitos Item (LC 116/2003) + 2 dígitos Subitem (LC 116/2003) + 2 dígitos Desdobro Nacional
  // Este código deve ser obtido da "Lista Nacional de Serviços" (Anexo III) que possui subitens desdobrados
  // da lista de serviços anexa à LC 116/03. Não é uma simples conversão do codigo_servico.
  // Consulte a documentação oficial do Sistema Nacional NFS-e para obter o código correto.
  string codigo_tributacao_nacional = 15;

  // Código NBS (Nomenclatura Brasileira de Serviços)
  string codigo_nbs = 16;

  // Descricao do item da lista de serviços, essa informação é gerada automaticamente pela API
  string descricao_servico = 3;

  // CNAE do serviço
  string cnae = 4;

  // Descrição do serviço no sistema, livre para o usuário mas pegando automático do cadastro de serviços
  string servico_nome = 5;

  string servico_id = 6;

  string un = 7;

  double valor_unitario = 8;

  double quantidade = 9;

  double total = 10;

  message Impostos {
    double aliquota_iss = 1;

    double valor_iss = 2;

    double valor_csll = 3;

    double valor_inss = 4;

    double valor_pis = 5;

    double valor_cofins = 6;

    double valor_deducoes = 7;

    double valor_ir = 8;

    bool iss_retido = 10;

    double valor_iss_retido = 11;

    double outras_retencoes = 12;

    double base_calculo = 13;

    // Reforma Tributária
    double valor_cbs = 14;

    double aliquota_cbs = 15;

    double valor_ibs = 16;

    double aliquota_ibs = 17;

    // Exigibilidade do ISS (Tributação do ISSQN)
    ExigibilidadeISS exigibilidade_iss = 18;

    // Número do processo de suspensão da exigibilidade (obrigatório quando exigibilidade = 6 ou 7)
    string numero_processo_suspensao = 19;
  }

  Impostos impostos = 11;

  double desconto_condicional = 12;

  double desconto_incondicional = 13;

  double valor_liquido_nfse = 14;

  // Código de Tributação do Município (ex: 749010400)
  string codigo_tributacao_municipal = 17;
}

enum Situacao {
  SITUACAO_NAO_ESPECIFICADA = 0;

  SITUACAO_DIGITADA = 1;

  SITUACAO_AUTORIZADA = 2;

  SITUACAO_CANCELADA = 3;

  SITUACAO_REJEITADA = 4;

  SITUACAO_PROCESSANDO = 5;

  SITUACAO_INCONSISTENTE = 6;

  // Nota foi substituída por outra NFSe (a nota original fica com este status)
  SITUACAO_SUBSTITUIDA = 7;
}

enum Ambiente {
  AMBIENTE_HOMOLOGACAO = 0;

  AMBIENTE_PRODUCAO = 1;
}

// Enum para NaturezaDaOperacao
enum NaturezaDaOperacao {
  NATUREZA_UNSPECIFIED = 0; // Valor padrão quando não especificado

  TRIBUTACAO_MUNICIPIO = 1; // Tributação no município

  TRIBUTACAO_FORA_MUNICIPIO = 2;

  TRIBUTACAO_ISENCAO = 3;

  TRIBUTACAO_IMUNE = 4;

  TRIBUTACAO_EXIGI_SUSPENSA_DECISAO_JUDICIAL = 5;

  TRIBUTACAO_EXIGI_SUSPENSA_ADMINISTRATIVO = 6;
}

enum RegimeEspecial {
  REGIME_ESPECIAL_NENHUM = 0;

  REGIME_ESPECIAL_EMPRESA_MUNICIPAL = 1;

  REGIME_ESPECIAL_ESTIMATIVA = 2;

  REGIME_ESPECIAL_SOCIEDADE_PROFISSIONAIS = 3;

  REGIME_ESPECIAL_COOPERATIVA = 4;

  REGIME_ESPECIAL_MEI = 5;

  REGIME_ESPECIAL_EPP = 6;
}

// Códigos de cancelamento conforme padrão ABRASF
// Nacional usa apenas 1, 2, 9 - os demais são mapeados internamente
enum CodigoCancelamento {
  CODIGO_CANCELAMENTO_NAO_ESPECIFICADO = 0; // Valor padrão (inválido para envio)

  CODIGO_CANCELAMENTO_ERRO_EMISSAO = 1; // Erro na emissão

  CODIGO_CANCELAMENTO_SERVICO_NAO_PRESTADO = 2; // Serviço não prestado

  CODIGO_CANCELAMENTO_ERRO_ASSINATURA = 3; // Erro de assinatura (uso restrito ATM)

  CODIGO_CANCELAMENTO_DUPLICIDADE = 4; // Duplicidade da nota

  CODIGO_CANCELAMENTO_ERRO_PROCESSAMENTO = 5; // Erro de processamento (uso restrito ATM)

  CODIGO_CANCELAMENTO_OUTROS = 9; // Outros (usado pelo Nacional)
}

// Regime de apuração do Simples Nacional (obrigatório para ME/EPP)
enum RegimeApuracaoSN {
  // Não especificado
  REGIME_APURACAO_SN_NAO_ESPECIFICADO = 0;

  // Regime de apuração dos tributos federais e municipal pelo SN
  REGIME_APURACAO_SN_COMPLETO = 1;

  // Regime de apuração dos tributos federais pelo SN e ISSQN por fora do SN
  REGIME_APURACAO_SN_ISSQN_FORA = 2;

  // Regime de apuração dos tributos federais e municipal por fora do SN
  REGIME_APURACAO_SN_TODOS_FORA = 3;
}

// Exigibilidade do ISS - Tributação do ISSQN
enum ExigibilidadeISS {
  EXIGIBILIDADE_ISS_NAO_ESPECIFICADA = 0;

  // 1 - Exigível
  EXIGIBILIDADE_ISS_EXIGIVEL = 1;

  // 2 - Não incidência
  EXIGIBILIDADE_ISS_NAO_INCIDENCIA = 2;

  // 3 - Isenção
  EXIGIBILIDADE_ISS_ISENCAO = 3;

  // 4 - Exportação
  EXIGIBILIDADE_ISS_EXPORTACAO = 4;

  // 5 - Imunidade
  EXIGIBILIDADE_ISS_IMUNIDADE = 5;

  // 6 - Exigibilidade Suspensa por Decisão Judicial
  EXIGIBILIDADE_ISS_SUSPENSA_JUDICIAL = 6;

  // 7 - Exigibilidade Suspensa por Processo Administrativo
  EXIGIBILIDADE_ISS_SUSPENSA_ADMINISTRATIVA = 7;
}

// Tipo de operação que gerou a rejeição
enum TipoOperacaoRejeicao {
  TIPO_OPERACAO_REJEICAO_NAO_ESPECIFICADA = 0;

  TIPO_OPERACAO_REJEICAO_ENVIO = 1;

  TIPO_OPERACAO_REJEICAO_CANCELAMENTO = 2;

  TIPO_OPERACAO_REJEICAO_CONSULTA = 3;

  TIPO_OPERACAO_REJEICAO_SUBSTITUICAO = 4;
}

// Tipo de evento da NFSe (para histórico de ações)
enum TipoEventoNfse {
  TIPO_EVENTO_NFSE_NAO_ESPECIFICADO = 0;

  TIPO_EVENTO_NFSE_AUTORIZACAO = 1; // NFSe autorizada

  TIPO_EVENTO_NFSE_CANCELAMENTO = 2; // NFSe cancelada

  TIPO_EVENTO_NFSE_EMAIL_ENVIADO = 3; // Email enviado com sucesso

  TIPO_EVENTO_NFSE_EMAIL_FALHA = 4; // Falha no envio de email

  TIPO_EVENTO_NFSE_WHATSAPP = 5; // Mensagem WhatsApp gerada

  TIPO_EVENTO_NFSE_SUBSTITUICAO = 6; // NFSe substituída

  TIPO_EVENTO_NFSE_DOWNLOAD_XML = 7; // Download de XML realizado

  TIPO_EVENTO_NFSE_DOWNLOAD_PDF = 8; // Download de PDF realizado
}

// Evento registrado na NFSe (histórico de ações)
message EventoNfse {
  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  string user_id = 3;

  string user_name = 4;

  TipoEventoNfse tipo = 5;

  string codigo = 6; // Código do evento (ex: "EMAIL_ENVIADO", "AUTORIZADA")

  string descricao = 7; // Descrição legível do evento

  string mensagem = 8; // Mensagem adicional (erro, retorno provedor, etc)
}

// Mensagem principal da Nota Fiscal de Serviço
message Nfse {
  string id = 1;

  string numero = 2;

  Situacao situacao = 3;

  metadata.BasicFields fields = 4;

  Ambiente ambiente = 5;

  google.protobuf.Timestamp data_hora_emissao = 6;

  google.protobuf.Timestamp data_competencia = 7;

  NaturezaDaOperacao natureza_operacao = 8;

  dfe.Emitente emitente = 9;

  Tomador tomador = 10;

  message LocalDePrestacao {
    // Exclusivo para quando prestar serviço para o exterior, exemplo, serviços de consultoria em TI
    bool exterior = 1;

    string uf = 2;

    string cidade = 3;

    string cidade_codigo = 4;

    // Código do país quando exterior (código BACEN, 4 dígitos)
    string codigo_pais = 5;
  }

  // determina o local onde foi prestado o serviço, podendo ter opcao para prestacao ao exterior
  LocalDePrestacao local_prestacao = 11;

  bool incentivo_cultural = 13;

  bool numero_nota_substituta = 14;

  bool optante_simples_nacional = 15;

  RegimeEspecial regime_especial = 16;

  // Regime de apuração do Simples Nacional (obrigatório para ME/EPP quando IBSCBS ativo)
  RegimeApuracaoSN reg_ap_trib_sn = 47;

  message Impostos {
    // ISS
    double base_calculo = 1;

    double iss_percentual = 2;

    double iss_valor = 3;

    bool iss_reter = 4;

    // Retenções
    double inss = 5;

    double cofins = 6;

    double irrf = 7; // imposto de renda retido na fonte

    double pis_pasep = 8;

    double csll = 9;

    double outras_retencoes = 10;

    // Outros campos
    double deducoes = 11;

    double credito = 12;

    double irpj = 13;

    // Reforma Tributária
    double valor_cbs = 14;

    double aliquota_cbs = 15;

    double valor_ibs = 16;

    double aliquota_ibs = 17;

    double valor_iss_retido = 18;
  }

  Impostos impostos = 17;

  double desconto_incondicional = 30; // Mantive a tag original para evitar quebras se possível, mas mudei para snake_case

  double subtotal = 31;

  double total = 32;

  repeated Servico servicos = 33;

  message ConstrucaoCivil {
    string codigo_obra = 1;

    string codigo_art = 2;
  }

  ConstrucaoCivil construcao_civil = 34;

  string obs = 35;

  string xml_lote_envio = 36;

  string xml_autorizacao = 37;

  string chave_acesso = 38;

  message LoteRps {
    string protocolo = 1;

    google.protobuf.Timestamp data_hora_envio = 2;

    google.protobuf.Timestamp data_hora_processamento = 3;

    string numero_lote = 4;

    string numero_rps = 5;

    string serie = 6;
  }

  // Recibo Provisório de Serviço, campo onde o sistema guarda as informações de envio de lote
  LoteRps rps = 39;

  string codigo_verificacao = 40;

  // url completa da nfse no provedor de origem, essa informação é gerada automaticamente pelo sistema
  string url_provedor = 41;

  string url_pdf = 42;

  message Cancelamento {
    CodigoCancelamento codigo = 1;

    string motivo = 2;

    google.protobuf.Timestamp data_hora = 3;
  }

  Cancelamento cancelamento = 43;

  message Rejeicao {
    string id = 1;

    google.protobuf.Timestamp data_hora = 2;

    string codigo = 3;

    string mensagem = 4;

    string correcao = 5;

    TipoOperacaoRejeicao operacao = 6;
  }

  repeated Rejeicao rejeicoes = 44;

  google.protobuf.Timestamp data_hora_autorizacao = 45;

  // Indica que a NFSe será emitida sem informar os dados do tomador
  bool sem_tomador = 49;

  // Intermediário da prestação de serviço
  Intermediario intermediario = 50;

  // Indica se possui subempreitada já tributada
  bool subempreitada = 51;

  // Indica se há comprovação de material
  bool comprovacao_material = 52;

  // Informações da nota substituta (substitui o campo numero_nota_substituta bool para retrocompatibilidade)
  NotaSubstituta nota_substituta = 53;

  // Informações de quando esta NFSe foi substituída por outra (preenchido automaticamente)
  NotaSubstituida nota_substituida = 59;

  // Município de incidência do ISS (pode diferir do local de prestação)
  MunicipioIncidencia municipio_incidencia = 54;

  // Flag para habilitar IBS/CBS (apenas empresas do Simples Nacional precisam desta flag)
  bool ibs_cbs_habilitado = 55;

  // Série da NFSe retornada pelo provedor (pode ser diferente da série do RPS)
  string serie = 57;

  // Data/hora da importação. Se preenchido, indica NFSe importada de XML externo (não emitida pelo sistema)
  google.protobuf.Timestamp importado_em = 58;

  // Informações declaradas referentes a IBS/CBS
  message IBSCBS {
    int32 fin_nfse = 1; // 0=regular, 1=crédito, 2=débito

    int32 ind_final = 2; // 0=Não, 1=Sim (será descontinuado)

    string c_ind_op = 3; // Código indicador operação (6 dígitos)

    int32 tp_oper = 4; // Tipo operação entes governamentais (1-5)

    repeated string ref_nfse = 5; // Chaves NFS-e referenciadas

    int32 tp_ente_gov = 6; // Tipo ente governamental (1-4, 9)

    string x_tp_ente_gov = 7; // Descrição quando tp_ente_gov=9

    int32 ind_dest = 8; // Indicador destinatário (0-4)

    message Destinatario {
      string cnpj = 1;

      string cpf = 2;

      string inscricao_municipal = 3;

      string nif = 4;

      int32 c_nao_nif = 5;

      string nome = 6;

      Tomador.Endereco endereco = 7;

      string fone = 8;

      string email = 9;
    }

    Destinatario dest = 9;

    message Adquirente {
      string cnpj = 1;

      string cpf = 2;

      string nif = 3;

      int32 c_nao_nif = 4;

      string nome = 5;

      Tomador.Endereco endereco = 6;

      string fone = 7;

      string email = 8;
    }

    Adquirente adq = 10;

    message Imovel {
      string insc_imob_fisc = 1;

      string c_cib = 2;

      Tomador.Endereco endereco = 3;
    }

    Imovel imovel = 11;

    message ValoresIBSCBS {
      message ReeRepRes {
        message Documento {
          int32 tipo_chave_dfe = 1; // 1=NFS-e, 2=NF-e, 3=CT-e, 9=Outro

          string x_tipo_chave_dfe = 2;

          string chave_dfe = 3;

          string c_mun_doc_fiscal = 4;

          string n_doc_fiscal = 5;

          string x_doc_fiscal = 6;

          string n_doc = 7;

          string x_doc = 8;

          string fornecedor_cnpj = 9;

          string fornecedor_cpf = 10;

          string fornecedor_nome = 11;

          string dt_emi_doc = 12;

          string dt_comp_doc = 13;

          int32 tp_ree_rep_res = 14;

          string x_tp_ree_rep_res = 15;

          double vlr_ree_rep_res = 16;
        }

        repeated Documento documentos = 1;
      }

      ReeRepRes g_ree_rep_res = 1;

      message TributosIBSCBS {
        string cst = 1; // Código situação tributária

        string c_class_trib = 2; // Código classificação tributária

        string c_cred_pres = 3; // Código crédito presumido

        message TribRegular {
          string cst_reg = 1;

          string c_class_trib_reg = 2;
        }

        TribRegular g_trib_regular = 4;

        message Diferimento {
          double p_dif_uf = 1;

          double p_dif_mun = 2;

          double p_dif_cbs = 3;
        }

        Diferimento g_dif = 5;
      }

      TributosIBSCBS trib = 2;
    }

    ValoresIBSCBS valores = 12;
  }

  IBSCBS ibscbs = 46;

  // Histórico de eventos da NFSe (envio email, autorização, cancelamento, etc)
  repeated EventoNfse eventos = 60;
}

// Request e Response para emissão de NFSe
message EmitirNfseRequest {
  Nfse nfse = 1; // Dados da NFSe a ser emitida
}

message EmitirNfseResponse {
  Nfse nfse = 1;
}

// Request e Response para cancelamento de NFSe
message CancelarNfseRequest {
  string id = 1; // ID da NFSe a ser cancelada

  CodigoCancelamento codigo_cancelamento = 2;

  string motivo_cancelamento = 3;
}

message CancelarNfseResponse {
  Nfse nfse = 1;
}

// Códigos de motivo de substituição (baseado no padrão ABRASF)
enum CodigoMotivoSubstituicao {
  CODIGO_MOTIVO_SUBSTITUICAO_NAO_ESPECIFICADO = 0;

  // Erro nos dados do tomador (nome, CNPJ, endereço, etc.)
  CODIGO_MOTIVO_SUBSTITUICAO_ERRO_TOMADOR = 1;

  // Erro no valor do serviço
  CODIGO_MOTIVO_SUBSTITUICAO_ERRO_VALOR = 2;

  // Erro na discriminação/descrição do serviço
  CODIGO_MOTIVO_SUBSTITUICAO_ERRO_DISCRIMINACAO = 3;

  // Erro na alíquota do ISS
  CODIGO_MOTIVO_SUBSTITUICAO_ERRO_ALIQUOTA = 4;

  // Outros erros
  CODIGO_MOTIVO_SUBSTITUICAO_OUTROS = 9;
}

// Request para substituição de NFSe
message SubstituirNfseRequest {
  // ID da NFSe a ser substituída (obrigatório)
  string nfse_id_original = 1;

  // Dados da nova NFSe que substituirá a original (obrigatório)
  // Deve conter todos os dados corrigidos
  Nfse nova_nfse = 2;

  // Código do motivo da substituição
  CodigoMotivoSubstituicao codigo_motivo = 3;

  // Descrição detalhada do motivo da substituição (mínimo 15 caracteres)
  string descricao_motivo = 4;
}

// Response da substituição de NFSe
message SubstituirNfseResponse {
  // NFSe original que foi substituída (com situação SUBSTITUIDA)
  Nfse nfse_original = 1;

  // Nova NFSe autorizada que substitui a original
  Nfse nfse_nova = 2;

  // Mensagem de retorno
  string mensagem = 3;
}

// API para consultar o lote da nfse, passando o protocolo como parametro
message ConsultarLoteRequest {
  dfe.Emitente emitente = 1;

  Ambiente ambiente = 2;

  string protocolo = 3;

  string id = 4;
}

message ConsultarLoteResponse {
  repeated Nfse nfse = 1;

  message Mensagens {
    enum CodigoConsultaLote {
      CODIGO_CONSULTA_LOTE_DESCONHECIDO = 0;

      CODIGO_CONSULTA_LOTE_EM_PROCESSAMENTO = 1;

      CODIGO_CONSULTA_LOTE_EM_NFSE_JA_EMITIDA = 2;

      CODIGO_CONSULTA_LOTE_NAO_ENCONTRADO = 3;
    }

    CodigoConsultaLote codigo = 1;

    string codigo_provedor = 2;

    string mensagem = 3;

    string correcao = 4;
  }

  repeated Mensagens mensagens_erro = 3;
}

// Request e Response para consulta de NFSe
message ConsultaNfseRequest {
  string id = 1; // ID da NFSe a ser consultada

  // Campos para consulta por RPS (usados quando id não é informado)
  string numero_rps = 2;

  string serie = 3;

  string cnpj_prestador = 4;

  string inscricao_municipal = 5;

  string codigo_municipio = 6;
}

message ConsultaNfseResponse {
  string mensagem = 1; // Mensagem de resposta

  Nfse nfse = 2; // retorna toda a NFSe
}

// Request e Response para criação de NFSe
message CreateNfseRequest {
  Nfse nfse = 1; // Dados da NFSe a ser criada
}

message CreateNfseResponse {
  Nfse nfse = 1;
}

// Request e Response para atualização de NFSe
message UpdateNfseRequest {
  string id = 1; // ID da NFSe a ser atualizada

  Nfse nfse = 2; // Dados da NFSe a ser atualizada

  metadata.FieldMask update_mask = 3;
}

message UpdateNfseResponse {
  Nfse nfse = 1;
}

// Request e Response para deleção de NFSe
message DeleteNfseRequest {
  string id = 1; // ID da NFSe a ser deletada

  bool hard = 2;
}

message DeleteNfseResponse {
}

// Request e Response para clone de NFSe
message CloneNfseRequest {
  string id = 1; // ID da NFSe a ser clonada
}

message CloneNfseResponse {
  Nfse nfse = 1;
}

// Request e Response para listagem de NFSe
message ListNfseRequest {
  repeated string ids = 1;

  repeated Situacao situacao = 2;

  google.protobuf.Timestamp data_hora_emissao_gte = 3;

  google.protobuf.Timestamp data_hora_emissao_lte = 4;

  Filter filter = 5;

  google.protobuf.Timestamp data_competencia_gte = 6;

  google.protobuf.Timestamp data_competencia_lte = 7;

  double total_gte = 8;

  double total_lte = 9;
}

message ListNfseResponse {
  repeated Nfse nfse_list = 1; // Lista de NFSes
}

// Request para obter uma NFSe
message GetNfseRequest {
  string id = 1; // ID da NFSe a ser obtida
}

message ImprimeDanfseRequest {
  repeated string ids = 1; // IDs das NFSes a serem impressas
}

message ImprimeDanfseResponse {
  string data = 1; // dados para impressao da nfse
}

message EnviaXmlNfseRequest {
  repeated string ids = 1; // IDs das NFS-e a serem enviadas

  string email = 2; // E-mail de destino; só vale quando todas as notas são do mesmo tomador, senão cada nota vai para o e-mail do próprio tomador

  string whatsapp_numero = 3; // Número do WhatsApp (com DDD); mesma regra do email

  string whatsapp_nome_destinatario = 4; // Nome do destinatário para personalizar mensagem

  string whatsapp_integration_id = 5; // ID da integração WhatsApp para envio via API (opcional)

  string email_integration_id = 6; // ID da integração de e-mail; vazio usa a resolução padrão do sistema

  CanalEnvioNfse canal = 7; // Canal do envio; vazio infere pelos destinatários informados (email e/ou whatsapp_numero)

  // Template aprovado da API oficial; obrigatório quando a conta é oficial e o
  // destinatário está fora da janela de 24h. Variáveis: nome e link, nesta ordem.
  string whatsapp_template_name = 8;

  string whatsapp_template_language = 9; // vazio usa pt_BR

  // Modelo de mensagem a usar; vazio usa o modelo padrão do canal.
  string message_template_id = 10;
}

enum CanalEnvioNfse {
  CANAL_ENVIO_NFSE_UNSPECIFIED = 0;

  CANAL_ENVIO_NFSE_EMAIL = 1;

  CANAL_ENVIO_NFSE_WHATSAPP = 2;
}

message EnviaXmlNfseResponse {
  string whatsapp_web_message = 1; // Mensagem formatada para WhatsApp Web; preenchida só quando há um único destinatário

  string public_download_link = 2; // Link público para download dos arquivos; preenchido só quando há um único destinatário

  repeated EnvioWhatsappWebNfse whatsapp_web_envios = 3; // Mensagem formatada para WhatsApp Web de cada destinatário

  repeated string falhas = 4; // Destinatários que não receberam, com o motivo
}

message EnvioWhatsappWebNfse {
  string numero = 1; // Número do WhatsApp com DDI

  string mensagem = 2; // Mensagem formatada para WhatsApp Web
}

message AddServicoRequest {
  string nfse_id = 1;

  Servico servico = 2;
}

message AddServicoResponse {
  Nfse nfse = 1;
}

message UpdateServicoRequest {
  string nfse_id = 1;

  // Id do servico a ser atualizado
  string id = 2;

  Servico servico = 3;
}

message UpdateServicoResponse {
  Servico servico = 1;

  Nfse nfse = 2;
}

message DeleteServicoRequest {
  string nfse_id = 1;

  // Id do serviço a ser removido
  string id = 2;
}

message DeleteServicoResponse {
  string result = 1;

  Nfse nfse = 2;
}

// Response para obter uma NFSe
message GetNfseResponse {
  string id = 1; // ID da NFSe

  Nfse nfse = 2; // Informações do emissor

  string status = 3; // Status da NFSe

  string mensagem = 4; // Mensagem adicional (se houver)
}

message GetDownloadLinkXmlRequest {
  string id = 1; // ID da NFSe a obter o xml
}

message GetDownloadLinkXmlResponse {
  string link = 1; // link para download
}

// Tipo de download para registro de evento
enum TipoDownload {
  TIPO_DOWNLOAD_NAO_ESPECIFICADO = 0;

  TIPO_DOWNLOAD_XML = 1;

  TIPO_DOWNLOAD_PDF = 2;
}

// Request para registrar evento de download
message RegistraEventoDownloadRequest {
  string id = 1; // ID da NFSe

  TipoDownload tipo = 2; // Tipo de download (XML ou PDF)
}

// Response do registro de evento de download
message RegistraEventoDownloadResponse {
  bool sucesso = 1;
}

// Request para relatório de NFSe
message ReportRequest {
  // Tipo do relatório (nfseListaSimples, nfseAgrupadoPorTomador)
  string tipo_relatorio = 1;

  // Filtros para busca das NFSes
  ListNfseRequest list_nfse_request = 2;
}

// Response do relatório
message ReportResponse {
  report.Response response = 1;
}

// Enum para formato de saída do XML por competência
enum FormatoXmlCompetencia {
  FORMATO_XML_COMPETENCIA_ZIP = 0; // ZIP com XMLs individuais (padrão)

  FORMATO_XML_COMPETENCIA_CONSOLIDADO = 1; // XML único no formato ListaNfseCompetencia
}

// Request para download de XML por competência
message DownloadXmlCompetenciaRequest {
  // Mês da competência (1-12)
  int32 mes = 1;

  // Ano da competência (ex: 2026)
  int32 ano = 2;

  // Formato de saída (ZIP ou XML consolidado)
  FormatoXmlCompetencia formato = 3;

  // Incluir PDF (DANFSe) no ZIP - ignorado se formato for XML consolidado
  bool incluir_pdf = 4;
}

// Response do download de XML por competência
message DownloadXmlCompetenciaResponse {
  // Link para download do arquivo
  string link = 1;

  // Nome do arquivo gerado
  string nome_arquivo = 2;

  // Quantidade de NFSe incluídas
  int32 quantidade_nfse = 3;

  // Valor total das NFSe incluídas
  double valor_total = 4;
}

// Request para envio de XML por competência via email/WhatsApp
message EnviaXmlCompetenciaRequest {
  // Mês da competência (1-12)
  int32 mes = 1;

  // Ano da competência (ex: 2026)
  int32 ano = 2;

  // Formato de saída (ZIP ou XML consolidado)
  FormatoXmlCompetencia formato = 3;

  // Incluir PDF (DANFSe) no ZIP - ignorado se formato for XML consolidado
  bool incluir_pdf = 4;

  // Email para envio (opcional se whatsapp_numero informado)
  string email = 5;

  // Número do WhatsApp com DDD (opcional se email informado)
  string whatsapp_numero = 6;

  // Nome do destinatário para personalizar mensagem
  string nome_destinatario = 7;
}

// Response do envio de XML por competência
message EnviaXmlCompetenciaResponse {
  // Mensagem formatada para WhatsApp Web (se whatsapp_numero informado)
  string whatsapp_web_message = 1;

  // Link público para download dos arquivos
  string public_download_link = 2;

  // Quantidade de NFSe incluídas
  int32 quantidade_nfse = 3;

  // Valor total das NFSe incluídas
  double valor_total = 4;
}

// Modo de atualização para importação de NFSe
enum ImportaXmlModoAtualizacao {
  // Não sobrescrever - ignora NFSes que já existem
  IMPORTA_XML_MODO_NAO_SOBRESCREVER = 0;

  // Mesclar - atualiza apenas campos vazios do registro existente
  IMPORTA_XML_MODO_MESCLAR = 1;

  // Sobrescrever total - substitui completamente o registro existente
  IMPORTA_XML_MODO_SOBRESCREVER = 2;
}

// Request para importação de XML de NFSe
message ImportaXmlRequest {
  // Conteúdo do arquivo em base64
  string arquivo_base64 = 1;

  // Extensão do arquivo (.xml ou .zip)
  string extensao = 2;

  // Nome original do arquivo
  string nome_arquivo = 3;

  // Importar tomador para o cadastro de clientes
  bool importa_tomador = 4;

  // Importar serviços para o cadastro de serviços
  bool importa_servicos = 5;

  // Modo de atualização para NFSes existentes
  ImportaXmlModoAtualizacao modo_atualizacao = 6;
}

// Response da importação de XML de NFSe
message ImportaXmlResponse {
  // Lista de NFSe importadas com sucesso
  repeated Nfse nfse_list = 1;

  // Total de notas importadas (novas + atualizadas)
  int32 total_importadas = 2;

  // Total de erros encontrados
  int32 total_erros = 3;

  // Mensagens de erro ou avisos
  repeated string mensagens = 4;

  // Total de notas ignoradas (já existiam e modo era não sobrescrever)
  int32 total_ignoradas = 5;

  // Total de notas atualizadas (mescladas ou sobrescritas)
  int32 total_atualizadas = 6;
}
