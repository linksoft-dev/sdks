syntax = "proto3";

package cte;

import "google/api/annotations.proto";

import "google/protobuf/timestamp.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "common/metadata/metadata.proto";

import "filter/filter.proto";

import "apps/report/report.proto";

option go_package = "comps/pb/apps/dfe/cte";

// Serviço CT-e com operações de CRUD e eventos principais
service CteService {
  rpc Create ( CreateCteRequest ) returns ( CreateCteResponse );

  rpc Update ( UpdateCteRequest ) returns ( UpdateCteResponse );

  rpc Delete ( DeleteCteRequest ) returns ( DeleteCteResponse );

  rpc Get ( GetCteRequest ) returns ( GetCteResponse );

  rpc List ( ListCteRequest ) returns ( ListCteResponse );

  rpc Imprimir ( ImprimirCteRequest ) returns ( ImprimirCteResponse );

  rpc EmitirCte ( EmitirCteRequest ) returns ( EmitirCteResponse );

  rpc CancelarCte ( CancelarCteRequest ) returns ( CancelarCteResponse );

  rpc CorrigirCte ( CorrigirCteRequest ) returns ( CorrigirCteResponse );

  rpc ConsultaProtocolo ( ConsultaProtocoloRequest ) returns ( ConsultaProtocoloResponse );

  rpc GetWsStatus ( GetWsStatusRequest ) returns ( GetWsStatusResponse );

  // Importar XML de CT-e (CT-e ou CT-e processado)
  rpc ImportarXml ( ImportarXmlRequest ) returns ( ImportarXmlResponse );

  rpc AddDocumentoReferenciado ( AddDocumentoReferenciadoRequest ) returns ( AddDocumentoReferenciadoResponse );

  rpc UpdateDocumentoReferenciado ( UpdateDocumentoReferenciadoRequest ) returns ( UpdateDocumentoReferenciadoResponse );

  rpc DeleteDocumentoReferenciado ( DeleteDocumentoReferenciadoRequest ) returns ( DeleteDocumentoReferenciadoResponse );

  rpc AddComponentePrestacao ( AddComponentePrestacaoRequest ) returns ( AddComponentePrestacaoResponse );

  rpc UpdateComponentePrestacao ( UpdateComponentePrestacaoRequest ) returns ( UpdateComponentePrestacaoResponse );

  rpc DeleteComponentePrestacao ( DeleteComponentePrestacaoRequest ) returns ( DeleteComponentePrestacaoResponse );
}

// Ambiente de autorização
enum Ambiente {
  AMBIENTE_UNSPECIFIED = 0;

  AMBIENTE_HOMOLOGACAO = 1; // "h"

  AMBIENTE_PRODUCAO = 2; // "p"
}

// Situação operacional do CT-e
enum SituacaoCte {
  SITUACAO_UNSPECIFIED = 0;

  SITUACAO_DIGITADO = 1;

  SITUACAO_AUTORIZADO = 2;

  SITUACAO_REJEITADO = 3;

  SITUACAO_CANCELADO = 4;

  SITUACAO_DENEGADO = 5; // uso denegado pela SEFAZ (irregularidade fiscal); número é consumido
}

enum TipoCte {
  TIPO_CTE_UNSPECIFIED = 0;

  TIPO_CTE_NORMAL = 1;

  TIPO_CTE_COMPLEMENTAR = 2;

  TIPO_CTE_ANULACAO = 3;

  TIPO_CTE_SUBSTITUICAO = 4;
}

enum TipoServicoCte {
  TIPO_SERVICO_UNSPECIFIED = 0;

  TIPO_SERVICO_NORMAL = 1;

  TIPO_SERVICO_SUBCONTRATACAO = 2;

  TIPO_SERVICO_REDESPACHO = 3;

  TIPO_SERVICO_REDESPACHO_INTERMEDIARIO = 4;

  TIPO_SERVICO_MULTIMODAL = 5;
}

enum TomadorServico {
  TOMADOR_SERVICO_UNSPECIFIED = 0;

  TOMADOR_SERVICO_REMETENTE = 1;

  TOMADOR_SERVICO_EXPEDIDOR = 2;

  TOMADOR_SERVICO_RECEBEDOR = 3;

  TOMADOR_SERVICO_DESTINATARIO = 4;

  TOMADOR_SERVICO_OUTROS = 5;
}

enum ModalCte {
  MODAL_CTE_UNSPECIFIED = 0;

  MODAL_CTE_RODOVIARIO = 1;

  MODAL_CTE_AEREO = 2;

  MODAL_CTE_AQUAVIARIO = 3;

  MODAL_CTE_FERROVIARIO = 4;

  MODAL_CTE_DUTOVIARIO = 5;

  MODAL_CTE_MULTIMODAL = 6;
}

// Registro principal do CT-e
message Cte {
  google.protobuf.Timestamp created_at = 1;

  google.protobuf.Timestamp updated_at = 2;

  string user_id = 3;

  string user_name = 4;

  string id = 5;

  metadata.BasicFields fields = 6;

  string account_id = 7;

  Ambiente ambiente = 8;

  uint32 serie = 9;

  uint32 numero = 10;

  string chave = 11;

  string protocolo = 12;

  SituacaoCte situacao = 13;

  double valor_prestacao = 17;

  string xml = 18;

  google.protobuf.Timestamp data_emissao = 21;

  string operacao = 22;

  string cfop = 23;

  string natureza_operacao = 24;

  TipoCte tipo_cte = 25;

  TipoServicoCte tipo_servico = 26;

  ModalCte modal = 27;

  bool cte_globalizado = 28;

  int32 municipio_inicio_codigo = 29;

  string municipio_inicio_nome = 30;

  string uf_inicio = 31;

  int32 municipio_fim_codigo = 32;

  string municipio_fim_nome = 33;

  string uf_fim = 34;

  double valor_receber = 43;

  double valor_pedagio = 44;

  double valor_tributos = 45;

  string produto_predominante = 46;

  string produto_predominante_id = 72; // vínculo ao cadastro de Produto (id do registro selecionado na tela)

  double valor_carga = 47;

  double peso_total = 48;

  double quantidade_carga = 49;

  string observacao = 50;

  google.protobuf.Timestamp data_hora_autorizacao = 51;

  string xml_autorizacao = 52;

  Tomador tomador = 57;

  Parte remetente = 58;

  Parte destinatario = 59;

  repeated Rejeicao rejeicoes = 60;

  Parte expedidor = 61;

  Parte recebedor = 62;

  Cancelamento cancelamento = 63;

  repeated DocReferenciado documentos_referenciados = 64;

  string rntrc = 65; // RNTRC do transportador (modal rodoviário), informado pelo usuário

  // ICMS da prestação (informado pelo usuário). icms_cst define a situação tributária.
  string icms_cst = 66; // 00, 20, 45, 60, 90, SN

  double icms_v_bc = 67; // base de cálculo

  double icms_p_icms = 68; // alíquota (%)

  double icms_v_icms = 69; // valor do ICMS

  double icms_p_red_bc = 70; // % de redução da BC (CST 20)

  // Componentes do valor da prestação (vPrest/Comp): frete, pedágio, gris, seguro, etc.
  repeated ComponenteVprest componentes_prestacao = 71;
}

// Tipo do componente do valor da prestação. Define o xNome canônico que vai ao XML.
enum TipoComponenteVprest {
  TIPO_COMPONENTE_UNSPECIFIED = 0;

  TIPO_COMPONENTE_FRETE_PESO = 1; // "FRETE PESO"

  TIPO_COMPONENTE_FRETE_VALOR = 2; // "FRETE VALOR"

  TIPO_COMPONENTE_PEDAGIO = 3; // "PEDAGIO"

  TIPO_COMPONENTE_GRIS = 4; // "GRIS"

  TIPO_COMPONENTE_SEGURO = 5; // "SEGURO"

  TIPO_COMPONENTE_DESPACHO = 6; // "DESPACHO"

  TIPO_COMPONENTE_OUTROS = 99; // nome livre informado pelo usuário
}

// Componente do valor da prestação do serviço (vPrest/Comp do CT-e).
message ComponenteVprest {
  string id = 1; // identificador interno para gestão da lista (não vai ao XML)

  TipoComponenteVprest tipo = 2;

  string nome = 3; // xNome do XML: nome canônico do tipo, ou livre quando OUTROS

  double valor = 4;
}

// Documento fiscal referenciado pelo CT-e (NF-e/NF transportada)
message DocReferenciado {
  string chave = 1;

  string modelo = 2;

  string id = 3;
}

message Parte {
  string documento = 1;

  string nome = 2;

  string ie = 3;

  string fone = 4;

  string email = 5;

  string endereco = 6;

  string numero = 7;

  string complemento = 8;

  string bairro = 9;

  string cidade = 10;

  int32 cidade_codigo = 11;

  string uf = 12;

  string cep = 13;

  string id = 14; // vínculo ao cadastro de Pessoa (id do registro selecionado na tela)
}

message Tomador {
  TomadorServico servico = 1;

  string documento = 2;

  string nome = 3;

  string ie = 4;

  string id = 5; // vínculo ao cadastro de Pessoa (id do registro selecionado na tela)
}

message Cancelamento {
  string protocolo = 1;

  string motivo = 2;

  google.protobuf.Timestamp data_hora = 3;

  string xml = 4;
}

message Rejeicao {
  string id = 1;

  google.protobuf.Timestamp data_hora = 2;

  google.protobuf.Timestamp data_hora_situacao_doc = 3;

  string cstat = 4;

  string mensagem = 5;
}

// CRUD
message CreateCteRequest {
  Cte cte = 1;
}

message CreateCteResponse {
  Cte cte = 1;
}

message UpdateCteRequest {
  string id = 1;

  Cte cte = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateCteResponse {
  Cte cte = 1;
}

message DeleteCteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteCteResponse {
  bool success = 1;
}

message GetCteRequest {
  string id = 1;
}

message GetCteResponse {
  Cte cte = 1;
}

message ListCteRequest {
  repeated string ids = 1;

  string main = 2;

  repeated string situacao = 3;

  google.protobuf.Timestamp created_at_gte = 4;

  google.protobuf.Timestamp created_at_lte = 5;

  uint32 page_size = 6;

  string page_token = 7;

  Filter filter = 8;
}

message ListCteResponse {
  repeated Cte cte_list = 1;

  int32 total = 2;
}

// Emitir
message EmitirCteRequest {
  string id = 1;
}

message EmitirCteResponse {
  Cte cte = 1;

  string mensagem = 2;
}

// Cancelar
message CancelarCteRequest {
  string id = 1;

  string motivo = 2;
}

message CancelarCteResponse {
  Cte cte = 1;

  string mensagem = 2;
}

// Corrigir (CC-e)
message CorrigirCteRequest {
  string id = 1;

  string correcao = 2;
}

message CorrigirCteResponse {
  Cte cte = 1;

  string mensagem = 2;
}

// Consulta Protocolo
message ConsultaProtocoloRequest {
  string id = 1;

  string chave = 2;
}

message ConsultaProtocoloResponse {
  string protocolo = 1;

  string situacao = 2;

  string mensagem = 3;
}

// Status do WebService
message GetWsStatusRequest {
  string uf = 1;

  string ambiente = 2;
}

message GetWsStatusResponse {
  string status = 1;

  string mensagem = 2;
}

// Imprimir DACTE
message ImprimirCteRequest {
  string id = 1;
}

message ImprimirCteResponse {
  report.Response response = 1;
}

// Importar XML de CT-e
message ImportarXmlRequest {
  // XML do CT-e ou CT-e processado (procCTe)
  string xml = 1;
}

message ImportarXmlResponse {
  Cte cte = 1;
}

message AddDocumentoReferenciadoRequest {
  string cte_id = 1;

  DocReferenciado documento = 2;
}

message AddDocumentoReferenciadoResponse {
  Cte cte = 1;
}

message UpdateDocumentoReferenciadoRequest {
  string cte_id = 1;

  string id = 2;

  DocReferenciado documento = 3;
}

message UpdateDocumentoReferenciadoResponse {
  Cte cte = 1;
}

message DeleteDocumentoReferenciadoRequest {
  string cte_id = 1;

  string id = 2;
}

message DeleteDocumentoReferenciadoResponse {
  Cte cte = 1;
}

message AddComponentePrestacaoRequest {
  string cte_id = 1;

  ComponenteVprest componente = 2;
}

message AddComponentePrestacaoResponse {
  Cte cte = 1;
}

message UpdateComponentePrestacaoRequest {
  string cte_id = 1;

  string id = 2;

  ComponenteVprest componente = 3;
}

message UpdateComponentePrestacaoResponse {
  Cte cte = 1;
}

message DeleteComponentePrestacaoRequest {
  string cte_id = 1;

  string id = 2;
}

message DeleteComponentePrestacaoResponse {
  Cte cte = 1;
}
