syntax = "proto3";

package convenio;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/posto/convenio";

// Convênio de frota: o cliente abastece a prazo e recebe uma fatura por período.
service ConvenioService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  // Fatura agora os títulos em aberto do convênio, sem esperar o dia do fechamento. O vencimento
  // é hoje mais o prazo do convênio.
  rpc Fatura ( FaturaRequest ) returns ( FaturaResponse );
}

enum Fechamento {
  FECHAMENTO_MENSAL = 0;

  FECHAMENTO_QUINZENAL = 1;

  FECHAMENTO_SEMANAL = 2;
}

message Convenio {
  google.protobuf.Timestamp created_at = 1;

  google.protobuf.Timestamp updated_at = 2;

  string user_id = 3;

  string user_name = 4;

  string id = 5;

  metadata.BasicFields fields = 6;

  // Cliente do convênio. Cada cliente tem um convênio só.
  string pessoa_id = 7;

  string pessoa_nome = 8;

  bool ativo = 9;

  // Período da fatura. Mensal fecha no dia_fechamento (no último dia do mês, quando ele é mais
  // curto); quinzenal fecha no dia 15 e no último dia do mês; semanal fecha no dia da semana
  // dia_fechamento (1 segunda-feira ... 7 domingo). A fatura sai no dia seguinte ao fechamento,
  // com as vendas até o fim do dia do fechamento.
  Fechamento fechamento = 10;

  int32 dia_fechamento = 11;

  // Dias entre o fechamento e o vencimento da fatura.
  int32 prazo_vencimento_dias = 12;

  // Forma de pagamento a prazo das vendas do convênio: os títulos dela entram na fatura.
  string forma_pagamento_id = 13;

  string forma_pagamento_nome = 14;

  // A venda do convênio sai com NF-e (modelo 55) em vez de NFC-e.
  bool emite_nfe = 15;

  // A venda exige o km do veículo.
  bool exige_km = 16;

  // A venda exige o nome do motorista.
  bool exige_motorista = 17;

  // Recusa a venda quando o cliente tem título vencido há mais que estes dias. Zero não bloqueia.
  int32 bloqueia_atraso_dias = 18;

  string obs = 19;
}

message CreateRequest {
  Convenio convenio = 1;
}

message CreateResponse {
  Convenio convenio = 1;
}

message UpdateRequest {
  string id = 1;

  Convenio convenio = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  Convenio convenio = 1;
}

message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

message GetRequest {
  string id = 1;
}

message GetResponse {
  Convenio convenio = 1;
}

message ListRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListResponse {
  repeated Convenio convenio_list = 1;

  string next_page_token = 2;
}

message FaturaRequest {
  string id = 1;
}

message FaturaResponse {
  // Id da conta a receber da fatura; vazio quando não havia título em aberto.
  string conta_id = 1;

  int32 titulos = 2;

  double valor = 3;
}
