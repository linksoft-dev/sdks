syntax = "proto3";

package veiculo;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/posto/veiculo";

// Veículos das frotas conveniadas, com os limites e os motoristas de cada um.
service VeiculoService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  // Confere se a venda pode sair para o veículo ligado a ela: convênio ativo, combustível
  // permitido, limites, km, motorista e títulos em atraso. É a mesma regra aplicada no
  // pagamento da venda.
  rpc Autoriza ( AutorizaRequest ) returns ( AutorizaResponse );

  // Veículos ativos com tag, para o agente da pista cadastrar na automação. Só o agente pareado
  // chama.
  rpc Tags ( TagsRequest ) returns ( TagsResponse );
}

message ProdutoPermitido {
  string produto_id = 1;

  string produto_nome = 2;
}

message Motorista {
  string nome = 1;

  string cpf = 2;
}

message Veiculo {
  google.protobuf.Timestamp created_at = 1;

  google.protobuf.Timestamp updated_at = 2;

  string user_id = 3;

  string user_name = 4;

  string id = 5;

  metadata.BasicFields fields = 6;

  // Cliente dono do veículo, que precisa ter convênio.
  string pessoa_id = 7;

  string pessoa_nome = 8;

  // Placa sem traço, em maiúsculas. Não se repete na empresa.
  string placa = 9;

  string modelo = 10;

  // Combustíveis que o veículo pode abastecer. Vazio aceita qualquer um.
  repeated ProdutoPermitido combustiveis = 11;

  // Limites do veículo. Zero não limita.
  double limite_litros_abastecimento = 12;

  double limite_valor_abastecimento = 13;

  double limite_litros_dia = 14;

  double limite_litros_mes = 15;

  // Quem pode abastecer o veículo. Vazio aceita qualquer motorista.
  repeated Motorista motoristas = 16;

  // Maior km informado numa venda fechada do veículo; somente leitura.
  double ultimo_km = 17;

  bool ativo = 18;

  string obs = 19;

  // Código da tag (RFID) instalada no veículo, como a automação da pista lê. Não se repete na
  // empresa.
  string tag = 20;
}

message CreateRequest {
  Veiculo veiculo = 1;
}

message CreateResponse {
  Veiculo veiculo = 1;
}

message UpdateRequest {
  string id = 1;

  Veiculo veiculo = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  Veiculo veiculo = 1;
}

message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

message GetRequest {
  string id = 1;
}

message GetResponse {
  Veiculo veiculo = 1;
}

message ListRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListResponse {
  repeated Veiculo veiculo_list = 1;

  string next_page_token = 2;
}

message AutorizaRequest {
  // Venda com o veículo, o km e o motorista já informados.
  string pedido_id = 1;
}

message AutorizaResponse {
  Veiculo veiculo = 1;

  // Litros já vendidos ao veículo hoje e no mês, sem contar esta venda.
  double litros_dia = 2;

  double litros_mes = 3;
}

message TagsRequest {
}

message TagVeiculo {
  string tag = 1;

  string placa = 2;

  string cliente = 3;

  // Litros por abastecimento; zero não limita.
  double limite_litros = 4;

  // Nível de preço da bomba: 1 à vista, 2 a prazo (tabela da forma de pagamento do convênio).
  int32 nivel_preco = 5;
}

message TagsResponse {
  repeated TagVeiculo tags = 1;
}
