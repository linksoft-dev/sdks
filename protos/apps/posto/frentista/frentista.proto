syntax = "proto3";

package frentista;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/posto/frentista";

// Frentistas do posto e a identificação deles no caixa, por senha ou cartão.
service FrentistaService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  // Identifica o frentista pela senha digitada ou pelo cartão lido no caixa.
  rpc Identifica ( IdentificaRequest ) returns ( IdentificaResponse );
}

message Frentista {
  google.protobuf.Timestamp created_at = 1;

  google.protobuf.Timestamp updated_at = 2;

  string user_id = 3;

  string user_name = 4;

  string id = 5;

  metadata.BasicFields fields = 6;

  // Pessoa do frentista: é quem aparece como vendedor da venda.
  string pessoa_id = 7;

  string pessoa_nome = 8;

  bool ativo = 9;

  // Senha numérica de 4 a 6 dígitos. Só é informada ao gravar; nunca volta na consulta.
  string pin = 10;

  // Código do cartão ou crachá lido no leitor. Só é informado ao gravar; nunca volta na consulta.
  string cartao = 11;

  // Indica se há senha gravada. Na alteração, false apaga a senha.
  bool tem_pin = 12;

  // Indica se há cartão gravado. Na alteração, false apaga o cartão.
  bool tem_cartao = 13;

  // Identificação que a automação da pista informa quando o frentista se identifica na bomba.
  string identificador_automacao = 14;

  string obs = 15;

  string pin_hash = 16;

  string cartao_hash = 17;
}

message CreateRequest {
  Frentista frentista = 1;
}

message CreateResponse {
  Frentista frentista = 1;
}

message UpdateRequest {
  string id = 1;

  Frentista frentista = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  Frentista frentista = 1;
}

message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

message GetRequest {
  string id = 1;
}

message GetResponse {
  Frentista frentista = 1;
}

message ListRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListResponse {
  repeated Frentista frentista_list = 1;

  string next_page_token = 2;
}

message IdentificaRequest {
  // Senha digitada ou código lido do cartão.
  string credencial = 1;
}

message IdentificaResponse {
  Frentista frentista = 1;
}
