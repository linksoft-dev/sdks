syntax = "proto3";

package lmc;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

import "apps/report/report.proto";

option go_package = "comps/pb/apps/posto/lmc";

// Livro de Movimentação de Combustíveis: uma folha por dia e por combustível.
service LmcService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  // Monta a folha do dia a partir dos abastecimentos, das medições e das notas de entrada,
  // sem gravar: o operador confere e salva.
  rpc Preenche ( PreencheRequest ) returns ( PreencheResponse );

  // Dados para impressão das folhas selecionadas.
  rpc Report ( ReportRequest ) returns ( ReportResponse );
}

message LmcTanque {
  int32 numero = 1;

  double abertura = 2;

  double conciliacao = 3;
}

message LmcEntrada {
  string numero_nf = 1;

  string data_nf = 2;

  int32 numero_tanque = 3;

  double volume_recebido = 4;

  string nfe_id = 5;
}

message LmcVenda {
  int32 numero_bico = 1;

  int32 numero_tanque = 2;

  double abertura = 3;

  double fechamento = 4;

  double afericao = 5;

  // Valor em que o encerrante virou a zero no dia; zero quando não virou.
  double virada_encerrante = 6;

  double vendas_no_bico = 7;
}

message Lmc {
  google.protobuf.Timestamp created_at = 1;

  google.protobuf.Timestamp updated_at = 2;

  string user_id = 3;

  string user_name = 4;

  string id = 5;

  metadata.BasicFields fields = 6;

  int32 numero = 7;

  // Dia do livro.
  google.protobuf.Timestamp data = 8;

  string produto_id = 9;

  string produto_nome = 10;

  string codigo_anp = 11;

  double preco_avista = 12;

  double preco_aprazo = 13;

  repeated LmcTanque tanques = 14;

  repeated LmcEntrada entradas = 15;

  repeated LmcVenda vendas = 16;

  string obs = 17;

  double estoque_abertura = 18;

  double total_recebido = 19;

  double volume_disponivel = 20;

  double vendas_dia_qtde = 21;

  double valor_vendas_dia = 22;

  double estoque_escritural = 23;

  double estoque_fechamento = 24;

  double perdas_sobras = 25;

  double valor_acumulado = 26;
}

message CreateRequest {
  Lmc lmc = 1;
}

message CreateResponse {
  Lmc lmc = 1;
}

message UpdateRequest {
  string id = 1;

  Lmc lmc = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  Lmc lmc = 1;
}

message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

message GetRequest {
  string id = 1;
}

message GetResponse {
  Lmc lmc = 1;
}

message ListRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListResponse {
  repeated Lmc lmc_list = 1;

  string next_page_token = 2;
}

message PreencheRequest {
  // Dia do livro, AAAA-MM-DD.
  string data = 1;

  string produto_id = 2;
}

message PreencheResponse {
  Lmc lmc = 1;

  repeated string avisos = 2;
}

message ReportRequest {
  ListRequest list_request = 1;

  string tipo_relatorio = 2;
}

message ReportResponse {
  report.Response response = 1;
}
