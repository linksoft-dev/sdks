syntax = "proto3";

import "google/api/annotations.proto";

import "google/protobuf/timestamp.proto";

import "apps/org/org.proto";

import "apps/user/user.proto";

option go_package = "comps/pb/apps/auth/v1";

service AuthService {
  rpc Login ( LoginRequest ) returns ( LoginResponse );
}

message LoginRequest {
  string username = 1;

  string password = 2;

  string device_id = 3; // identificador do dispositivo (UUID gerado pelo cliente)

  // Quando informado, o login fica restrito a esta organização: a resposta traz
  // apenas ela e usuários sem acesso a ela são recusados.
  string org_id = 4;
}

message LoginResponse {
  string user_id = 2;

  string name = 3;

  string email = 4;

  orgLoginModel current_org = 5;

  string token = 6;

  repeated orgLoginModel orgs = 7;

  string avatar_link = 8;

  user.UserSettings settings = 9;
}

// Definição da mensagem orgLoginModel
message orgLoginModel {
  string id = 1;

  string name = 2;

  string cpf_cnpj = 3;

  string org_codinome = 4;

  org.Licenciamento licenciamento = 5;

  string chat_javascript_code = 6;

  string dados_suporte = 7;

  string revenda_id = 8;

  string permissoes = 9;

  map<string, bool> permissoes_by_key = 10;

  google.protobuf.Timestamp revenda_at = 11; // data em que a org se tornou revenda (se preenchido, é revenda)

  org.WhiteLabelConfig white_label = 12;

  bool is_linksoft = 13; // true quando esta org é a Linksoft (revenda-raiz que aprova white-label)

  string identification = 14; // identificação única e legível da organização, usada em endereços públicos

  string portal_slug = 15; // palavra escolhida pela empresa para o endereço do portal do cliente

  string group_id = 16; // grupo de empresas a que a organização pertence, quando houver

  string group_name = 17;
}
