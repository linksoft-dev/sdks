syntax = "proto3";

package caixa;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/financeiro/caixa";

// Serviço Caixa com operações CRUD
service CaixaService {
  rpc Create ( CreateCaixaRequest ) returns ( CreateCaixaResponse );

  rpc Update ( UpdateCaixaRequest ) returns ( UpdateCaixaResponse );

  rpc Delete ( DeleteCaixaRequest ) returns ( DeleteCaixaResponse );

  rpc Get ( GetCaixaRequest ) returns ( GetCaixaResponse );

  rpc List ( ListCaixaRequest ) returns ( ListCaixaResponse );
}

// Dados do Caixa
message Caixa {
  google.protobuf.Timestamp created_at = 1; // Data de criação

  google.protobuf.Timestamp updated_at = 2; // Data de atualização

  string user_id = 3; // ID do usuário que realizou a ação

  string user_name = 4; // Nome do usuário que realizou a ação

  string id = 5;

  string nome = 6;

  CashType type = 7;

  string logo = 8;

  string tipo_moeda = 9;

  BankAccount bank_account = 10;

  Card card = 11;

  double monthly_budget = 12; // Orçamento mensal padrão do perfil/carteira

  repeated MonthlyBudgetOverride monthly_budgets = 13; // Substituições de orçamento por mês específico

  metadata.BasicFields fields = 14;
}

enum CashType {
  CASH_TYPE_UNSPECIFIED = 0;

  CASH_TYPE_CAIXA = 1;

  CASH_TYPE_CASH = 2;

  CASH_TYPE_CREDIT_CARD = 3;

  CASH_TYPE_DEBIT_CARD = 4;

  CASH_TYPE_BANK_TRANSFER = 5;

  CASH_TYPE_OTHER = 6;
}

message BankAccount {
  string id = 1;

  string bank_name = 2;

  string agency = 3;

  string account = 4;
}

message Card {
  string id = 1;

  string card_name = 2;

  string card_number = 3;

  string card_brand = 4;

  string card_expiration_date = 5;

  string card_cvv = 6;

  string card_token = 7;
}

message MonthlyBudgetOverride {
  string month = 1; // Formato "YYYY-MM"

  double budget = 2; // Orçamento para esse mês específico
}

// Request e Response para criação de Caixa
message CreateCaixaRequest {
  Caixa caixa = 1;
}

message CreateCaixaResponse {
  Caixa caixa = 1;
}

// Request e Response para atualização de Caixa
message UpdateCaixaRequest {
  string id = 1; // ID da NFSe a ser atualizada

  Caixa caixa = 2;

  metadata.FieldMask update_mask = 3;
}

// Request e Response para atualização de Caixa
message UpdateCaixaResponse {
  Caixa caixa = 1;
}

// Request e Response para exclusão de Caixa
message DeleteCaixaRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteCaixaResponse {
  string id = 1;
}

// Request para obter um Caixa por ID
message GetCaixaRequest {
  string id = 1;
}

// Request para obter um Caixa por ID
message GetCaixaResponse {
  Caixa caixa = 1;
}

// Request e Response para listagem de Caixas
message ListCaixaRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListCaixaResponse {
  repeated Caixa caixaList = 1;

  string next_page_token = 2;
}
