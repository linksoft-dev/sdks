syntax = "proto3";

package movimentocaixa;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

import "apps/report/report.proto";

option go_package = "comps/pb/apps/financeiro/movimentocaixa";

// Serviço MovimentoCaixa com operações CRUD
service MovimentoCaixaService {
  rpc Create ( CreateMovimentoCaixaRequest ) returns ( CreateMovimentoCaixaResponse );

  rpc Update ( UpdateMovimentoCaixaRequest ) returns ( UpdateMovimentoCaixaResponse );

  rpc Delete ( DeleteMovimentoCaixaRequest ) returns ( DeleteMovimentoCaixaResponse );

  rpc Get ( GetMovimentoCaixaRequest ) returns ( GetMovimentoCaixaResponse );

  rpc List ( ListMovimentoCaixaRequest ) returns ( ListMovimentoCaixaResponse );

  rpc Report ( ReportMovimentoCaixaRequest ) returns ( ReportMovimentoCaixaResponse );

  rpc GetSaldo ( GetSaldoMovimentoCaixaRequest ) returns ( GetSaldoMovimentoCaixaResponse );

  rpc TransferenciaCaixa ( TransferenciaCaixaRequest ) returns ( TransferenciaCaixaResponse );

  rpc BatchUpdate ( BatchUpdateRequest ) returns ( BatchUpdateResponse );

  rpc Resumo ( ResumoMovimentoCaixaRequest ) returns ( ResumoMovimentoCaixaResponse );
}

// Dados do MovimentoCaixa
message MovimentoCaixa {
  google.protobuf.Timestamp created_at = 1; // Data de criação

  google.protobuf.Timestamp updated_at = 2; // Data de atualização

  google.protobuf.Timestamp competence = 3; // Data de competencia da movimentacao

  string user_id = 4; // ID do usuário que realizou a ação

  string user_name = 5; // Nome do usuário que realizou a ação

  string id = 6;

  int32 code = 7;

  string descricao = 8;

  string pessoa_id = 9;

  string pessoa_nome = 10;

  string plano_conta_id = 11;

  string plano_conta_nome = 12;

  string centro_custo_id = 13;

  string centro_custo_nome = 14;

  string forma_pagamento_id = 15;

  string forma_pagamento_nome = 16;

  string tipo_pagamento = 17;

  string caixa_nome = 18;

  string caixa = 19;

  string wallet_nome = 20;

  string wallet_id = 21;

  string tipo_moeda = 22;

  string operacao = 23;

  double valor = 24;

  double saldo = 25;

  string obs = 26;

  string source = 27;

  string source_id = 28;

  string doc_number = 29;

  string reverse_reason = 30;

  google.protobuf.Timestamp data_hora_inicial = 31;

  google.protobuf.Timestamp data_hora_final = 32;
}

// Request do resumo agregado do caixa: reaproveita o mesmo filtro/escopo da listagem.
message ResumoMovimentoCaixaRequest {
  ListMovimentoCaixaRequest list = 1;
}

// Resumo agregado do caixa para o filtro informado, independente da paginação da
// listagem. Valores em espécie (abertura/entradas/saídas/saldo) consideram apenas
// dinheiro. saida é sempre magnitude positiva.
message ResumoMovimentoCaixaResponse {
  double abertura_especie = 1;

  double entradas_especie = 2;

  double saidas_especie = 3;

  double saldo_especie = 4;

  double total_recebiveis = 5;

  repeated ResumoPorTipo recebiveis_por_tipo = 6;

  double faturamento = 7;

  int64 count_vendas = 8;

  int64 count_sangria = 9;

  int64 count_suprimento = 10;

  repeated ResumoGrupo por_tipo_pagamento = 11;

  repeated ResumoGrupo por_plano_conta = 12;
}

message ResumoPorTipo {
  string tipo_pagamento = 1;

  double total = 2;
}

// Uma linha da movimentação resumida: uma categoria (tipo de pagamento ou plano de
// conta) de um usuário, com entrada e saída (saída como magnitude positiva).
message ResumoGrupo {
  string categoria = 1;

  string user_id = 2;

  string user_name = 3;

  double entrada = 4;

  double saida = 5;
}

// Request e Response para criação de MovimentoCaixa
message CreateMovimentoCaixaRequest {
  MovimentoCaixa movimento_caixa = 1;
}

message CreateMovimentoCaixaResponse {
  MovimentoCaixa movimento_caixa = 1;
}

// Request e Response para atualização de MovimentoCaixa
message UpdateMovimentoCaixaRequest {
  string id = 1; // ID da NFSe a ser atualizada

  MovimentoCaixa movimento_caixa = 2;

  metadata.FieldMask update_mask = 3;
}

// Request e Response para atualização de MovimentoCaixa
message UpdateMovimentoCaixaResponse {
  MovimentoCaixa movimento_caixa = 1;
}

// Request e Response para exclusão de MovimentoCaixa
message DeleteMovimentoCaixaRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteMovimentoCaixaResponse {
  string id = 1;
}

// Request para obter um MovimentoCaixa por ID
message GetMovimentoCaixaRequest {
  string id = 1;
}

// Request para obter um MovimentoCaixa por ID
message GetMovimentoCaixaResponse {
  MovimentoCaixa movimento_caixa = 1;
}

// Request e Response para listagem de MovimentoCaixas
message ListMovimentoCaixaRequest {
  repeated string ids = 1;

  string usuario_caixa_id = 2;

  string usuario_caixa_nome = 3;

  google.protobuf.Timestamp dia_movimento = 4;

  google.protobuf.Timestamp created_at_gte = 5;

  google.protobuf.Timestamp created_at_lte = 6;

  google.protobuf.Timestamp competence_gte = 7;

  google.protobuf.Timestamp competence_lte = 8;

  string deposito = 9;

  google.protobuf.Timestamp created_at = 10;

  string caixa = 11;

  string caixa_nome = 12;

  string operacao = 13;

  string tipo_pagamento = 14;

  string plano_conta_id = 15;

  string plano_conta_nome = 16;

  string centro_custo_id = 17;

  string centro_custo_nome = 18;

  string wallet_nome = 19;

  string wallet_id = 20;

  bool saldo_not_zero = 21;

  Filter filter = 22;

  uint32 limit = 23;

  string page_token = 24;
}

message ListMovimentoCaixaResponse {
  repeated MovimentoCaixa movimento_caixa_list = 1;

  string next_page_token = 2;
}

message ReportMovimentoCaixaRequest {
  string tipo_relatorio = 1; // Tipo de relatório

  ListMovimentoCaixaRequest list_movimento_caixa_request = 2;
}

message ReportMovimentoCaixaResponse {
  report.Response response = 1;
}

message GetSaldoMovimentoCaixaRequest {
  string caixa_id = 1;

  string usuario_caixa_id = 2;

  google.protobuf.Timestamp data = 3;
}

message GetSaldoMovimentoCaixaResponse {
  double saldo = 1;
}

message TransferenciaCaixaRequest {
  string caixa_origem_id = 1;

  string caixa_destino_id = 2;

  string tipo_pagamento = 3;

  double valor = 4;

  repeated TransferenciaItem itens = 5; // valores por tipo de pagamento; quando informado, tipo_pagamento/valor são ignorados
}

// Item da transferência entre caixas: um valor por tipo de pagamento
message TransferenciaItem {
  string tipo_pagamento = 1; // DINHEIRO, PIX, CARTAO CREDITO, CARTAO DEBITO

  double valor = 2;
}

message TransferenciaCaixaResponse {
  string id = 1;
}

message BatchUpdateRequest {
  repeated string origem_ids = 1; // IDs das origens (contas) para atualizar

  string plano_conta_id = 2; // ID do plano de contas (opcional)

  string plano_conta_nome = 3; // Nome do plano de contas (opcional)

  string centro_custo_id = 4; // ID do centro de custo (opcional)

  string centro_custo_nome = 5; // Nome do centro de custo (opcional)
}

message BatchUpdateResponse {
  int32 updated_count = 1; // Quantidade de registros atualizados

  string message = 2; // Mensagem de resultado
}
