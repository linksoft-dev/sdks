syntax = "proto3";

package contas;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "apps/report/report.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/financeiro/contas";

// Serviço Contas com operações CRUD
service ContasReceberService {
  rpc Create ( CreateContasRequest ) returns ( CreateContasResponse );

  rpc Update ( UpdateContasRequest ) returns ( UpdateContasResponse );

  rpc Delete ( DeleteContasRequest ) returns ( DeleteContasResponse );

  rpc Get ( GetContasRequest ) returns ( GetContasResponse );

  rpc List ( ListContasRequest ) returns ( ListContasResponse );

  rpc Cancelar ( CancelarRequest ) returns ( CancelarResponse );

  rpc AddPagamento ( AddPagamentoRequest ) returns ( AddPagamentoResponse );

  rpc UpdatePagamento ( UpdatePagamentoRequest ) returns ( UpdatePagamentoResponse );

  rpc DeletePagamento ( DeletePagamentoRequest ) returns ( DeletePagamentoResponse );

  rpc AtualizaComprovante ( AtualizaComprovanteRequest ) returns ( AtualizaComprovanteResponse );

  rpc Import ( ImportRequest ) returns ( ImportResponse );

  rpc AlteracaoConjunta ( AlteracaoConjuntaRequest ) returns ( AlteracaoConjuntaResponse );

  rpc FaturamentoConjunto ( FaturamentoConjuntoRequest ) returns ( FaturamentoConjuntoResponse );

  rpc MesclaContas ( MesclaContasRequest ) returns ( MesclaContasResponse );

  rpc Dashboard ( DashboardRequest ) returns ( DashboardResponse );

  rpc Report ( ReportRequest ) returns ( ReportResponse );

  rpc Duplicata ( DuplicataRequest ) returns ( DuplicataResponse );

  rpc Clone ( CloneRequest ) returns ( CloneResponse );

  rpc GetOutstandingBalance ( GetOutstandingBalanceRequest ) returns ( GetOutstandingBalanceResponse );

  rpc Export ( ExportRequest ) returns ( ExportResponse );

  rpc ImprimirRecibo ( ImprimirReciboRequest ) returns ( ImprimirReciboResponse );

  rpc SendPaymentLink ( SendPaymentLinkRequest ) returns ( SendPaymentLinkResponse );

  rpc GeraBoleto ( GeraBoletoRequest ) returns ( GeraBoletoResponse );

  // Junta títulos a receber pendentes, do mesmo cliente e sem pagamento, numa fatura com o
  // vencimento informado. Os títulos saem da cobrança e voltam se a fatura for cancelada.
  rpc Fatura ( FaturaRequest ) returns ( FaturaResponse );
}

message FaturaRequest {
  repeated string ids = 1;

  google.protobuf.Timestamp vencimento = 2;

  // Descrição da fatura; vazio usa "FATURA".
  string descricao = 3;
}

message FaturaResponse {
  Contas contas = 1;
}

service ContasPagarService {
  rpc Create ( CreateContasRequest ) returns ( CreateContasResponse );

  rpc Update ( UpdateContasRequest ) returns ( UpdateContasResponse );

  rpc Delete ( DeleteContasRequest ) returns ( DeleteContasResponse );

  rpc Get ( GetContasRequest ) returns ( GetContasResponse );

  rpc List ( ListContasRequest ) returns ( ListContasResponse );

  rpc Cancelar ( CancelarRequest ) returns ( CancelarResponse );

  rpc AddPagamento ( AddPagamentoRequest ) returns ( AddPagamentoResponse );

  rpc UpdatePagamento ( UpdatePagamentoRequest ) returns ( UpdatePagamentoResponse );

  rpc DeletePagamento ( DeletePagamentoRequest ) returns ( DeletePagamentoResponse );

  rpc AtualizaComprovante ( AtualizaComprovanteRequest ) returns ( AtualizaComprovanteResponse );

  rpc Import ( ImportRequest ) returns ( ImportResponse );

  rpc AlteracaoConjunta ( AlteracaoConjuntaRequest ) returns ( AlteracaoConjuntaResponse );

  rpc FaturamentoConjunto ( FaturamentoConjuntoRequest ) returns ( FaturamentoConjuntoResponse );

  rpc MesclaContas ( MesclaContasRequest ) returns ( MesclaContasResponse );

  rpc Dashboard ( DashboardRequest ) returns ( DashboardResponse );

  rpc Report ( ReportRequest ) returns ( ReportResponse );

  rpc Duplicata ( DuplicataRequest ) returns ( DuplicataResponse );

  rpc Clone ( CloneRequest ) returns ( CloneResponse );

  rpc GetOutstandingBalance ( GetOutstandingBalanceRequest ) returns ( GetOutstandingBalanceResponse );

  rpc Export ( ExportRequest ) returns ( ExportResponse );

  rpc ImprimirRecibo ( ImprimirReciboRequest ) returns ( ImprimirReciboResponse );
}

// esse servico nao é pra ser registrado, apenas para facilitar a implementacao do crud,
// gerando a interface que é comum entre os servicos de contas receber e pagar
service ContasService {
  rpc Report ( ReportRequest ) returns ( ReportResponse );
}

// SendPaymentLink envia o link de pagamento das contas por e-mail ou WhatsApp.
message GeraBoletoRequest {
  string id = 1;

  string forma_pagamento_id = 2; // vazio usa a única forma de pagamento de boleto com integração bancária
}

message GeraBoletoResponse {
  Contas contas = 1;
}

message SendPaymentLinkRequest {
  repeated string ids = 1;

  string email = 2; // opcional: e-mail de destino; vazio usa o e-mail da pessoa da conta

  string channel = 3; // "email" (padrao) ou "whatsapp"

  string email_integration_id = 4; // integracao de e-mail; vazio usa a resolucao padrao do sistema

  // WhatsApp enviado pelo servidor pela integracao informada. Vazio mantem o envio
  // pelo app local: o servidor so registra a cobranca.
  string whatsapp_integration_id = 5;

  // Template aprovado da API oficial; obrigatorio quando a conta e oficial e o
  // destinatario esta fora da janela de 24h. Variaveis: nome e link, nesta ordem.
  string whatsapp_template_name = 6;

  string whatsapp_template_language = 7; // vazio usa pt_BR

  // Contato de destino por conta, quando editado na tela de envio. Sobrepoe o
  // contato do cadastro da pessoa.
  repeated DestinatarioCobranca destinatarios = 8;

  // Modelo de mensagem a usar; vazio usa o modelo padrao do canal.
  string message_template_id = 9;
}

// Contato para onde a cobranca de uma conta deve ir.
message DestinatarioCobranca {
  string conta_id = 1;

  string nome = 2;

  string email = 3;

  string telefone = 4;
}

message SendPaymentLinkResponse {
  repeated Contas contasList = 1;

  // Mensagens prontas para o envio pelo WhatsApp do aparelho, uma por destinatario.
  // Preenchido so quando o envio nao sai por integracao.
  repeated WhatsappWebEnvio whatsapp_web = 2;
}

message WhatsappWebEnvio {
  string numero = 1;

  string mensagem = 2;
}

enum Tipo {
  TIPO_UNSPECIFIED = 0;

  TIPO_PAGAR = 1;

  TIPO_RECEBER = 2;
}

enum Periodicidade {
  PERIODICIDADE_UNSPECIFIED = 0;

  PERIODICIDADE_SEMANAL = 1;

  PERIODICIDADE_QUINZENAL = 2;

  PERIODICIDADE_MENSAL = 3;

  PERIODICIDADE_BIMESTRAL = 4;

  PERIODICIDADE_TRIMESTRAL = 5;

  PERIODICIDADE_SEMESTRAL = 6;

  PERIODICIDADE_ANUAL = 7;
}

