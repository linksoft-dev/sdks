syntax = "proto3";

package crm_automation;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/crm/automation";

service PipelineAutomationService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  // SetStatus altera o status (draft, active, paused) da automação.
  rpc SetStatus ( SetStatusRequest ) returns ( SetStatusResponse );

  // ListRuns retorna o histórico de execuções (auditoria), opcionalmente por automação ou deal.
  rpc ListRuns ( ListRunsRequest ) returns ( ListRunsResponse );

  // SendTestEmail envia para um endereço de teste o e-mail que a ação mandaria,
  // montado com os dados de uma oportunidade real.
  rpc SendTestEmail ( SendTestEmailRequest ) returns ( SendTestEmailResponse );
}

// AutomationTrigger define quando uma regra é avaliada.
// Tipos suportados:
//   - "entered_stage": disparado por evento quando a oportunidade entra na etapa configurada
//   - "stuck_in_stage_days": disparado por job periódico quando o deal está parado há N dias
message AutomationTrigger {
  string type = 1;

  int32 days = 2;

  // Horário ("HH:MM", horário de Brasília) a partir do qual o disparo pode
  // acontecer, aplicado só a "stuck_in_stage_days". Vazio dispara assim que o
  // prazo completa, na hora em que a oportunidade entrou na etapa.
  string send_at_time = 3;
}

// AutomationAction descreve uma ação a executar quando o trigger dispara.
// O campo configuration é JSON serializado, parseado pelo executor da ação.
// Tipos suportados:
//   - "create_activity": cria uma crm.activity.Activity (TASK/CALL/EMAIL/...)
//   - "send_email": envia email via MessageService
//   - "move_stage": move o deal para outra etapa
//   - "mark_outcome": marca o deal como ganho ou perdido
message AutomationAction {
  string type = 1;

  string configuration = 2;
}

message AutomationRule {
  string id = 1;

  string stage_id = 2; // etapa do funil em que a regra se aplica (vazio = qualquer etapa)

  AutomationTrigger trigger = 3;

  repeated AutomationAction actions = 4;

  bool run_on_every_entry = 5; // repete o disparo uma vez por dia enquanto o deal continuar na etapa; só vale para o gatilho "stuck_in_stage_days"

  bool enabled = 6;
}

message PipelineAutomation {
  string id = 1;

  string name = 2;

  string pipeline_id = 3;

  string pipeline_name = 4;

  string status = 5; // draft, active, paused

  repeated AutomationRule rules = 6;

  google.protobuf.Timestamp created_at = 7;

  google.protobuf.Timestamp updated_at = 8;

  AutomationSendWindow send_window = 9;
}

// AutomationSendWindow limita quando as regras desta automação podem entregar
// mensagem ao cliente. Regra que só mexe no funil (mover etapa, criar tarefa)
// não é afetada. Campos em branco usam a janela padrão do sistema.
message AutomationSendWindow {
  string start_time = 1; // hora inicial, inclusiva ("08:00")

  string end_time = 2; // hora final, exclusiva ("20:00")

  repeated int32 weekdays = 3; // dias permitidos: 0=domingo ... 6=sábado
}

// AutomationRun registra cada execução de uma regra sobre um deal, para auditoria
// e para garantir idempotência (uma regra não dispara duas vezes para a mesma
// "entrada" do deal na etapa; com run_on_every_entry a trava passa a ser de um
// disparo por dia).
message AutomationRun {
  string id = 1;

  string automation_id = 2;

  string rule_id = 3;

  string deal_id = 4;

  string pipeline_id = 5;

  string stage_id = 6;

  string trigger_type = 7;

  google.protobuf.Timestamp triggered_at = 8;

  // stage_entered_at do deal no momento do disparo, usado como chave de idempotência
  google.protobuf.Timestamp stage_entered_at = 9;

  string status = 10; // success, partial, failed

  string error = 11;

  repeated ActionResult action_results = 12;

  // Chave de deduplicação do disparo, com índice único no banco: é ela que
  // impede duas execuções simultâneas do job entregarem a mesma mensagem duas
  // vezes. Sem "repetir", identifica a entrada na etapa; com "repetir", o dia.
  string idempotency_key = 13;
}

message ActionResult {
  string action_type = 1;

  string status = 2; // success, failed

  string error = 3;

  string detail = 4; // ex: activity_id criado, etapa para a qual moveu, etc.
}

message CreateRequest {
  PipelineAutomation pipeline_automation = 1;
}

message CreateResponse {
  PipelineAutomation pipeline_automation = 1;
}

message UpdateRequest {
  string id = 1;

  PipelineAutomation pipeline_automation = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  PipelineAutomation pipeline_automation = 1;
}

message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

message GetRequest {
  string id = 1;
}

message GetResponse {
  PipelineAutomation pipeline_automation = 1;
}

message ListRequest {
  repeated string ids = 1;

  string pipeline_id = 2;

  string status = 3;

  Filter filter = 4;
}

message ListResponse {
  repeated PipelineAutomation pipeline_automation_list = 1;
}

message SetStatusRequest {
  string id = 1;

  string status = 2;
}

message SetStatusResponse {
  PipelineAutomation pipeline_automation = 1;
}

message ListRunsRequest {
  string automation_id = 1;

  string deal_id = 2;

  string rule_id = 3;

  uint32 page_size = 4;

  string page_token = 5;

  Filter filter = 6;
}

message ListRunsResponse {
  repeated AutomationRun runs = 1;

  string next_page_token = 2;
}

message SendTestEmailRequest {
  string destination = 1; // endereço que recebe o teste

  string configuration = 2; // configuração da ação de e-mail, no mesmo formato gravado na regra

  string deal_id = 3; // oportunidade usada para preencher as variáveis

  string pipeline_id = 4; // sem deal_id, usa a oportunidade mais recente do funil

  string stage_id = 5; // restringe a busca da oportunidade à etapa da regra
}

message SendTestEmailResponse {
  string destination = 1;

  string deal_title = 2; // oportunidade que serviu de exemplo

  string subject = 3;
}
