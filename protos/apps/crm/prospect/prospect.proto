syntax = "proto3";

package crm_prospect;

import "google/api/annotations.proto";

option go_package = "comps/pb/apps/crm/prospect";

// Serviço de prospecção — busca em fontes externas e salva como leads
service ProspectService {
  // Busca de empresas em fontes externas
  rpc SearchCompanies ( SearchRequest ) returns ( SearchCompaniesResponse );

  // Busca de pessoas/decisores em fontes externas
  rpc SearchPeople ( SearchRequest ) returns ( SearchPeopleResponse );

  // Enriquecimento de dados de empresa
  rpc EnrichCompany ( EnrichCompanyRequest ) returns ( EnrichCompanyResponse );

  // Enriquecimento de dados de pessoa
  rpc EnrichPerson ( EnrichPersonRequest ) returns ( EnrichPersonResponse );

  // Salvar prospects como leads (Person com tag "lead")
  rpc SaveAsLeads ( SaveAsLeadsRequest ) returns ( SaveAsLeadsResponse );

  // Listar provedores disponíveis e seus status
  rpc ListProviders ( ListProvidersRequest ) returns ( ListProvidersResponse );

  // Listar contas/integrações disponíveis por provider (nativas + hub do cliente).
  // Permite que o cliente escolha qual conta usar quando há mais de uma cadastrada.
  rpc ListAccounts ( ListAccountsRequest ) returns ( ListAccountsResponse );
}

// --- Critérios de busca ---
message SearchCriteria {
  string name = 1; // Nome da empresa ou pessoa

  string city = 2; // Cidade

  string state = 3; // Estado (UF)

  string region = 4; // Região (Nordeste, Sul, etc.)

  string sector = 5; // Setor/indústria (descrição CNAE)

  string cnae_code = 6; // Código CNAE

  string size_range = 7; // Porte: MEI, ME, EPP, MEDIO, GRANDE

  string cep = 8; // CEP

  double revenue_min = 9; // Receita mínima

  double revenue_max = 10; // Receita máxima

  string domain = 11; // Domínio web

  repeated string keywords = 12; // Palavras-chave

  string cpf_cnpj = 13; // Busca direta por CPF/CNPJ

  string email = 14; // Busca por e-mail

  string phone = 15; // Busca por telefone

  int32 page = 16; // Página (paginação)

  int32 page_size = 17; // Tamanho da página

  repeated string providers = 18; // Filtrar por provedores específicos

  bool exclude_customers = 20; // Oculta empresas cujo CNPJ já está na base como cliente

  bool exclude_leads = 21; // Oculta empresas cujo CNPJ já está na base como lead

  // Conta/integração a usar por provider. Chave é o nome do provider (apollo, cnpjws);
  // valor é o ID da integração no hub ou "native:<service>" para conta nativa.
  // Se vazio para um provider, usa a integração padrão (primeira do hub ou nativa).
  map<string, string> integration_ids = 19;
}

// --- Resultado: Empresa ---
message ProspectCompany {
  string id = 1; // ID gerado (hash do identificador)

  string provider = 2; // Provedor de origem

  string name = 3; // Razão social

  string trade_name = 4; // Nome fantasia

  string cpf_cnpj = 5;

  string email = 6;

  string phone = 7;

  string website = 8;

  string address = 9;

  string city = 10;

  string state = 11;

  string cep = 12;

  string sector = 13; // Setor/indústria

  string cnae_code = 14;

  string size = 15; // Porte

  double capital = 16; // Capital social

  string status = 17; // Situação cadastral

  string founded_at = 18; // Data de abertura

  repeated ProspectPerson contacts = 19; // Sócios/contatos

  map<string, string> extra_data = 20; // Dados extras por provedor

  double confidence_score = 21;

  string google_place_id = 22;

  double rating = 23; // Rating Google Places

  int32 reviews_count = 24;

  string existing_person_id = 25; // Id do cadastro (Person) já existente com o mesmo CNPJ

  string existing_relation = 26; // Relação do cadastro existente: "cliente" | "lead"
}

// --- Resultado: Pessoa ---
message ProspectPerson {
  string id = 1;

  string provider = 2;

  string name = 3;

  string email = 4;

  string phone = 5;

  string title = 6; // Cargo

  string company_name = 7;

  string company_cpf_cnpj = 8;

  string linkedin_url = 9;

  string role = 10; // Qualificação do sócio

  map<string, string> extra_data = 11;

  double confidence_score = 12;
}

// --- Informação do provedor ---
message ProviderInfo {
  string name = 1;

  string display_name = 2;

  string description = 3;

  bool supports_companies = 4;

  bool supports_people = 5;

  bool supports_enrich_company = 6;

  bool supports_enrich_person = 7;

  bool is_active = 8; // Se a integração está conectada

  string integration_id = 9;

  bool requires_integration = 10;
}

// --- Request/Response ---
message SearchRequest {
  SearchCriteria criteria = 1;
}

message SearchCompaniesResponse {
  repeated ProspectCompany companies = 1;

  int32 total_count = 2;

  map<string, string> provider_errors = 3;

  int32 hidden_customers_count = 4; // Empresas ocultadas por já serem clientes

  int32 hidden_leads_count = 5; // Empresas ocultadas por já estarem como lead
}

message SearchPeopleResponse {
  repeated ProspectPerson people = 1;

  int32 total_count = 2;

  map<string, string> provider_errors = 3;
}

message EnrichCompanyRequest {
  string cpf_cnpj = 1;

  string google_place_id = 2;

  string domain = 3;

  repeated string providers = 4;

  // Mesmo formato do SearchCriteria.integration_ids
  map<string, string> integration_ids = 5;
}

message EnrichCompanyResponse {
  ProspectCompany company = 1;

  map<string, string> provider_errors = 2;
}

message EnrichPersonRequest {
  string email = 1;

  string name = 2;

  string company_domain = 3;

  repeated string providers = 4;

  // Mesmo formato do SearchCriteria.integration_ids
  map<string, string> integration_ids = 5;

  string company_name = 6; // Nome da empresa da pessoa, usado no match quando não há domínio
}

message EnrichPersonResponse {
  ProspectPerson person = 1;

  map<string, string> provider_errors = 2;

  int32 credits_charged = 3; // Créditos debitados pela revelação do contato

  int64 credits_balance = 4; // Saldo de créditos após a operação
}

message SaveAsLeadsRequest {
  repeated ProspectCompany companies = 1;

  repeated ProspectPerson people = 2;

  repeated string tags = 3; // Tags adicionais

  string source_provider = 4; // Provedor de origem

  // Quando true, cria também uma Oportunidade (Deal) no funil para cada lead salvo.
  // pipeline_id e stage_id são obrigatórios nesse caso.
  bool create_deal = 5;

  string pipeline_id = 6; // Pipeline (funil) onde a oportunidade é criada

  string stage_id = 7; // Etapa inicial da oportunidade

  double expected_value = 8; // Valor estimado da oportunidade (aplicado a cada deal)

  string responsible_id = 9; // Responsável pela oportunidade (opcional)

  string responsible_name = 10; // Nome desnormalizado do responsável (opcional)

  map<string, string> custom_fields = 11; // Campos livres gravados em cada oportunidade criada

  // Cria a oportunidade também para quem já estava cadastrado, ligada ao cadastro existente.
  bool create_deal_for_existing = 12;
}

message SaveAsLeadsResponse {
  int32 saved_count = 1;

  int32 skipped_count = 2; // Já existiam (duplicados)

  repeated string person_ids = 3; // IDs dos Person criados

  repeated string errors = 4;

  repeated string deal_ids = 5; // IDs das Oportunidades criadas (quando create_deal=true)

  int32 deals_created_count = 6; // Quantidade de Deals efetivamente criados
}

message ListProvidersRequest {
}

message ListProvidersResponse {
  repeated ProviderInfo providers = 1;
}

// Representa uma conta utilizável por um provider de prospecção.
// Pode ser uma integração cadastrada no hub do cliente OU uma conta nativa
// fornecida pela Linksoft via config.yaml (origem="native").
message ProviderAccount {
  string id = 1; // ID da integração (UUID do hub) ou "native:<service>"

  string name = 2; // Nome amigável (ex: "Apollo principal", "Linksoft")

  string provider = 3; // Nome do provider (apollo, cnpjws)

  string origin = 4; // "native" | "hub"

  bool is_default = 5; // Se é a conta padrão usada quando nenhuma é escolhida
}

message ListAccountsRequest {
  // Quando informado, retorna apenas contas desse provider
  string provider = 1;
}

message ListAccountsResponse {
  repeated ProviderAccount accounts = 1;
}
