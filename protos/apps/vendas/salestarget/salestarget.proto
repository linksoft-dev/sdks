syntax = "proto3";

package salestarget;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

import "apps/report/report.proto";

option go_package = "comps/pb/apps/vendas/salestarget";

// Goals service with CRUD operations
service GoalService {
  rpc Create ( CreateGoalRequest ) returns ( CreateGoalResponse );

  rpc Update ( UpdateGoalRequest ) returns ( UpdateGoalResponse );

  rpc Delete ( DeleteGoalRequest ) returns ( DeleteGoalResponse );

  rpc Get ( GetGoalRequest ) returns ( GetGoalResponse );

  rpc List ( ListGoalRequest ) returns ( ListGoalResponse );

  rpc Report ( ReportGoalRequest ) returns ( ReportGoalResponse );

  rpc UpdateProgress ( UpdateProgressRequest ) returns ( UpdateProgressResponse );

  // Recalcula o progresso da meta a partir dos pedidos e ordens de serviço já fechados no
  // período, em vez de esperar novos fechamentos.
  rpc RecalculateProgress ( RecalculateProgressRequest ) returns ( RecalculateProgressResponse );

  rpc GetSalespersonProgress ( GetSalespersonProgressRequest ) returns ( GetSalespersonProgressResponse );

  // Cria uma cópia mensal da meta para os meses seguintes, cada uma com o seu período e o
  // seu progresso.
  rpc ReplicateGoal ( ReplicateGoalRequest ) returns ( ReplicateGoalResponse );
}

enum GoalStatus {
  GOAL_STATUS_UNSPECIFIED = 0;

  GOAL_STATUS_ACTIVE = 1;

  GOAL_STATUS_INACTIVE = 2;

  GOAL_STATUS_FINISHED = 3;
}

enum RewardType {
  REWARD_TYPE_UNSPECIFIED = 0;

  REWARD_TYPE_BRONZE = 1;

  REWARD_TYPE_SILVER = 2;

  REWARD_TYPE_GOLD = 3;
}

enum CurrencyType {
  CURRENCY_TYPE_UNSPECIFIED = 0;

  CURRENCY_TYPE_BRL = 1; // Real Brasileiro

  CURRENCY_TYPE_USD = 2; // Dólar Americano

  CURRENCY_TYPE_EUR = 3; // Euro

  CURRENCY_TYPE_GBP = 4; // Libra Esterlina

  CURRENCY_TYPE_CAD = 5; // Dólar Canadense

  CURRENCY_TYPE_AUD = 6; // Dólar Australiano

  CURRENCY_TYPE_CHF = 7; // Franco Suíço
}

// Goal data
message Goal {
  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  string user_id = 4;

  string user_name = 5;

  string name = 6;

  string description = 7;

  GoalStatus status = 8;

  // Período de validade
  google.protobuf.Timestamp start_date = 9;

  google.protobuf.Timestamp end_date = 10;

  // Time vinculado à meta
  string team_id = 11;

  string team_name = 12;

  // Configurações padrão do time
  TeamGoalConfiguration team_configuration = 13;

  // Vendedores específicos e suas configurações
  repeated SalespersonGoal salespeople = 14;

  // Sistema de recompensas
  repeated Reward rewards = 15;

  // Progresso geral da meta
  GoalProgress progress = 16;

  // Tipo de moeda para valores monetários
  CurrencyType currency_type = 17;

  metadata.BasicFields fields = 18;

  // O que conta como realizado no período
  GoalBasis basis = 19;
}

// Base de apuração do realizado da meta.
enum GoalBasis {
  // Valor do documento fechado, na data do documento.
  GOAL_BASIS_DOCUMENT = 0;

  // Valor de cada pagamento recebido, na data do pagamento. Documento pago em parte entra
  // pelo que já foi pago.
  GOAL_BASIS_PAYMENT = 1;
}

// Configurações padrão para o time
message TeamGoalConfiguration {
  double daily_value_goal = 1;

  double weekly_value_goal = 2;

  double monthly_value_goal = 3;

  // Quantidade de vendas como meta alternativa
  int32 daily_sales_quantity = 4;

  int32 weekly_sales_quantity = 5;

  int32 monthly_sales_quantity = 6;

  // Se usar valor ou quantidade como critério principal
  bool use_value_as_criteria = 7; // true = value, false = quantity
}

// Configuração específica de um vendedor na meta
message SalespersonGoal {
  string salesperson_id = 1;

  string salesperson_name = 2;

  // Configurações específicas do vendedor (se omitidas, usa as do time)
  double daily_value_goal = 3;

  double weekly_value_goal = 4;

  double monthly_value_goal = 5;

  int32 daily_sales_quantity = 6;

  int32 weekly_sales_quantity = 7;

  int32 monthly_sales_quantity = 8;

  // Progresso individual do vendedor
  SalespersonProgress progress = 9;

  // Histórico de recompensas alcançadas
  repeated AchievedReward achieved_rewards = 10;
}

// Definição de recompensa
message Reward {
  string id = 1;

  string name = 2;

  string description = 3;

  RewardType type = 4;

  // Critérios para alcançar a recompensa
  double required_goal_percentage = 5; // Ex: 100% para atingir, 120% para superar

  double required_minimum_value = 6;

  int32 required_minimum_quantity = 7;

  // Tags para categorização
  repeated string tags = 8;
}

// Recompensa alcançada por um vendedor
message AchievedReward {
  string reward_id = 1;

  string reward_name = 2;

  RewardType type = 3;

  google.protobuf.Timestamp achieved_date = 4;

  double achieved_value = 5;

  int32 achieved_quantity = 6;

  double achieved_percentage = 7;

  repeated string tags = 8;
}

// Progresso geral da meta
message GoalProgress {
  double total_achieved_value = 1;

  double total_goal_value = 2;

  int32 total_achieved_quantity = 3;

  int32 total_goal_quantity = 4;

  double achieved_percentage = 5;

  google.protobuf.Timestamp last_update = 6;

  // Estatísticas por período
  PeriodProgress daily_progress = 7;

  PeriodProgress weekly_progress = 8;

  PeriodProgress monthly_progress = 9;
}

// Progresso individual do vendedor
message SalespersonProgress {
  double daily_achieved_value = 1;

  double weekly_achieved_value = 2;

  double monthly_achieved_value = 3;

  int32 daily_achieved_quantity = 4;

  int32 weekly_achieved_quantity = 5;

  int32 monthly_achieved_quantity = 6;

  double daily_percentage = 7;

  double weekly_percentage = 8;

  double monthly_percentage = 9;

  google.protobuf.Timestamp last_update = 10;

  // Última venda que contribuiu para o progresso
  string last_sale_id = 11;

  double last_sale_value = 12;

  google.protobuf.Timestamp last_sale_date = 13;
}

// Progresso por período
message PeriodProgress {
  double achieved_value = 1;

  double goal_value = 2;

  int32 achieved_quantity = 3;

  int32 goal_quantity = 4;

  double percentage = 5;

  google.protobuf.Timestamp period_start_date = 6;

  google.protobuf.Timestamp period_end_date = 7;
}

// Requests e Responses

message CreateGoalRequest {
  Goal goal = 1;
}

message CreateGoalResponse {
  Goal goal = 1;
}

message UpdateGoalRequest {
  string id = 1;

  Goal goal = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateGoalResponse {
  Goal goal = 1;
}

message DeleteGoalRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteGoalResponse {
  string id = 1;
}

message GetGoalRequest {
  string id = 1;
}

message GetGoalResponse {
  Goal goal = 1;
}

message ListGoalRequest {
  repeated string ids = 1;

  string team_id = 2;

  string salesperson_id = 3;

  GoalStatus status = 4;

  google.protobuf.Timestamp start_date_gte = 5;

  google.protobuf.Timestamp start_date_lte = 6;

  google.protobuf.Timestamp end_date_gte = 7;

  google.protobuf.Timestamp end_date_lte = 8;

  bool only_active = 9;

  Filter filter = 10;
}

message ListGoalResponse {
  repeated Goal goalList = 1;

  string next_page_token = 2;
}

message ReportGoalRequest {
  string report_type = 1;

  ListGoalRequest list_goal_request = 2;

  string mail = 3;
}

message ReportGoalResponse {
  report.Response response = 1;
}

message UpdateProgressRequest {
  string goal_id = 1;

  string salesperson_id = 2;

  string sale_id = 3;

  double sale_value = 4;

  google.protobuf.Timestamp sale_date = 5;
}

message UpdateProgressResponse {
  SalespersonProgress updated_progress = 1;

  repeated AchievedReward new_rewards = 2;
}

message RecalculateProgressRequest {
  string goal_id = 1;
}

message RecalculateProgressResponse {
  Goal goal = 1;

  int32 vendas_consideradas = 2;
}

message ReplicateGoalRequest {
  string goal_id = 1;

  // Quantos meses replicar a partir do mês seguinte ao da meta. Vazio replica até dezembro.
  int32 months = 2;
}

message ReplicateGoalResponse {
  repeated Goal goals = 1;
}

message GetSalespersonProgressRequest {
  string salesperson_id = 1;

  google.protobuf.Timestamp start_date = 2;

  google.protobuf.Timestamp end_date = 3;

  bool include_rewards_history = 4;
}

message GetSalespersonProgressResponse {
  repeated SalespersonGoal salesperson_goals = 1;

  double total_achieved_value = 2;

  int32 total_achieved_quantity = 3;

  double average_achieved_percentage = 4;

  repeated AchievedReward rewards_history = 5;
}
