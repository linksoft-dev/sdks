syntax = "proto3";

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "apps/report/report.proto";

import "apps/vendas/rentcar/model/rentcar_model.proto";

import "apps/vendas/pedido/pedido_otica.proto";

import "apps/vendas/pedido/pedido_mesa.proto";

import "apps/filemanager/filemanager.proto";

import "google/protobuf/timestamp.proto";

import "imports/imports.proto";

import "exports/exports.proto";

package pedido;

option go_package = "comps/pb/apps/vendas/pedido";

// services
service PedidoService {
  rpc Create ( CreatePedidoRequest ) returns ( CreatePedidoResponse );

  rpc CreateValidated ( CreatePedidoRequest ) returns ( CreatePedidoResponse );

  rpc Update ( UpdatePedidoRequest ) returns ( UpdatePedidoResponse );

  rpc SetAcompanhamento ( SetAcompanhamentoRequest ) returns ( SetAcompanhamentoResponse );

  // Reordena os itens do documento: os ids vêm na ordem final e precisam ser exatamente
  // os itens atuais. A nota fiscal sai na ordem do documento.
  rpc ReorderItems ( ReorderItemsRequest ) returns ( ReorderItemsResponse );

  rpc Delete ( DeletePedidoRequest ) returns ( DeletePedidoResponse );

  rpc Get ( GetPedidoRequest ) returns ( GetPedidoResponse );

  rpc List ( ListPedidoRequest ) returns ( ListPedidoResponse );

  rpc Report ( ReportRequest ) returns ( ReportResponse );

  rpc Print ( PrintPedidoRequest ) returns ( PrintPedidoResponse );

  rpc GenerateFromOrcamento ( GenerateFromOrcamentoRequest ) returns ( GenerateFromOrcamentoResponse );

  rpc Cancel ( CancelPedidoRequest ) returns ( CancelPedidoResponse );

  rpc Clone ( ClonePedidoRequest ) returns ( ClonePedidoResponse );

  rpc AddProduct ( AddProductRequest ) returns ( AddProductResponse );

  rpc UpdateProduct ( UpdateProductRequest ) returns ( UpdateProductResponse );

  rpc DeleteProduct ( DeleteProductRequest ) returns ( DeleteProductResponse );

  rpc AddService ( AddServiceRequest ) returns ( AddServiceResponse );

  rpc UpdateService ( UpdateServiceRequest ) returns ( UpdateServiceResponse );

  rpc DeleteService ( DeleteServiceRequest ) returns ( DeleteServiceResponse );

  rpc AddPayment ( AddPaymentRequest ) returns ( AddPaymentResponse );

  rpc DeletePayment ( DeletePaymentRequest ) returns ( DeletePaymentResponse );

  rpc CancelPayment ( CancelPaymentRequest ) returns ( CancelPaymentResponse );

  // Efetiva pagamentos com status LANCADO, realizando lancamentos financeiros e fechando o pedido
  rpc EffectuatePayments ( EffectuatePaymentsRequest ) returns ( EffectuatePaymentsResponse );

  rpc SendByEmail ( SendByEmailRequest ) returns ( SendByEmailResponse );

  // Retorna o PDF do pedido em base64 para a página pública de download (acesso via token)
  rpc DownloadPdfPublico ( DownloadPdfPublicoRequest ) returns ( DownloadPdfPublicoResponse );

  rpc AplicaTabelaPreco ( AplicaTabelaPrecoRequest ) returns ( AplicaTabelaPrecoResponse );

  rpc DfeDanfe ( DfeDanfeRequest ) returns ( DfeDanfeResponse );

  rpc Import ( ImportRequest ) returns ( ImportResponse );

  // Cria pedidos mesclados com base nas IDs recebidas
  rpc MesclaPedidos ( MesclaPedidosRequest ) returns ( MesclaPedidosResponse );

  // Vincula um novo pedido à mesclagem já criada
  rpc AddPedidoVinculado ( AddPedidoVinculadoRequest ) returns ( AddPedidoVinculadoResponse );

  // Delete um dos pedidos da mesclagem
  rpc DeletePedidoVinculado ( DeletePedidoVinculadoRequest ) returns ( DeletePedidoVinculadoResponse );

  // Envia uma nota fiscal de acordo com as configurações de integração
  rpc EnviaNFe ( EnviaNFeRequest ) returns ( EnviaNFeResponse );

  // Sincroniza o pedido com o estado atual da NF vinculada
  rpc SincronizaNFe ( SincronizaNFeRequest ) returns ( SincronizaNFeResponse );

  // Sincroniza os dados desnormalizados da pessoa (e vinculos) a partir do cadastro.
  // Persiste via DAO para permitir atualizacao mesmo com pedido FECHADO/CANCELADO.
  rpc SincronizaPessoa ( SincronizaPessoaRequest ) returns ( SincronizaPessoaResponse );

  // Permite vincular uma NF ao pedido manualmente
  rpc VinculaNFManual ( VinculoNfManualRequest ) returns ( VinculoNfManualResponse );

  rpc SendPaymentLink ( SendPaymentLinkRequest ) returns ( SendPaymentLinkResponse );

  rpc CorrecaoMovimentacao ( CorrecaoMovimentacaoRequest ) returns ( CorrecaoMovimentacaoResponse );

  rpc ConfirmOrderReceipt ( ConfirmOrderReceiptRequest ) returns ( ConfirmOrderReceiptResponse );

  // Adiciona múltiplos arquivos ao pedido, delegando criação ao FileManager
  rpc AddFiles ( AddFilesRequest ) returns ( AddFilesResponse );

  // Remove arquivos do pedido e do FileManager
  rpc RemoveFiles ( RemoveFilesRequest ) returns ( RemoveFilesResponse );

  // Aprova ou recusa um arquivo do pedido que está aguardando moderação
  rpc SetFileApproval ( SetFileApprovalRequest ) returns ( SetFileApprovalResponse );

  rpc Export ( ExportOrdersRequest ) returns ( ExportOrdersResponse );

  // Envia email solicitando avaliacao dos produtos do pedido
  rpc SendReviewEmail ( SendReviewEmailRequest ) returns ( SendReviewEmailResponse );

  // Recalcula a comissao de todos os itens do pedido com base no percentual atual do vendedor/tecnico
  rpc RecalcularComissao ( RecalcularComissaoRequest ) returns ( RecalcularComissaoResponse );

  // Agrupa os itens ainda não enviados por impressora de produção e devolve os
  // jobs de impressão (cozinha/bar), marcando os itens como enviados.
  rpc EnviarProducao ( EnviarProducaoRequest ) returns ( EnviarProducaoResponse );

  // Grava a confirmação de impressão (ou erro) de cada item após o transporte
  // (Linker/plugin) retornar.
  rpc ConfirmarImpressaoProducao ( ConfirmarImpressaoProducaoRequest ) returns ( ConfirmarImpressaoProducaoResponse );

  // Marca itens como entregues (com data/hora) para cálculo do tempo de preparo.
  rpc MarcarItemEntregue ( MarcarItemEntregueRequest ) returns ( MarcarItemEntregueResponse );

  // Produtos para inserção rápida no PDV: mais vendidos e últimos lançados.
  rpc GetQuickProdutos ( GetQuickProdutosRequest ) returns ( GetQuickProdutosResponse );

  // Soma o que cada vendedor realizou no período, para quem acompanha meta. A base diz o que
  // conta: o valor do documento na data dele, ou o valor pago em cada pagamento, na data do
  // pagamento — nesse caso um documento parcialmente pago entra pelo que já foi pago.
  rpc ResumoVendasPorVendedor ( ResumoVendasPorVendedorRequest ) returns ( ResumoVendasPorVendedorResponse );
}

message GetQuickProdutosRequest {
  int32 dias = 1; // janela de apuração (default 30)

  int32 limit = 2; // top-N por lista (default 12)
}

message QuickProduto {
  string produtoId = 1;

  string nome = 2;

  string codigo = 3;

  string un = 4;

  double valorUnitario = 5;

  string categoriaId = 6;

  string categoriaNome = 7;

  string imagemUrl = 8; // Imagem do produto; vazio quando não há imagem disponível
}

message GetQuickProdutosResponse {
  repeated QuickProduto maisVendidos = 1;

  repeated QuickProduto recentes = 2;
}

message EnviarProducaoRequest {
  string pedidoId = 1;

  // Quando true, reemite itens já enviados (reimpressão de rodada).
  bool reimprimir = 2;

  // Quando preenchido, limita a operação a estes itens (ex.: reimprimir um item).
  repeated string itemIds = 3;
}

message ImpressoraProducao {
  string id = 1;

  string nome = 2;

  string tipoConexao = 3;

  string host = 4;

  uint32 porta = 5;

  uint32 modelo = 6;

  string grupo = 7;
}

message ProducaoItem {
  string itemId = 1;

  string nome = 2;

  double quantidade = 3;

  string un = 4;

  string obs = 5;
}

message ProducaoJob {
  ImpressoraProducao impressora = 1;

  string mesaCartao = 2;

  string setor = 3;

  string dataHora = 4;

  repeated ProducaoItem itens = 5;
}

message EnviarProducaoResponse {
  repeated ProducaoJob jobs = 1;
}

message ConfirmacaoImpressaoItem {
  string itemId = 1;

  bool impresso = 2;

  string erro = 3;
}

message ConfirmarImpressaoProducaoRequest {
  string pedidoId = 1;

  repeated ConfirmacaoImpressaoItem itens = 2;
}

message ConfirmarImpressaoProducaoResponse {
}

message MarcarItemEntregueRequest {
  string pedidoId = 1;

  repeated string itemIds = 2;

  bool entregue = 3;
}

message MarcarItemEntregueResponse {
}

message CreatePedidoRequest {
  Pedido pedido = 1;
}

message CreatePedidoResponse {
  Pedido pedido = 1;
}

message UpdatePedidoRequest {
  string id = 1;

  Pedido pedido = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdatePedidoResponse {
  Pedido pedido = 1;
}

message DeletePedidoRequest {
  string id = 1;

  bool hard = 2;
}

message DeletePedidoResponse {
}

message ListPedidoRequest {
  repeated string ids = 1;

  string nome = 2;

  Pedido pedido = 3;

  metadata.Boolean merged = 4;

  metadata.Boolean seller_only = 5;

  string seller_id = 6;

  metadata.Boolean generated_nfe = 7;

  metadata.Boolean generated_nfce = 8;

  string nfe_id = 9;

  string nfce_id = 10;

  string nfse_id = 11;

  string person_id = 12;

  string contract_number = 13;

  repeated string types = 14;

  repeated string status = 15;

  repeated string products_id = 16;

  repeated string payment_method_id = 17;

  google.protobuf.Timestamp due_date_gte = 18;

  google.protobuf.Timestamp due_date_lte = 19;

  google.protobuf.Timestamp created_at_gte = 20;

  google.protobuf.Timestamp created_at_lte = 21;

  google.protobuf.Timestamp closeDateGte = 22;

  google.protobuf.Timestamp closeDateLte = 23;

  google.protobuf.Timestamp deliveryDateGte = 24;

  google.protobuf.Timestamp deliveryDateLte = 25;

  google.protobuf.Timestamp recurrenceDateGte = 26;

  google.protobuf.Timestamp recurrenceDateLte = 27;

  google.protobuf.Timestamp dataHoraRegistroGte = 28;

  google.protobuf.Timestamp dataHoraRegistroLte = 29;

  double totalGte = 30;

  double totalLte = 31;

  string payment_id = 32;

  Filter filter = 33;

  repeated string currency = 34;

  string categoryId = 35;

  string recurrence_type = 36;

  int32 recurrence_increment = 37;

  string contract_type = 38;

  string source = 39;

  string source_id = 40;
}

message CancelPedidoRequest {
  string id = 1;

  string reason = 2;
}

message CancelPedidoResponse {
  Pedido pedido = 1;
}

message ClonePedidoRequest {
  string id = 1;

  string reason = 2;

  // Quando true, produtos/serviços recebem o valor unitário atual do cadastro.
  // Quando false, preserva os valores do pedido origem.
  bool use_current_prices = 3;
}

message ClonePedidoResponse {
  Pedido pedido = 1;
}

message ConfirmOrderReceiptRequest {
  string id = 1;
}

message ConfirmOrderReceiptResponse {
  Pedido pedido = 1;
}

enum RespostaCliente {
  RESPOSTA_CLIENTE_UNSPECIFIED = 0;

  RESPOSTA_CLIENTE_APROVADO = 1;

  RESPOSTA_CLIENTE_AJUSTE = 2; // Pediu mudança no orçamento

  RESPOSTA_CLIENTE_CONVERSA = 3; // Pediu para conversar com a empresa

  RESPOSTA_CLIENTE_RECUSADO = 4; // Não vai seguir com o orçamento

  RESPOSTA_CLIENTE_MAIS_PRAZO = 5; // Pediu mais prazo de validade
}

// Request para adicionar múltiplos arquivos a um pedido
message AddFilesRequest {
  string id = 1; // ID do pedido

  // Arquivos a serem criados no FileManager; base64_content/path são usados pelo serviço de arquivos
  repeated filemanager.File files = 2;

  bool skip_upload = 3; // Se true, não faz upload para a nuvem, apenas cria a referência (útil para migrações onde o arquivo já existe)
}

// Response com o pedido atualizado contendo apenas referências essenciais aos arquivos
message AddFilesResponse {
  Pedido pedido = 1;
}

// Request para remover arquivos de um pedido
message RemoveFilesRequest {
  string id = 1; // ID do pedido

  repeated string file_ids = 2; // IDs dos arquivos a remover (opcional)

  repeated string paths = 3; // Paths dos arquivos a remover (opcional)
}

message RemoveFilesResponse {
  Pedido pedido = 1;
}

// Request para aprovar ou recusar um arquivo do pedido
message SetFileApprovalRequest {
  string id = 1; // ID do pedido

  string file_id = 2; // ID do arquivo dentro do pedido

  filemanager.FileApprovalStatus status = 3;

  string note = 4; // motivo, obrigatório ao recusar
}

message SetFileApprovalResponse {
  Pedido pedido = 1;
}

message ExportOrdersRequest {
  exports.ExportFormat format = 1;

  Filter filter = 2;

  string type = 3;

  bool include_metadata = 4;
}

message ExportOrdersResponse {
  exports.ExportResponse export = 1;
}

message SendReviewEmailRequest {
  string id = 1; // ID do pedido
}

message SendReviewEmailResponse {
  int32 sent_count = 1; // Quantidade de emails enviados
}

message GetPedidoRequest {
  string id = 1;
}

message GetPedidoResponse {
  Pedido pedido = 1;
}

message GenerateFromOrcamentoRequest {
  string id = 1;

  TipoMovimentacao type = 2;

  // Números de série da venda gerada. Cada item usa o id do produto no orçamento.
  repeated OrcamentoItemSerial itens_serial = 3;
}

message OrcamentoItemSerial {
  string orcamento_produto_id = 1;

  SerialInfo serial = 2;
}

message GenerateFromOrcamentoResponse {
  Pedido pedido = 1;
}

message ListPedidoResponse {
  repeated Pedido pedidoList = 1;
}

message AddProductRequest {
  string parentId = 1; // ID do Pedido ao qual o produto será adicionado

  TipoMovimentacao type = 2; // Tipo do produto

  string productId = 3; // ID do Produto a ser adicionado

  Produto product = 4; // Dados do produto a ser adicionado
}

message AddProductResponse {
  Pedido pedido = 1;

  Produto product = 2;
}

message UpdateProductRequest {
  string parentId = 1;

  string productId = 2;

  Produto product = 3;
}

message UpdateProductResponse {
  Pedido pedido = 1;

  Produto product = 2;
}

message DeleteProductRequest {
  string parentId = 1;

  string productId = 2;
}

message DeleteProductResponse {
  Pedido pedido = 1;
}

message AddServiceRequest {
  string parentId = 1; // ID do Pedido ao qual o serviço será adicionado

  TipoMovimentacao type = 2; // Tipo do serviço

  string serviceId = 3; // ID do Serviço a ser adicionado

  Servico service = 4; // Dados do serviço a ser adicionado
}

message AddServiceResponse {
  Pedido pedido = 1;

  Servico service = 2;
}

message UpdateServiceRequest {
  string parentId = 1;

  string serviceId = 2;

  Servico service = 3;
}

message UpdateServiceResponse {
  Pedido pedido = 1;

  Servico service = 2;
}

message DeleteServiceRequest {
  string parentId = 1;

  string serviceId = 2;

  double quantity = 3;
}

message DeleteServiceResponse {
  Pedido pedido = 1;
}

message AddPaymentRequest {
  string parentId = 1;

  repeated Pagamento payments = 2;

  bool skip_financial_postings = 3; // Se true, pagamento fica com status LANCADO (sem lancamentos financeiros)

  // Recebimento de vários pedidos de uma vez (alternativa ao parentId). Com mais de um id,
  // os pagamentos devem quitar o saldo total dos pedidos (não há pagamento parcial),
  // dinheiro pode gerar troco e os pagamentos são rateados entre os pedidos.
  repeated string parent_ids = 4;
}

message AddPaymentResponse {
  Pedido pedido = 1;

  Pagamento pagamento = 2;

  repeated Pedido pedidos = 3; // preenchido no recebimento de vários pedidos (parent_ids)

  double troco = 4; // troco total do recebimento de vários pedidos (dinheiro acima do saldo)
}

message DeletePaymentRequest {
  string parentId = 1;

  string paymentId = 2;
}

message DeletePaymentResponse {
  Pedido pedido = 1;
}

message CancelPaymentRequest {
  string parentId = 1;

  string paymentId = 2;

  string paymentOnlineId = 3;

  string reason = 4;

  bool cancelOrder = 5; // indica que é uma request de cancelamento de pedido completo
}

message CancelPaymentResponse {
  Pedido pedido = 1;
}

message EffectuatePaymentsRequest {
  string parent_id = 1; // ID do pedido
}

message EffectuatePaymentsResponse {
  Pedido pedido = 1;
}

message SendByEmailRequest {
  string pedidoId = 1;

  string destEmail = 2; // E-mail para envio (opcional se whatsappNumero estiver preenchido)

  string email_integration_id = 3; // ID da integração de e-mail para envio; vazio usa a resolução padrão do sistema

  string whatsapp_numero = 4; // Número do WhatsApp para envio (opcional se destEmail estiver preenchido)

  string whatsapp_nome_destinatario = 5; // Nome do destinatário para WhatsApp (opcional)

  string whatsapp_integration_id = 6; // ID da integração WhatsApp para envio via API (opcional)

  // Modelo de mensagem a usar; vazio usa o modelo padrão do canal.
  string message_template_id = 7;
}

message SendByEmailResponse {
  string result = 1;

  string whatsapp_web_message = 2; // mensagem para envio via whatsapp web (fallback quando não há integração)

  string public_download_link = 3; // link público para download do pedido (JWT)
}

message SendReminderRequest {
  string id = 1; // id do orçamento
}

message SendReminderResponse {
  PedidoEvent event = 1; // lembrete registrado no histórico do orçamento

  repeated string falhas = 2; // canais que não saíram, com o motivo
}

message DownloadPdfPublicoRequest {
  string id = 1;
}

message DownloadPdfPublicoResponse {
  string filename = 1;

  string pdf_base64 = 2;
}

message AplicaTabelaPrecoRequest {
  string pedidoId = 1;

  string tabelaPreco = 2;
}

message AplicaTabelaPrecoResponse {
  Pedido pedido = 1;
}

message RecalcularComissaoRequest {
  repeated string ids = 1; // ids dos pedidos a recalcular (1 ou varios)

  bool sobrescrever_manuais = 2; // quando true, recalcula tambem itens com comissao definida manualmente

  bool incluir_fechados = 3; // quando true, recalcula tambem pedidos fechados (ressincroniza Contas a Pagar; ignora se a comissao ja foi paga)
}

message RecalcularComissaoResponse {
  repeated Pedido pedidos = 1; // pedidos efetivamente recalculados

  int32 recalculados = 2; // quantidade recalculada

  int32 ignorados = 3; // quantidade ignorada (ex.: pedido nao pendente)
}

message Billing {
  bool enabled = 1 [deprecated = true]; // a cobrança automática é definida pelo plano de cobrança, não pelo documento

  string billing_plan_id = 2 [deprecated = true];

  string billing_plan_name = 3 [deprecated = true];

  google.protobuf.Timestamp next_billing_date = 4;

  // O historico de envios vive no modulo apps/vendas/billing. Os campos
  // abaixo sao denormalizados aqui para suportar a regra de envio automatico
  // (limite de cobrancas e calculo da proxima data) sem precisar listar
  // todos os registros de cobranca a cada execucao do job.
  int32 billings_count = 6;

  google.protobuf.Timestamp last_billing_date = 7;

  // Envia a cobrança automática também pelo WhatsApp do cliente, além do e-mail.
  bool send_whatsapp = 8;

  // Conta de WhatsApp usada no envio; vazia usa a conta padrão da organização.
  string whatsapp_integration_id = 9;
}

enum ReportType {
  // Reports
  REPORT_TYPE_UNSPECIFIED = 0;

  REPORT_TYPE_ORDER_SUMMARY = 1;

  REPORT_TYPE_ORDER_SMALL_SUMMARY = 2;

  REPORT_TYPE_PAYMENT_BY_ACQUIRER_SUMMARY = 3;

  REPORT_TYPE_PAYMENT_BY_ACQUIRER_DETAIL = 4;

  REPORT_TYPE_GROUP_BY_PAYMENT_METHOD_SUMMARY = 5;

  REPORT_TYPE_GROUP_BY_PAYMENT_METHOD_DETAIL = 6;

  REPORT_TYPE_GROUP_BY_DATE = 7;

  REPORT_TYPE_GROUP_BY_PERSON = 8;

  REPORT_TYPE_GROUP_BY_PRODUCT = 9;

  REPORT_TYPE_GROUP_BY_SERVICE = 10;

  REPORT_TYPE_GROUP_BY_CATEGORY = 11;

  REPORT_TYPE_GROUP_BY_MANUFACTURER = 12;

  REPORT_TYPE_GROUP_BY_SELLER_COMMISSION = 13;

  REPORT_TYPE_SALES_SUMMARY = 14;

  REPORT_TYPE_SALES_DETAIL = 15;

  REPORT_TYPE_SALES_BY_PRODUCT = 16;

  REPORT_TYPE_SALES_BY_SERVICE = 17;

  REPORT_TYPE_SALES_BY_CATEGORY = 18;

  REPORT_TYPE_SALES_FOR_DELIVERY = 19;

  REPORT_TYPE_COMMISSION_BY_SELLER = 20;

  REPORT_TYPE_GROUP_BY_SELLER = 21;

  REPORT_TYPE_GROUP_BY_TECHNICAL_SERVICE = 22;

  REPORT_TYPE_YEAR_MONTH = 23;

  REPORT_TYPE_PROD_SERV_MOST_SOLD = 24;

  REPORT_TYPE_PROD_MOST_PROFITABLE = 25;

  REPORT_TYPE_SALES_BY_SELLER_UNIT_PRICE_DIFFERENCE = 26;

  // Dashboards
  REPORT_TYPE_DASHBOARD_SALES_SUMMARY = 27;

  REPORT_TYPE_DASHBOARD_SALES_TOP5 = 28;

  REPORT_TYPE_DASHBOARD_SALES_BY_REGION = 29;

  REPORT_TYPE_DASHBOARD_SALES_KPI = 30;

  REPORT_TYPE_ABC_CURVE_BY_PERSON = 31;
}

message ReportRequest {
  ListPedidoRequest list_request = 1;

  ReportType reportType = 2;

  string tipoRelatorio = 3;

  string sendByEmail = 4;
}

message ReportResponse {
  report.Response response = 1;
}

enum TipoMovimentacao {
  TIPO_UNSPECIFIED = 0;

  TIPO_ALL = 1;

  TIPO_PEDIDO = 2;

  TIPO_ORCAMENTO = 3;

  TIPO_OS = 4;

  TIPO_AUTHORIZATION = 5;

  TIPO_CART = 7;

  TIPO_CONTRACTSALES = 8;

  TIPO_CONTRACT = 9;

  TIPO_RENT_CAR = 10;
}

enum RecurrenceType {
  RECURRENCE_TYPE_UNSPECIFIED = 0;

  DAILY = 1;

  WEEKLY = 2;

  MONTHLY = 3;

  YEARLY = 4;
}

// Origem do pedido
enum Origin {
  ORIGIN_MARKETPLACE = 0; // Marketplace (ex: Mercado Livre)

  ORIGIN_ONLINE_STORE = 1; // Loja Virtual / E-commerce

  ORIGIN_EXTERNAL_SALESMAN = 2; // Vendedor Externo

  ORIGIN_GENERAL = 3; // Geral
}

// Mensagem que representa a origem do pedido
message OriginInfo {
  string name = 1; // Nome da origem

  string id = 2; // ID da origem

  string reference_number = 3; // Número de referência do processo que originou o pedido (ex: número do pedido no Mercado Livre)

  Origin origin_type = 4; // Tipo da origem do pedido
}

message OrderTag {
  string value = 1;

  string color = 2;
}

// Snapshot do status de acompanhamento (catálogo apps/vendas/acompanhamento)
// aplicado ao documento. No máximo um por documento.
message OrderAcompanhamento {
  string id = 1;

  string code = 2;

  string name = 3;

  string color = 4;
}

message SetAcompanhamentoRequest {
  string id = 1; // id do pedido

  string acompanhamento_id = 2; // id do registro no catálogo

  string code = 3; // alternativa ao id: code do registro (resolvido pelo tipo do documento)
}

message SetAcompanhamentoResponse {
  OrderAcompanhamento acompanhamento = 1;
}

message Pedido {
  google.protobuf.Timestamp createdAt = 1;

  google.protobuf.Timestamp updatedAt = 2;

  string userId = 3;

  string userName = 4;

  string id = 5;

  string account_id = 6;

  metadata.BasicFields fields = 7;

  string origem = 8;

  string origemId = 9;

  string tipo = 10;

  string situacao = 11;

  repeated OrderTag tags = 12;

  // Codigo ISO da moeda exibida ao cliente no momento da finalizacao
  // (ex.: "USD"). Vazio ou "BRL" indica pedido finalizado na moeda base,
  // sem conversao de exibicao. valorTotal permanece sempre na moeda base
  // para preservar a integridade fiscal de NFe/NFCe.
  string tipoMoeda = 13;

  // Cotacao aplicada no momento da finalizacao. Imutavel apos a criacao
  // do pedido. Valor 0 indica pedido legado ou finalizado sem snapshot de
  // conversao. Para reconstruir o valor exibido ao cliente, usar:
  // valorTotal * tipoMoedaCotacao.
  double tipoMoedaCotacao = 14;

  string tabelaPreco = 15;

  google.protobuf.Timestamp importadoEm = 16;

  Pessoa pessoa = 17;

  Pessoa vendedor = 18;

  int32 numero = 19;

  google.protobuf.Timestamp dataHoraRegistro = 20;

