message Contract {
  string number = 1;

  ContractType type = 2;

  RecurrenceType recurrence_type = 3;

  int32 recurrence_increment = 4;

  google.protobuf.Timestamp recurrence_due_date = 5;

  ContractStatus status = 6;

  string block_reason = 7 [deprecated = true]; // Substituído por status_reason

  LastAccess last_access = 8; // Último acesso (migrado de LicenciamentoModel)

  string recurrence_created_id = 10; // ID do contrato de recorrência criado

  string recurrence_created_number = 11; // Número do contrato de recorrência criado

  google.protobuf.Timestamp start_date = 12; // Data de início do contrato: fixada na criação do contrato original e copiada em cada recorrência (a cadeia inteira compartilha a mesma data)

  bool courtesy = 13; // Contrato de bonificação/cortesia: fica fora das métricas de receita e carteira; herdado pelas renovações

  int32 renewal_number = 14; // Número da renovação na cadeia do contrato: 0 no contrato original, incrementado a cada renovação gerada

  int32 grace_period_days = 15; // Dias de carência após o vencimento em que a licença do contrato permanece liberada antes do bloqueio; herdado pelas renovações

  bool auto_renew_disabled = 16; // Quando true, o contrato só é renovado manualmente: a geração automática do próximo ciclo perto do vencimento não acontece. Padrão (false) mantém a renovação automática; herdado pelas renovações

  string status_reason = 17; // Motivo informado na última mudança de status (suspensão, cancelamento, reativação)

  google.protobuf.Timestamp released_at = 18; // Ciclo liberado sem pagamento: passa a valer nesta data mesmo com a parcela em aberto. Vazio = só vale depois de quitada

  int32 trial_days = 19; // Duração total do período de avaliação, em dias corridos a partir da criação do contrato. Zero usa a duração padrão

  google.protobuf.Timestamp previous_due_date = 20; // Vencimento do ciclo anterior: até quando o cliente estava coberto quando esta parcela nasceu, e portanto o prazo para pagá-la. Vazio na primeira parcela da cadeia, em que o prazo é o próprio recurrence_due_date

  google.protobuf.Timestamp released_until = 21; // Prazo da liberação sem pagamento: até esta data o ciclo cobre o cliente mesmo já vencido. Vazio = a liberação vale só até o vencimento do ciclo

  google.protobuf.Timestamp trial_ends_at = 22; // Fim do período de avaliação. Vazio nos contratos anteriores ao campo, em que o prazo é a criação somada a trial_days

  double full_period_total = 23; // Valor do ciclo por um período inteiro, preenchido só quando esta parcela cobre uma fração do período e por isso foi cobrada proporcionalmente. Zero = a parcela cobre o período cheio e o total dela já é o valor do período

  message LastAccess {
    google.protobuf.Timestamp last_date = 1;

    string user_name = 2;
  }
}

enum ContractType {
  CONTRACT_TYPE_UNSPECIFIED = 0;

  CONTRACT_TYPE_PRE_PAID = 1;

  CONTRACT_TYPE_POST_PAID = 2;
}

enum ContractStatus {
  CONTRACT_STATUS_UNSPECIFIED = 0; // contrato sem status gravado; equivale a ACTIVE

  CONTRACT_STATUS_ACTIVE = 1;

  CONTRACT_STATUS_INACTIVE = 2 [deprecated = true];

  CONTRACT_STATUS_CANCELED = 3;

  // Situação de atraso do contrato é derivada do vencimento das parcelas, não do status.
  CONTRACT_STATUS_BLOCKED = 4 [deprecated = true];

  CONTRACT_STATUS_TRIAL = 5; // contrato em período de avaliação; vira ACTIVE no primeiro pagamento

  CONTRACT_STATUS_SUSPENDED = 6; // atendimento interrompido; o contrato segue existindo e não gera novas parcelas

  CONTRACT_STATUS_TRIAL_EXPIRED = 7; // avaliação encerrada sem pagamento; não gera parcela nova nem entra na cobrança automática
