  bool comissao_manual = 59; // Quando true, o percentual de comissão foi definido manualmente e não deve ser sobrescrito pelo padrão do vendedor

  // Origem da garantia aplicada no item (snapshot do cadastro: empresa ou fornecedor).
  TipoGarantia tipoGarantia = 64;

