  DanfeFormat format = 3;
}

message DfeDanfeResponse {
  report.Response response = 1;
}

message ImportRequest {
  string data = 1; // Conteúdo dos dados em base64 (arquivo ou API)

  string file_name = 2; // Nome do arquivo ou origem dos dados

  repeated Pedido orders = 3; // Pedidos a serem importados, no formato de lista e pedidos normal

  bool validate_only = 4; // Apenas validar sem importar

  bool import_pedido = 5; // Importar pedidos

  bool update_if_exists = 6; // Atualizar se já existir

  bool import_cliente = 7; // Importar clientes

  bool import_vendedor = 8; // Importar vendedores

  bool import_produto = 9; // Importar produtos

  bool import_servico = 10; // Importar serviços

  bool import_formas_pagamento = 11; // Importar formas de pagamento

  bool import_conta = 12; // Importar contas a receber e a pagar

  string mapping_id = 13; // ID do mapeamento de importação a ser utilizado

  bool overwrite_existing_fields = 14; // Se true (e update_if_exists): sobrescreve campos existentes; se false: preenche apenas campos vazios
}

message ImportResponse {
  imports.ImportResponse report = 1;
}

// Definições de mensagens para os novos métodos RPC

// SendPaymentLink - Send payment link
message SendPaymentLinkRequest {
  repeated string ids = 1;

  repeated Pedido pedidos = 2;

  string email = 3; // opcional: e-mail para envio do link; quando vazio usa o e-mail do pedido

  // canal usado para o envio: "email" (padrao) ou "whatsapp". Quando whatsapp,
  // o backend nao dispara o e-mail; envia pela integracao informada em
  // whatsapp_integration_id (vazio = envio no client via wa.me) e registra a
  // cobranca no modulo vendas/billing com o canal correto.
  string channel = 4;

  string email_integration_id = 5; // integração de e-mail para o envio; vazio usa a resolução padrão do sistema

  string billing_plan_id = 6; // plano de cobrança que originou o envio; vazio = disparo manual

  string billing_plan_name = 7;

  // WhatsApp enviado pelo servidor pela integração informada (API oficial ou por QR code).
  // Vazio mantém o envio pelo app local: o servidor só registra a cobrança.
  string whatsapp_integration_id = 10;

  // Template aprovado da API oficial; obrigatório quando a conta é oficial e o
  // destinatário está fora da janela de 24h. Variáveis: nome e link, nesta ordem.
  string whatsapp_template_name = 11;

  string whatsapp_template_language = 12; // vazio usa pt_BR

  // Modelo de mensagem a usar; vazio usa o modelo padrão do canal.
  string message_template_id = 13;
}

message SendPaymentLinkResponse {
  repeated Pedido pedidos = 1;

  // Mensagens prontas para o envio pelo WhatsApp do aparelho, uma por destinatário.
  // Preenchido só quando o envio não sai por integração.
  repeated WhatsappWebEnvio whatsapp_web = 2;
}

message WhatsappWebEnvio {
  string numero = 1;

  string mensagem = 2;
}

// MesclaPedidos - Criar pedidos mesclados
message MesclaPedidosRequest {
  string tipo = 1; // tipo de registro

  repeated string ids = 2; // IDs dos pedidos a serem mesclados

  string pessoaId = 3; // ID para gerar pedido mesclado de todos os pedidos desta pessoa

  string vendedorId = 4; // ID para gerar pedido mesclado de todos os pedidos deste vendedor
}

message MesclaPedidosResponse {
  Pedido pedido = 1;
}

// AddPedidoVinculado - Vincular pedido à mesclagem
message AddPedidoVinculadoRequest {
  string id = 1; // Id do pedido (mesclagem)

  PedidoVinculado pedido_vinculado = 2;
}

message AddPedidoVinculadoResponse {
  Pedido pedido = 1;
}

// DeletePedidoVinculado - Deleter pedido da mesclagem
message DeletePedidoVinculadoRequest {
  string id = 1; // Id do pedido (mesclagem)

  string pedidoVinculadoId = 2; // Id do pedido a ser removido da mesclagem
}

message DeletePedidoVinculadoResponse {
  Pedido pedido = 1;
}

// EnviaNFe - Enviar nota fiscal
message EnviaNFeRequest {
  repeated string ids = 1; // IDs dos pedidos selecionados

  string tipo = 2; // Nfe ou Nfc-e

  string pessoaId = 3; // Pessoa para emissão

  bool apenas_gerar = 4; // Se true, apenas gera a NF sem enviar para autorização
}

message EnviaNFeResponse {
  Pedido pedido = 1;
}

// SincronizaNFe - Sincronizar estado da nota fiscal
message SincronizaNFeRequest {
  string id = 1; // ID do pedido selecionado
}

message SincronizaNFeResponse {
  Pedido pedido = 1;
}

// SincronizaPessoa - Atualiza dados da pessoa no pedido a partir do cadastro
message SincronizaPessoaRequest {
  string id = 1;
}

message SincronizaPessoaResponse {
  Pedido pedido = 1;
}

// VinculaNFManual - Vincular NF manualmente
message VinculoNfManualRequest {
  string id = 1; // ID do pedido selecionado

  string nfeId = 2; // ID da nota fiscal

  string nfeTipo = 3; // Tipo da nota fiscal
}

message VinculoNfManualResponse {
  Pedido pedido = 1;
}

// Request e Response para impressão de Pedido
message PrintPedidoRequest {
  repeated string ids = 1; // IDs dos pedidos a serem impressos

  string modelo = 2; // Modelo de impressão a ser utilizado

  bool mostra_composicao = 3; // Mostrar composição dos produtos

  bool mostra_medidas = 4; // Mostrar medidas dos produtos

  bool incluir_imagens = 5; // Embutir as imagens anexadas ao documento, e não apenas a mais recente
}

message PrintPedidoResponse {
  report.Response response = 1; // Resposta do relatório gerado;
}

message CorrecaoMovimentacaoRequest {
  repeated string ids = 1; // ids dos pedidos em que a correção de movimentação será aplicada

  string produto_origem_id = 2; // id do produto de origem

  string produto_origem_nome = 3; // nome do produto de origem

  string produto_destino_id = 4; // id do produto de destino

  string produto_destino_nome = 5; // nome do produto de destino
}

message CorrecaoMovimentacaoResponse {
}

// ===== INFORMAÇÕES DE ENTREGA (ECOMMERCE) =====

// Informações de entrega do pedido para ecommerce
message DeliveryInfo {
  DeliveryMethod delivery_method = 1; // Método de entrega

  string delivery_zone_id = 2; // ID da zona de entrega

  string delivery_zone_name = 3; // Nome da zona de entrega

  double shipping_fee = 4; // Valor do frete

  int32 estimated_days = 5; // Dias estimados para entrega

  google.protobuf.Timestamp estimated_delivery_date = 6; // Data estimada de entrega

  string tracking_code = 7; // Código de rastreio

  string tracking_url = 8; // URL de rastreio

  string carrier_name = 9; // Nome da transportadora

  string carrier_service = 10; // Serviço (ex: "SEDEX", "PAC")

  string delivery_instructions = 11; // Instruções de entrega

  repeated DeliveryStatusHistory status_history = 12; // Histórico de status

  // Endereço de entrega (pode ser diferente do endereço do cliente)
  DeliveryAddress address = 13;

  // Para retirada na loja
  string pickup_location_id = 14; // ID do local de retirada

  string pickup_location_name = 15; // Nome do local

  google.protobuf.Timestamp pickup_scheduled_date = 16; // Data agendada para retirada
}

// Métodos de entrega
enum DeliveryMethod {
  DELIVERY_METHOD_UNSPECIFIED = 0;

  DELIVERY_METHOD_STANDARD = 1; // Entrega padrão

  DELIVERY_METHOD_EXPRESS = 2; // Entrega expressa

  DELIVERY_METHOD_PICKUP = 3; // Retirada na loja

  DELIVERY_METHOD_CORREIOS_PAC = 4; // PAC (Correios)

  DELIVERY_METHOD_CORREIOS_SEDEX = 5; // SEDEX (Correios)

  DELIVERY_METHOD_CORREIOS_SEDEX10 = 6; // SEDEX 10 (Correios)

  DELIVERY_METHOD_CUSTOM = 7; // Personalizado
}

// Histórico de status de entrega
message DeliveryStatusHistory {
  string status = 1; // Status (ex: "SHIPPED", "IN_TRANSIT", "DELIVERED")

  string description = 2; // Descrição

  google.protobuf.Timestamp timestamp = 3; // Data/hora

  string location = 4; // Localização
}

// Endereço de entrega
message DeliveryAddress {
  string recipient_name = 1; // Nome do destinatário

  string cep = 2; // CEP

  string street = 3; // Rua/Logradouro

  string number = 4; // Número

  string complement = 5; // Complemento

  string neighborhood = 6; // Bairro

  string city = 7; // Cidade

  string city_code = 8; // Código IBGE da cidade

  string state = 9; // Estado (UF)

  string phone = 10; // Telefone

  string reference = 11; // Ponto de referência
}

message ReorderItemsRequest {
  string id = 1;

  repeated string produto_ids = 2; // vazio mantém a ordem dos produtos

  repeated string servico_ids = 3; // vazio mantém a ordem dos serviços
}

message ReorderItemsResponse {
  Pedido pedido = 1;
}

// Base de apuração do realizado do vendedor.
enum BaseApuracao {
  // Valor total do documento fechado, na data do documento.
  BASE_APURACAO_DOCUMENTO = 0;

  // Valor de cada pagamento efetivado, na data do pagamento. Documento parcialmente pago
  // entra pelo valor já pago.
  BASE_APURACAO_PAGAMENTO = 1;
}

// Faixa de datas nomeada: a resposta traz um total por faixa, em uma única consulta.
message FaixaResumoVendas {
  string chave = 1;

  google.protobuf.Timestamp inicio = 2;

  google.protobuf.Timestamp fim = 3;
}

message ResumoVendasPorVendedorRequest {
  repeated string seller_ids = 1;

  repeated FaixaResumoVendas faixas = 2;

  // Tipos de documento que contam (ped, os, TIPO_CONTRACT). Vazio conta venda e OS.
  repeated string types = 3;

  BaseApuracao base = 4;
}

message TotalVendasVendedor {
  string seller_id = 1;

  string chave = 2;

  double valor = 3;

  int32 quantidade = 4;
}

message ResumoVendasPorVendedorResponse {
  repeated TotalVendasVendedor totais = 1;
}
