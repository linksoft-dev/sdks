}

// PedidoWebhook registra um endpoint externo a ser avisado quando a situação do
// pedido muda. A notificação diz apenas o que aconteceu e com qual pedido: o
// consumidor consulta o pedido para obter os dados antes de agir sobre eles.
message PedidoWebhook {
  string id = 1;

  // Endereço HTTPS que recebe a notificação.
  string url = 2;

  // Situações que disparam a notificação (FECHADO, CANCELADO). Vazio = todas.
  repeated string events = 3;

  // Segredo usado para assinar o corpo em X-Sigeflex-Signature (HMAC-SHA256).
  // Nunca é devolvido em leitura.
  string secret = 4;

  google.protobuf.Timestamp last_attempt_at = 6;

  // Situação da última tentativa de entrega: PENDENTE, ENTREGUE ou FALHOU.
  string last_status = 7;

  string last_error = 8;

  int32 attempts = 9;
}

// TipoGarantia identifica a origem da garantia copiada no item do pedido/OS.
// UNSPECIFIED cobre item sem garantia, garantia digitada manualmente ou legado
// sem o campo preenchido.
enum TipoGarantia {
  TIPO_GARANTIA_UNSPECIFIED = 0;

  TIPO_GARANTIA_EMPRESA = 1;

  TIPO_GARANTIA_FORNECEDOR = 2;
}

// Warranty resume a garantia ativa do pedido num formato direto pra consulta
// (sem precisar varrer os itens). Preenchido no fechamento a partir da garantia
// do pedido e/ou dos itens.
message Warranty {
  google.protobuf.Timestamp active_until = 1; // Maior data de fim de garantia entre o pedido e seus itens

  int32 items_count = 2; // Quantidade de itens cobertos por garantia

  double value = 3; // Valor total coberto por garantia
}

