message LicenciamentoModel {
  // TipoContrato
  string tipoContrato = 1;

  string numeroSerie = 2;

  string codigoAutorizacao = 3;

  string motivoBloqueio = 4;

  UltimoAcesso ultimoAcesso = 5;

