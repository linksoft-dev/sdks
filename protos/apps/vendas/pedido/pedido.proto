  string userId = 4; // ID do usuário que realizou a ação

  string userName = 5; // Nome do usuário que realizou a ação

  string situacao = 6;

  string userUpdateId = 7;

  string userUpdateNome = 8;

  string formaPagamentoId = 9;

  string formaPagamentoNome = 10;

  string pagamentoOnlineId = 11;

  string tipoPagamento = 12;

  bool usarCarteiraCashback = 13;

  bool avista = 14;

  double valorPago = 15;

  double valorLiquido = 16;

  string cartaCreditoId = 17; // identificação da carta de credito para usar seu valor para pagamento ou estorno

  string cartaoComprovante = 18;

  string cartaoCodigoAutorizacao = 19;

  string cartaoRedeAdquirente = 20;

  string cartaoRedeAdquirenteCnpj = 21;

  string cartaoNomeCartaoAdministradora = 22;

  string moedaTipoRecebimento = 23; // Assumindo que currency.Code é um enum ou tipo importado em seu projeto

  double moedaCotacao = 24;

  double valorTipoMoeda = 25;

  double adquirenteValorReceber = 26;

  double adquirenteTaxaValor = 27;

  double adquirenteTaxaPercentual = 28;

  double adquirenteTaxaFixaValor = 29;

  string caixaNome = 30;

  string caixaId = 31;

  int32 numeroParcelas = 32;

  repeated Parcelas parcelas = 33;

  google.protobuf.Timestamp dataHoraCancelamento = 34;

  string motivoCancelamento = 35;

  string transactionNumber = 36;

  string transactionId = 37;

  enum paymentOrigin {
    PAYMENT_ORIGIN_UNSPECIFIED = 0;

    PAYMENT_ORIGIN_ONLINE = 1;

    PAYMENT_ORIGIN_OFFLINE = 2;
  }

  paymentOrigin origin = 38;
}

