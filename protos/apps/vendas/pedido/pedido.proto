    google.protobuf.Timestamp lastDate = 1;

    string userName = 2;
  }
}

message PedidoVinculado {
  string id = 1;

  string pedidoId = 2;

  int32 numero = 3;

  double total = 4;

  string tipo = 5;

  string clienteNome = 6; // cliente do pedido vinculado, que não é necessariamente o da fatura que o agrupa

  string clienteCpfCnpj = 7;

  string origemNumero = 8; // número do documento que originou o pedido vinculado, para conferência com quem o emitiu

  google.protobuf.Timestamp data = 9; // data do pedido vinculado
}

message DescontoAplicadosModel {
  string id = 1;

  google.protobuf.Timestamp createdAt = 2; // Data de criação

  google.protobuf.Timestamp updatedAt = 3; // Data de atualização

  string userId = 4; // ID do usuário que realizou a ação

  string userName = 5; // Nome do usuário que realizou a ação

  string descontoId = 6;

  string descontoNome = 7;

  double valor = 8;

  // Quanto a promoção concedeu em cada item. Vazio quando ela incide sobre a venda inteira.
  // É o que permite separar a promoção do desconto digitado no item.
  repeated DescontoItemAplicado itens = 9;
}

message CupomAplicadoModel {
  string cupomId = 1;

  string codigo = 2;

  double valor = 3; // Valor total concedido pelo cupom nesta venda

  bool cumulativo = 4; // Cópia da regra do cadastro no momento da aplicação

  google.protobuf.Timestamp aplicadoEm = 5;

  // Quanto o cupom concedeu em cada item. Vazio quando o desconto incide sobre a venda
  // inteira. Permite desfazer exatamente o que foi concedido antes de recalcular.
  repeated DescontoItemAplicado itens = 6;
}

// DescontoItemAplicado registra quanto um desconto concedeu em cada item. Serve à promoção
// e ao cupom: os dois precisam saber o que concederam para desfazer no recálculo e para
// separar o que é desconto de cadastro do que o operador digitou.
message DescontoItemAplicado {
  string itemId = 1;

  bool servico = 2; // Distingue item de serviço de item de produto

  double valor = 3;
}

message CashbackAplicadosModel {
  string id = 1;

  google.protobuf.Timestamp createdAt = 2; // Data de criação

  google.protobuf.Timestamp updatedAt = 3; // Data de atualização

  string userId = 4; // ID do usuário que realizou a ação

  string userName = 5; // Nome do usuário que realizou a ação

  string cashbackId = 6;

  string cashbackNome = 7;

  double valor = 8;
}

message Partnership {
  string partnership_id = 1;

  string partnership_name = 2;

  string titular_id = 3;

  string titular_name = 4;

  string dependent_id = 5;

  string dependent_name = 6;
}

// dados de confirmação do recebimento do pedido
message ConfirmationOrderReceipt {
  google.protobuf.Timestamp date_time = 1; // data/hora de confirmação do recebimento do pedido

  string user_id = 2; // id do usuario que confirmou o recebimento do pedido

  string user_name = 3; // nome do usuario que confirmou o recebimento do pedido

  string url = 4; // url do serviço de confirmação do recebimento do pedido
}

message CuponsSorteio {
  string id = 1;

  string cupomId = 2;
}

enum DanfeFormat {
