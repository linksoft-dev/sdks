syntax = "proto3";

package desconto;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/vendas/desconto";

// Serviço Desconto com operações CRUD
service DescontoService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  // GetDesconto retorna o melhor desconto baseado nos critérios passados
  rpc GetDesconto ( GetDescontoRequest ) returns ( GetDescontoResponse );

  // GetDescontosProdutos devolve o desconto vigente de cada produto, para exibição em vitrine/consulta
  rpc GetDescontosProdutos ( GetDescontosProdutosRequest ) returns ( GetDescontosProdutosResponse );

  // ValidateCoupon avalia um código de cupom contra os dados da venda e devolve o desconto elegível, sem consumir o cupom
  rpc ValidateCoupon ( ValidateCouponRequest ) returns ( ValidateCouponResponse );

  // UseCoupon consome um cupom de desconto, incrementando a quantidade utilizada e alterando a situação se necessário
  rpc UseCoupon ( UseCouponRequest ) returns ( UseCouponResponse );

  // ReleaseCoupon devolve o uso do cupom associado ao pedido, quando o cadastro permite liberar no cancelamento
  rpc ReleaseCoupon ( ReleaseCouponRequest ) returns ( ReleaseCouponResponse );
}

enum Tipo {
  TIPO_UNSPECIFIED = 0;

  TIPO_DESCONTO = 1;

  TIPO_PROMOCOES = 2;
}

enum Situacao {
  SITUACAO_UNSPECIFIED = 0;

  SITUACAO_ATIVO = 1;

  SITUACAO_INATIVO = 2;
}

enum TipoGrupo {
  TIPO_GRUPO_UNSPECIFIED = 0;

  TIPO_GRUPO_CLIENTE = 1;

  TIPO_GRUPO_VENDEDOR = 2;
}

// Dados do Desconto
message Desconto {
  google.protobuf.Timestamp created_at = 1;

  google.protobuf.Timestamp updated_at = 2;

  string user_id = 3;

  string user_name = 4;

  string id = 5;

  metadata.BasicFields fields = 6;

  string nome = 7;

  Tipo tipo = 8;

  Situacao situacao = 9;

  string situacao_caption = 10;

  TipoGrupo tipo_grupo = 11;

  string grupo_id = 12;

  string grupo_nome = 13;

  google.protobuf.Timestamp validade_a_partir = 14;

  google.protobuf.Timestamp validade_ate = 15;

  // Controle por dia da semana e intervalo durante o dia
  bool dia_semana_segunda = 16;

  google.protobuf.Timestamp dia_semana_segunda_horario_inicial = 17;

  google.protobuf.Timestamp dia_semana_segunda_horario_final = 18;

  bool dia_semana_terca = 19;

  google.protobuf.Timestamp dia_semana_terca_horario_inicial = 20;

  google.protobuf.Timestamp dia_semana_terca_horario_final = 21;

  bool dia_semana_quarta = 22;

  google.protobuf.Timestamp dia_semana_quarta_horario_inicial = 23;

  google.protobuf.Timestamp dia_semana_quarta_horario_final = 24;

  bool dia_semana_quinta = 25;

  google.protobuf.Timestamp dia_semana_quinta_horario_inicial = 26;

  google.protobuf.Timestamp dia_semana_quinta_horario_final = 27;

  bool dia_semana_sexta = 28;

  google.protobuf.Timestamp dia_semana_sexta_horario_inicial = 29;

  google.protobuf.Timestamp dia_semana_sexta_horario_final = 30;

  bool dia_semana_sabado = 31;

  google.protobuf.Timestamp dia_semana_sabado_horario_inicial = 32;

  google.protobuf.Timestamp dia_semana_sabado_horario_final = 33;

  bool dia_semana_domingo = 34;

  google.protobuf.Timestamp dia_semana_domingo_horario_inicial = 35;

  google.protobuf.Timestamp dia_semana_domingo_horario_final = 36;

  repeated Item itens = 37;

  double valor_venda_maior_que = 38;

  double desconto_percentual = 39;

  Coupon coupon = 40; // Dados do cupom de desconto para uso em loja virtual

  // Valor fixo de desconto, alternativo ao percentual. Percentual e valor fixo são mutuamente exclusivos.
  double desconto_valor = 41;

  // Quando falso, o registro não pode ser combinado com outro desconto já incidindo sobre a venda.
  bool cumulativo = 42;

  // Preenchidos pelo servidor quando quem salva tem permissão para liberar desconto acima do teto.
  // O cliente não grava esses campos: são consequência da permissão, não um checkbox.
  bool autorizado_acima_do_teto = 43;

  string autorizado_por_user_id = 44;

  string autorizado_por_user_name = 45;

  google.protobuf.Timestamp autorizado_em = 46;

  // Pior caso (percentual efetivo) que a autorização cobriu. Em edição, se o novo pior caso
  // passar deste valor, a autorização anterior cai e precisa de nova liberação.
  double percentual_efetivo_autorizado = 47;
}

enum TipoItem {
  TIPO_ITEM_UNSPECIFIED = 0;

  TIPO_ITEM_POR_CATEGORIA_PRODUTO = 1;

  TIPO_ITEM_POR_CATEGORIA_SERVICO = 2;

  TIPO_ITEM_POR_SERVICO = 3;

  TIPO_ITEM_POR_PRODUTO = 4;
}

message Item {
  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  string user_id = 4;

  string user_name = 5;

  TipoItem tipo_item = 6;

  string item_id = 7;

  string item_nome = 8;

  string categoria_id = 9;

  string categoria_nome = 10;

  double quantidade_maior_que = 11;

  double desconto_percentual = 12;
}

// Request e Response para criação de Desconto
message CreateRequest {
  Desconto desconto = 1;
}

message CreateResponse {
  Desconto desconto = 1;
}

// Request e Response para atualização de Desconto
message UpdateRequest {
  string id = 1;

  Desconto desconto = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  Desconto desconto = 1;
}

// Request e Response para exclusão de Desconto
message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

// Request para obter um Desconto por ID
message GetRequest {
  string id = 1;
}

message GetResponse {
  Desconto desconto = 1;
}

// Request e Response para listagem de Descontos
message ListRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListResponse {
  repeated Desconto desconto_list = 1;

  string next_page_token = 2;
}

// Criterio dados de entrada para GetDesconto
message Criterio {
  Tipo tipo = 1;

  string cliente_id = 2;

  string vendedor_id = 3;

  repeated CriterioItem itens = 4;

  double valor_venda = 5;
}

message CriterioItem {
  string id = 1;

  TipoItem tipo_item = 2;

  double quantidade = 3;

  // Categoria do item na venda. Quem chama pode deixar vazio: o serviço resolve a
  // categoria dos produtos quando existe alguma regra cadastrada por categoria.
  string categoria_id = 4;
}

// DescontoElegivel representa o desconto a ser aplicado
message DescontoElegivel {
  string id = 1;

  string nome = 2;

  bool todos_os_itens = 3;

  double percentual_desconto = 4;

  repeated DescontoElegivelItem itens = 5;

  // Valor fixo a conceder, alternativo ao percentual. Quando há itens elegíveis,
  // o valor é rateado entre eles proporcionalmente.
  double valor_desconto = 6;
}

message DescontoElegivelItem {
  string item_id = 1;

  TipoItem tipo_item = 2;

  double percentual_desconto = 3;
}

// Request e Response para GetDesconto
message GetDescontoRequest {
  Criterio criterio = 1;
}

message GetDescontoResponse {
  DescontoElegivel desconto_elegivel = 1;
}

// Coupon representa os dados do cupom de desconto para uso em loja virtual
message Coupon {
  string code = 1; // Código do cupom

  int32 usage_limit = 2; // Quantidade máxima de vezes que pode ser usado (0 = ilimitado)

  int32 usage_count = 3; // Quantidade de vezes que já foi utilizado

  repeated CouponUsage usage_history = 4; // Histórico de usos do cupom

  // Quantidade máxima de usos por CPF/CNPJ (0 = ilimitado). Acima de zero, exige o CPF/CNPJ do comprador.
  int32 usage_limit_per_customer = 5;

  // Quando true, o uso é devolvido se o pedido for cancelado. Default false: cancelar não libera a vaga.
  bool release_on_cancel = 6;
}

// CouponUsage representa um uso do cupom
message CouponUsage {
  google.protobuf.Timestamp used_at = 1; // Data e hora do uso

  string user_id = 2; // ID do usuário que utilizou

  string user_name = 3; // Nome do usuário que utilizou

  string order_id = 4; // ID do pedido onde foi utilizado

  string order_number = 5; // Número do pedido onde foi utilizado

  string client_id = 6; // ID do cliente que utilizou

  string client_name = 7; // Nome do cliente que utilizou

  double order_value = 8; // Valor do pedido

  double discount_value = 9; // Valor do desconto aplicado

  string client_cpf_cnpj = 10; // CPF/CNPJ do comprador, base da contagem de uso por cliente
}

// Request e Response para UseCoupon
message UseCouponRequest {
  string code = 1; // Código do cupom a ser utilizado

  string order_id = 2; // ID do pedido onde será utilizado

  string client_id = 3; // ID do cliente que está utilizando

  string client_cpf_cnpj = 4; // CPF/CNPJ do comprador

  string order_number = 5; // Número do pedido onde será utilizado

  double order_value = 6; // Valor do pedido

  double discount_value = 7; // Valor do desconto concedido pelo cupom
}

message UseCouponResponse {
  Desconto desconto = 1; // Desconto atualizado após o uso

  bool was_exhausted = 2; // Indica se o cupom foi esgotado após este uso

  CouponUsage usage = 3; // Dados do uso registrado
}

message ReleaseCouponRequest {
  string code = 1; // Código do cupom

  string order_id = 2; // ID do pedido cujo uso deve ser devolvido
}

message ReleaseCouponResponse {
  Desconto desconto = 1; // Desconto atualizado após a liberação (ou inalterado se não houve liberação)

  bool released = 2; // True quando um uso do pedido foi removido do histórico
}

// Request e Response para ValidateCoupon
message ValidateCouponRequest {
  string code = 1; // Código do cupom informado pelo comprador

  Criterio criterio = 2; // Dados da venda avaliada (valor, cliente e itens)

  string cpf_cnpj = 3; // CPF/CNPJ do comprador, exigido quando o cupom limita uso por cliente

  // Indica que a venda já tem outro desconto aplicado; cupom não cumulativo é recusado nesse caso.
  bool tem_desconto_aplicado = 4;
}

message ValidateCouponResponse {
  bool valid = 1; // Indica se o cupom pode ser aplicado à venda avaliada

  string message = 2; // Motivo da recusa, quando não for válido

  DescontoElegivel desconto_elegivel = 3; // Desconto a aplicar quando válido

  string cupom_id = 4; // ID do cadastro do cupom

  bool cumulativo = 5; // Indica se o cupom acumula com outros descontos
}

// ProdutoConsultado identifica um produto avaliado para exibição, com a categoria a que pertence
message ProdutoConsultado {
  string produto_id = 1;

  string categoria_id = 2;
}

// GetDescontosProdutos avalia só o que depende do produto: situação, vigência, dia da semana
// e a lista de itens/categorias. Regras que dependem da venda — valor mínimo, quantidade
// mínima e, sem cliente identificado, grupo — ficam de fora, porque na consulta ainda não
// existe venda para avaliá-las. Elas continuam valendo no carrinho.
message GetDescontosProdutosRequest {
  repeated ProdutoConsultado produtos = 1;

  string cliente_id = 2; // Quando informado, habilita as promoções restritas a grupo de cliente
}

message DescontoProduto {
  string produto_id = 1;

  double percentual_desconto = 2;

  string desconto_id = 3;

  string desconto_nome = 4;
}

message GetDescontosProdutosResponse {
  repeated DescontoProduto descontos = 1;
}
