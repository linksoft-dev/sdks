syntax = "proto3";

package inventario;

import "apps/report/report.proto";

import "common/metadata/metadata.proto";

import "filter/filter.proto";

import "google/api/annotations.proto";

import "google/protobuf/timestamp.proto";

import "plugins/service/service.proto";

import "plugins/validate/validate.proto";

option go_package = "comps/pb/apps/estoque/inventario";

// Serviço Inventario com operações CRUD
service InventarioService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  rpc Gerar ( GerarRequest ) returns ( GerarResponse );

  rpc Imprimir ( ImprimirRequest ) returns ( ImprimirResponse );

  rpc EnviaPorEmail ( EnviaPorEmailRequest ) returns ( EnviaPorEmailResponse );
}

// Dados do Inventario
message Inventario {
  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  string nome = 4;

  bool nfce = 5;

  bool nfe = 6;

  bool pedido = 7;

  google.protobuf.Timestamp data_inicio = 8;

  google.protobuf.Timestamp data_fim = 9;

  double total_custo = 10;

  double total_atacado = 11;

  double total = 12;

  double total_aprazo = 13;

  repeated InventarioProduto produtos = 14;
}

// Produto do Inventario
message InventarioProduto {
  string id = 1;

  string produto_id = 2;

  string produto_nome = 3;

  string codigo = 4;

  string un = 5;

  double quantidade = 6;

  double preco_custo = 7;

  double preco_venda_atacado = 8;

  double valor_unitario = 9;

  double preco_venda_aprazo = 10;

  double total_custo = 11;

  double total_atacado = 12;

  double total = 13;

  double total_aprazo = 14;
}

// Request e Response para criação de Inventario
message CreateRequest {
  Inventario inventario = 1;
}

message CreateResponse {
  Inventario inventario = 1;
}

// Request e Response para atualização de Inventario
message UpdateRequest {
  string id = 1;

  Inventario inventario = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  Inventario inventario = 1;
}

// Request e Response para exclusão de Inventario
message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

// Request para obter um Inventario por ID
message GetRequest {
  string id = 1;
}

message GetResponse {
  Inventario inventario = 1;
}

// Request e Response para listagem de Inventarios
message ListRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListResponse {
  repeated Inventario inventario_list = 1;

  string next_page_token = 2;
}

// Request e Response para gerar inventário
message GerarRequest {
  string id = 1;
}

message GerarResponse {
  Inventario inventario = 1;
}

// Request e Response para impressão
message ImprimirRequest {
  string id = 1;
}

message ImprimirResponse {
  report.Response response = 1;
}

// Request e Response para envio por email
message EnviaPorEmailRequest {
  string id = 1;

  string email = 2;

  report.ReportFormat format = 3;

  string subject = 4; // Assunto do email

  string recipient_name = 5; // Nome do destinatário

  string integration_id = 6; // integração de e-mail para o envio; vazio usa a resolução padrão do sistema
}

message EnviaPorEmailResponse {
  Inventario inventario = 1;
}
