syntax = "proto3";

package stockmovement;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/estoque/stockmovement";

// Serviço StockMovement com operações CRUD
service StockMovementService {
  rpc Create ( CreateRequest ) returns ( CreateResponse );

  rpc Update ( UpdateRequest ) returns ( UpdateResponse );

  rpc Delete ( DeleteRequest ) returns ( DeleteResponse );

  rpc Get ( GetRequest ) returns ( GetResponse );

  rpc List ( ListRequest ) returns ( ListResponse );

  rpc AddProduto ( AddProdutoRequest ) returns ( AddProdutoResponse );

  rpc UpdateProduto ( UpdateProdutoRequest ) returns ( UpdateProdutoResponse );

  rpc DeleteProduto ( DeleteProdutoRequest ) returns ( DeleteProdutoResponse );

  rpc Finaliza ( FinalizaRequest ) returns ( FinalizaResponse );

  rpc Cancela ( CancelaRequest ) returns ( CancelaResponse );
}

enum MovementType {
  MOVEMENT_TYPE_UNSPECIFIED = 0;

  MOVEMENT_TYPE_INPUT = 1; // Entrada

  MOVEMENT_TYPE_OUTPUT = 2; // Saída
}

enum Situacao {
  SITUACAO_NAO_ESPECIFICADA = 0;

  SITUACAO_PENDENTE = 1;

  SITUACAO_FINALIZADA = 2;

  SITUACAO_CANCELADA = 3;
}

// Informações da pessoa (fornecedor/cliente)
message Pessoa {
  string id = 1;

  string cpf_cnpj = 2;

  string nome = 3;

  string nome_2 = 4;

  string ie = 5;

  string end_cep = 6;

  string end_endereco = 7;

  string end_numero = 8;

  string end_bairro = 9;

  string end_cidade = 10;

  string end_cidade_cod = 11;

  string end_uf = 12;

  string end_complemento = 13;

  string email = 14;

  string telefone = 15;
}

// Dados do StockMovement
message StockMovement {
  google.protobuf.Timestamp created_at = 1; // Data de criação

  google.protobuf.Timestamp updated_at = 2; // Data de atualização

  string user_id = 3; // ID do usuário que realizou a ação

  string user_name = 4; // Nome do usuário que realizou a ação

  string id = 5;

  uint32 numero = 6;

  Pessoa pessoa = 7;

  google.protobuf.Timestamp data_hora_movimento = 8;

  Situacao situacao = 9;

  string motivo_cancelamento = 10;

  google.protobuf.Timestamp data_hora_cancelamento = 11;

  string cancelamento_usuario_id = 12;

  string cancelamento_usuario_nome = 13;

  string obs = 14;

  double total = 15;

  repeated Item produtos = 16;

  // Novos campos para controle de lote
  MovementType type = 17; // Tipo de movimentação (ENTRADA/SAÍDA)

  string batch_id = 18; // ID do lote vinculado (opcional)

  // Controle de número de série
  repeated string serial_ids = 19; // IDs dos seriais vinculados (opcional)
}

message Item {
  google.protobuf.Timestamp created_at = 1; // Data de criação

  google.protobuf.Timestamp updated_at = 2; // Data de atualização

  string user_id = 3; // ID do usuário que realizou a ação

  string user_name = 4; // Nome do usuário que realizou a ação

  string id = 5;

  string produto_id = 6;

  string produto_nome = 7;

  string un = 8;

  string servico_nome = 9;

  string servico_id = 10;

  string obs = 11;

  double valor_unitario = 12;

  double quantidade = 13;

  double total = 14;

  // Campo para vincular item ao lote
  string batch_id = 15; // ID do lote vinculado (opcional)

  string variation_product_id = 16;

  // Controle de número de série
  repeated string serial_ids = 17; // IDs dos seriais vinculados (opcional)
}

// Request e Response para criação de StockMovement
message CreateRequest {
  StockMovement stock_movement = 1;
}

message CreateResponse {
  StockMovement stock_movement = 1;
}

// Request e Response para atualização de StockMovement
message UpdateRequest {
  string id = 1;

  StockMovement stock_movement = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateResponse {
  StockMovement stock_movement = 1;
}

// Request e Response para exclusão de StockMovement
message DeleteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteResponse {
  string id = 1;
}

// Request para obter um StockMovement por ID
message GetRequest {
  string id = 1;
}

message GetResponse {
  StockMovement stock_movement = 1;
}

// Request e Response para listagem de StockMovements
message ListRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;

  google.protobuf.Timestamp created_at_gte = 6;

  google.protobuf.Timestamp created_at_lte = 7;

  google.protobuf.Timestamp data_hora_cancelamento_gte = 8;

  google.protobuf.Timestamp data_hora_cancelamento_lte = 9;

  double total_gte = 10;

  double total_lte = 11;

  string pessoa_id = 12;

  Situacao situacao = 13;

  repeated string situacao_in = 14;

  string produto_id_contem = 15;

  // Novos filtros para controle de lote
  repeated MovementType types = 16; // Filtrar por tipo de movimentação

  string batch_id = 17; // Filtrar por lote

  repeated string batch_ids = 18; // Filtrar por múltiplos lotes
}

message ListResponse {
  repeated StockMovement stock_movement_list = 1;

  string next_page_token = 2;
}

// Request e Response para adicionar produto
message AddProdutoRequest {
  string movement_id = 1;

  Item item = 2;
}

message AddProdutoResponse {
  StockMovement stock_movement = 1;
}

// Request e Response para atualizar produto
message UpdateProdutoRequest {
  string movement_id = 1;

  string item_id = 2;

  Item item = 3;
}

message UpdateProdutoResponse {
  StockMovement stock_movement = 1;
}

// Request e Response para deletar produto
message DeleteProdutoRequest {
  string movement_id = 1;

  string item_id = 2;
}

message DeleteProdutoResponse {
  StockMovement stock_movement = 1;
}

// Request e Response para finalizar movimento
message FinalizaRequest {
  string movement_id = 1;
}

message FinalizaResponse {
  StockMovement stock_movement = 1;
}

// Request e Response para cancelar movimento
message CancelaRequest {
  string movement_id = 1;

  string motivo = 2;
}

message CancelaResponse {
  StockMovement stock_movement = 1;
}
