syntax = "proto3";

package batch;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

import "apps/report/report.proto";

option go_package = "comps/pb/apps/estoque/batch";

// Serviço Batch com operações CRUD
service BatchService {
  rpc Create ( CreateBatchRequest ) returns ( CreateBatchResponse );

  rpc Update ( UpdateBatchRequest ) returns ( UpdateBatchResponse );

  rpc Delete ( DeleteBatchRequest ) returns ( DeleteBatchResponse );

  rpc Get ( GetBatchRequest ) returns ( GetBatchResponse );

  rpc List ( ListBatchRequest ) returns ( ListBatchResponse );

  rpc Report ( ReportRequest ) returns ( ReportResponse );
}

// Enum para Status do Lote
enum BatchStatus {
  BATCH_STATUS_UNSPECIFIED = 0;

  BATCH_STATUS_ACTIVE = 1; // Lote ativo e disponível

  BATCH_STATUS_EXPIRED = 2; // Lote vencido

  BATCH_STATUS_BLOCKED = 3; // Lote bloqueado

  BATCH_STATUS_DEPLETED = 4; // Lote esgotado (quantidade zero)
}

// Mensagem principal Batch
message Batch {
  metadata.BasicFields fields = 1;

  // Campos de auditoria
  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  string user_id = 4;

  string user_name = 5;

  // Dados do lote
  string id = 6;

  string account_id = 7;

  string batch_number = 8;

  // Vinculação com produto e estoque
  string product_id = 9;

  string product_name = 10; // denormalizado

  string stock_id = 11;

  string stock_name = 12; // denormalizado

  // Quantidade
  int64 quantity = 13;

  // Datas
  google.protobuf.Timestamp manufacturing_date = 14;

  google.protobuf.Timestamp expiration_date = 15;

  // Fornecedor
  string supplier_id = 16;

  string supplier_name = 17; // denormalizado

  // Status do lote
  BatchStatus status = 18;
}

// Request e Response para CreateBatch
message CreateBatchRequest {
  Batch batch = 1;
}

message CreateBatchResponse {
  Batch batch = 1;
}

// Request e Response para UpdateBatch
message UpdateBatchRequest {
  string id = 1;

  Batch batch = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateBatchResponse {
  Batch batch = 1;
}

// Request e Response para DeleteBatch
message DeleteBatchRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteBatchResponse {
  string id = 1;
}

// Request e Response para GetBatch
message GetBatchRequest {
  string id = 1;
}

message GetBatchResponse {
  Batch batch = 1;
}

// Request e Response para ListBatches
message ListBatchRequest {
  repeated string ids = 1;

  // Filtros específicos
  repeated string product_ids = 2;

  repeated string stock_ids = 3;

  repeated BatchStatus statuses = 4;

  // Filtros de data de vencimento
  google.protobuf.Timestamp expiration_date_gte = 5;

  google.protobuf.Timestamp expiration_date_lte = 6;

  // Filtros de quantidade
  int64 quantity_gte = 7;

  int64 quantity_lte = 8;

  // Filtro genérico
  Filter filter = 9;

  // Paginação
  uint32 page_size = 10;

  string page_token = 11;

  // Outros filtros
  google.protobuf.Timestamp created_at_gte = 12;

  google.protobuf.Timestamp created_at_lte = 13;

  google.protobuf.Timestamp manufacturing_date_gte = 14;

  google.protobuf.Timestamp manufacturing_date_lte = 15;

  repeated string supplier_ids = 16;

  string batch_number = 17;
}

message ListBatchResponse {
  repeated Batch batch_list = 1;

  string next_page_token = 2;
}

// Request e Response para Report
message ReportRequest {
  string tipo_relatorio = 1;

  ListBatchRequest list_batch_request = 2;
}

message ReportResponse {
  report.Response response = 1;
}
