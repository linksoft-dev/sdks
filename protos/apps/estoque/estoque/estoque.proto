syntax = "proto3";

package estoque;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/estoque/estoque";

// Serviço de Estoque com operações CRUD
service EstoqueService {
  rpc Create ( CreateEstoqueRequest ) returns ( CreateEstoqueResponse );

  rpc Update ( UpdateEstoqueRequest ) returns ( UpdateEstoqueResponse );

  rpc Delete ( DeleteEstoqueRequest ) returns ( DeleteEstoqueResponse );

  rpc Get ( GetEstoqueRequest ) returns ( GetEstoqueResponse );

  rpc List ( ListEstoqueRequest ) returns ( ListEstoqueResponse );
}

// Enum para situação do estoque
enum EstoqueSituacao {
  ESTOQUE_SITUACAO_ATIVO = 0;

  ESTOQUE_SITUACAO_INATIVO = 1;
}

// Mensagem principal de Estoque
message Estoque {
  metadata.BasicFields fields = 1;

  string id = 2; // Identificador único (pode ser "PADRAO" ou UUID)

  string nome = 3;

  string descricao = 4;

  EstoqueSituacao situacao = 5;

  // Campos de auditoria
  google.protobuf.Timestamp created_at = 6;

  google.protobuf.Timestamp updated_at = 7;

  string user_id = 8;

  string user_name = 9;
}

// Request e Response para criação de Estoque
message CreateEstoqueRequest {
  Estoque estoque = 1;
}

message CreateEstoqueResponse {
  Estoque estoque = 1;
}

// Request e Response para atualização de Estoque
message UpdateEstoqueRequest {
  string id = 1;

  Estoque estoque = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateEstoqueResponse {
  Estoque estoque = 1;
}

// Request e Response para exclusão de Estoque
message DeleteEstoqueRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteEstoqueResponse {
  string id = 1;
}

// Request para obter um Estoque por ID
message GetEstoqueRequest {
  string id = 1;
}

message GetEstoqueResponse {
  Estoque estoque = 1;
}

// Request e Response para listagem de Estoques
message ListEstoqueRequest {
  repeated string ids = 1;

  string nome = 2;

  EstoqueSituacao situacao = 3;

  bool ignore_situacao = 4; // Se true, ignora filtro de situação

  Filter filter = 5;

  uint32 page_size = 6;

  string page_token = 7;
}

message ListEstoqueResponse {
  repeated Estoque estoque_list = 1;

  string next_page_token = 2;
}
