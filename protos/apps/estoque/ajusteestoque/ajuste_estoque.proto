syntax = "proto3";

package ajusteestoque;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

option go_package = "comps/pb/apps/estoque/ajusteestoque";

// Serviço AjusteEstoque com operações CRUD
service AjusteEstoqueService {
  // Operações CRUD básicas
  rpc Create ( CreateAjusteEstoqueRequest ) returns ( CreateAjusteEstoqueResponse );

  rpc Update ( UpdateAjusteEstoqueRequest ) returns ( UpdateAjusteEstoqueResponse );

  rpc Delete ( DeleteAjusteEstoqueRequest ) returns ( DeleteAjusteEstoqueResponse );

  rpc Get ( GetAjusteEstoqueRequest ) returns ( GetAjusteEstoqueResponse );

  rpc List ( ListAjusteEstoqueRequest ) returns ( ListAjusteEstoqueResponse );

  // Operações específicas mapeadas do GraphQL
  rpc AddProduto ( AddProdutoRequest ) returns ( AjusteEstoqueResponse );

  rpc UpdateProduto ( UpdateProdutoRequest ) returns ( AjusteEstoqueResponse );

  rpc DeleteProduto ( DeleteProdutoRequest ) returns ( AjusteEstoqueResponse );

  rpc AddCategoria ( AddCategoriaRequest ) returns ( AjusteEstoqueResponse );

  rpc FinalizaAjuste ( FinalizaAjusteRequest ) returns ( AjusteEstoqueResponse );
}

// Produto no ajuste de estoque
message Produto {
  string id = 1;

  string produtoId = 2;

  string nome = 3;

  string codigo = 4;

  string un = 5;

  string obs = 6;

  double quantidade = 7;

  bool ajusteExecutado = 8;

  string userId = 9;

  string userName = 10;

  google.protobuf.Timestamp createdAt = 11;

  google.protobuf.Timestamp updatedAt = 12;

  // Quando preenchido, o ajuste é aplicado na variação (produto-filho); o
  // produtoId continua apontando para o produto pai.
  string variationProductId = 13;
}

// Categoria no ajuste de estoque
message Categoria {
  string id = 1;

  string categoriaId = 2;

  string categoriaNome = 3;

  google.protobuf.Timestamp createdAt = 4;

  google.protobuf.Timestamp updatedAt = 5;
}

// Dados do AjusteEstoque
message AjusteEstoque {
  string id = 1;

  uint32 numero = 2;

  string situacao = 3;

  google.protobuf.Timestamp dataHoraFinalizacao = 4;

  string estoqueId = 5;

  string estoqueNome = 6;

  string obs = 7;

  repeated Produto produtos = 8;

  repeated Categoria categorias = 9;

  string userId = 10;

  string userName = 11;

  bool zerarEstoque = 12;

  google.protobuf.Timestamp createdAt = 13;

  google.protobuf.Timestamp updatedAt = 14;
}

// Request e Response para criação de AjusteEstoque
message CreateAjusteEstoqueRequest {
  AjusteEstoque ajusteEstoque = 1;
}

message CreateAjusteEstoqueResponse {
  AjusteEstoque ajusteEstoque = 1;
}

// Request e Response para atualização de AjusteEstoque
message UpdateAjusteEstoqueRequest {
  string id = 1;

  AjusteEstoque ajusteEstoque = 2;

  metadata.FieldMask update_mask = 3;
}

message UpdateAjusteEstoqueResponse {
  AjusteEstoque ajusteEstoque = 1;
}

// Request e Response para exclusão de AjusteEstoque
message DeleteAjusteEstoqueRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteAjusteEstoqueResponse {
  string id = 1;
}

// Request para obter um AjusteEstoque por ID
message GetAjusteEstoqueRequest {
  string id = 1;
}

message GetAjusteEstoqueResponse {
  AjusteEstoque ajusteEstoque = 1;
}

// Request e Response para listagem de AjusteEstoques
message ListAjusteEstoqueRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListAjusteEstoqueResponse {
  repeated AjusteEstoque ajusteEstoqueList = 1;

  string next_page_token = 2;
}

// Resposta padrão para operações específicas
message AjusteEstoqueResponse {
  AjusteEstoque ajusteEstoque = 1;
}

// Request para adicionar produto ao ajuste
message AddProdutoRequest {
  string ajusteId = 1;

  Produto produto = 2;
}

// Request para atualizar produto no ajuste
message UpdateProdutoRequest {
  string ajusteId = 1;

  string itemId = 2;

  Produto produto = 3;
}

// Request para excluir produto do ajuste
message DeleteProdutoRequest {
  string ajusteId = 1;

  string itemId = 2;
}

// Request para adicionar categoria ao ajuste
message AddCategoriaRequest {
  string ajusteId = 1;

  Categoria categoria = 2;
}

// Request para finalizar o ajuste
message FinalizaAjusteRequest {
  string ajusteId = 1;
}
