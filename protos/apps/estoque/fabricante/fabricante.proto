syntax = "proto3";

package fabricante;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

option go_package = "comps/pb/apps/estoque/fabricante";

// Serviço Fabricante com operações CRUD
service FabricanteService {
  rpc Create ( CreateFabricanteRequest ) returns ( CreateFabricanteResponse );

  rpc Update ( UpdateFabricanteRequest ) returns ( UpdateFabricanteResponse );

  rpc Delete ( DeleteFabricanteRequest ) returns ( DeleteFabricanteResponse );

  rpc Get ( GetFabricanteRequest ) returns ( GetFabricanteResponse );

  rpc List ( ListFabricanteRequest ) returns ( ListFabricanteResponse );
}

// Dados do Fabricante
message Fabricante {
  string id = 1;

  string nome = 2;

  uint32 productsCount = 3;

  // Slug amigavel para URLs publicas da loja virtual (ex.: /loja/x/marca/{slug}).
  string slug = 4;

  metadata.BasicFields fields = 5;
}

// Request e Response para criação de Fabricante
message CreateFabricanteRequest {
  Fabricante fabricante = 1;
}

message CreateFabricanteResponse {
  Fabricante fabricante = 1;
}

// Request e Response para atualização de Fabricante
message UpdateFabricanteRequest {
  string id = 1; // ID da NFSe a ser atualizada

  Fabricante fabricante = 2;

  metadata.FieldMask update_mask = 3;
}

// Request e Response para atualização de Fabricante
message UpdateFabricanteResponse {
  Fabricante fabricante = 1;
}

// Request e Response para exclusão de Fabricante
message DeleteFabricanteRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteFabricanteResponse {
  string id = 1;

  repeated string avisos = 2; // empresas do grupo em que o registro foi mantido, com o motivo
}

// Request para obter um Fabricante por ID
message GetFabricanteRequest {
  string id = 1;
}

// Request para obter um Fabricante por ID
message GetFabricanteResponse {
  Fabricante fabricante = 1;
}

// Request e Response para listagem de Fabricantes
message ListFabricanteRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  Filter filter = 5;
}

message ListFabricanteResponse {
  repeated Fabricante fabricanteList = 1;

  string next_page_token = 2;
}
