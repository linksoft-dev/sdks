syntax = "proto3";

package bi;

import "google/api/annotations.proto";

import "google/protobuf/struct.proto";

option go_package = "comps/pb/apps/bi";

// Serviço de BI: expõe dados de negócio em formato genérico (linhas) para
// consumo por ferramentas externas de Business Intelligence (ex.: Looker
// Studio), autenticadas via Bearer token OAuth2.
service BiService {
  // GetData retorna as linhas de um dataset no intervalo de datas informado.
  rpc GetData ( GetDataRequest ) returns ( GetDataResponse );
}

message GetDataRequest {
  // Identificador do dataset (ex.: "vendas").
  string dataset = 1;

  // Data inicial do intervalo, formato "YYYY-MM-DD" (inclusiva).
  string start_date = 2;

  // Data final do intervalo, formato "YYYY-MM-DD" (inclusiva).
  string end_date = 3;
}

message GetDataResponse {
  // Cada linha é um objeto cujas chaves são os ids das colunas do dataset.
  repeated google.protobuf.Struct rows = 1;
}
