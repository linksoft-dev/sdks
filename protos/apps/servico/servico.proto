syntax = "proto3";

package servico;

import "google/api/annotations.proto";

import "plugins/validate/validate.proto";

import "plugins/service/service.proto";

import "filter/filter.proto";

import "common/metadata/metadata.proto";

import "google/protobuf/timestamp.proto";

import "imports/imports.proto";

import "apps/report/report.proto";

option go_package = "comps/pb/apps/servico";

service ServicoService {
  rpc Create ( CreateServicoRequest ) returns ( CreateServicoResponse );

  rpc Update ( UpdateServicoRequest ) returns ( UpdateServicoResponse );

  rpc Delete ( DeleteServicoRequest ) returns ( DeleteServicoResponse );

  rpc Get ( GetServicoRequest ) returns ( GetServicoResponse );

  rpc List ( ListServicoRequest ) returns ( ListServicoResponse );

  rpc Import ( ImportServicoRequest ) returns ( ImportServicoResponse );

  rpc SincronizarModulos ( SincronizarModulosRequest ) returns ( SincronizarModulosResponse );

  rpc ExecutarAlteracoesConjuntas ( AlteracoesConjuntasServicoRequest ) returns ( AlteracoesConjuntasServicoResponse );

  rpc Report ( ReportRequest ) returns ( ReportResponse );

  rpc Clone ( CloneServicoRequest ) returns ( CloneServicoResponse );
}

// Dados do Servico
message Servico {
  reserved 18;

  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  string user_id = 4;

  string user_name = 5;

  string nome = 6;

  string codigo = 7;

  uint32 dias_validade = 8;

  uint32 dias_garantia = 21; // Dias de garantia padrao do servico, copiados como snapshot no item do pedido/OS no momento do fechamento

  string un = 9;

  double valor_unitario = 10;

  string promocao = 14;

  message Ecommerce {
    string slug = 1;

    bool available_online = 2; // Disponível na loja virtual

    bool featured = 3; // Serviço em destaque

    string short_description = 4; // Descrição curta para cards

    string full_description = 5; // Descrição completa (HTML/Markdown)

    repeated string tags = 6; // Tags para busca

    string meta_title = 7; // Título SEO

    string meta_description = 8; // Descrição SEO

    int32 display_order = 9; // Ordem de exibição

    string video_url = 10; // URL do vídeo do serviço

    int32 estimated_duration_minutes = 11; // Duração estimada em minutos

    bool requires_scheduling = 12; // Requer agendamento

    // Imagens/midias do servico exibidas na loja virtual.
    // Estrutura espelha ProductMedia mas e' mantida local para nao acoplar
    // este modulo ao de produto. A primeira imagem e' usada como capa nos
    // cards da loja; todas sao usadas na pagina de detalhe do servico.
    ServicoMedia primary_media = 13;

    repeated ServicoMedia media = 14;
  }

  Ecommerce ecommerce = 15;

  Module module = 16;

  message Tributacao {
    string tributacao_id = 1;

    string tributacao_nome = 2;

    string codigo_servico_id = 3;

    string codigo_servico_codigo = 4;

    string codigo_servico_nome = 5;

    string cnae_codigo = 6;
  }

  Tributacao tributacao = 17;

  repeated Composicao composicao = 19;

  bool composto = 20;

  string situacao = 22; // ATIVO ou INATIVO. Servico INATIVO fica fora da listagem padrao e nao pode ser vendido

  metadata.BasicFields fields = 23;

  string categoria_id = 24;

  string categoria_nome = 25;
}

message Composicao {
  string id = 1;

  string item_id = 2;

  string tipo = 3;

  string nome = 4;

  double quantidade = 5;

  string un = 6;

  double valor_unitario = 7;

  double total = 8;

  string codigo = 9;
}

// Tipo de midia de servico. Espelha ProductMediaType (estoque/produto) sem
// acoplar os dois modulos.
enum ServicoMediaType {
  SERVICO_MEDIA_TYPE_UNSPECIFIED = 0;

  SERVICO_MEDIA_TYPE_IMAGE = 1;

  SERVICO_MEDIA_TYPE_VIDEO = 2;
}

// Midia (imagem/video) de servico exibida na loja virtual. Mesma estrutura
// de ProductMedia porem isolada para manter o modulo de servico independente.
message ServicoMedia {
  string id = 1;

  google.protobuf.Timestamp created_at = 2;

  google.protobuf.Timestamp updated_at = 3;

  ServicoMediaType media_type = 4;

  string url = 5;

  string file_id = 6;

  string display_name = 7;

  string file_extension = 8;
}

// Request e Response para criação de Servico
message CreateServicoRequest {
  Servico servico = 1;
}

message CreateServicoResponse {
  Servico servico = 1;
}

// Request e Response para atualização de Servico
message UpdateServicoRequest {
  string id = 1; // ID da NFSe a ser atualizada

  Servico servico = 2;

  metadata.FieldMask update_mask = 3;
}

// Request e Response para atualização de Servico
message UpdateServicoResponse {
  Servico servico = 1;
}

// Request e Response para exclusão de Servico
message DeleteServicoRequest {
  string id = 1;

  bool hard = 2;
}

message DeleteServicoResponse {
  string id = 1;

  repeated string avisos = 2; // empresas do grupo em que o registro foi mantido, com o motivo
}

// Request para obter um Servico por ID
message GetServicoRequest {
  string id = 1;
}

// Request para obter um Servico por ID
message GetServicoResponse {
  Servico servico = 1;
}

// Request e Response para listagem de Servicos
message ListServicoRequest {
  repeated string ids = 1;

  uint32 page_size = 2;

  string page_token = 3;

  repeated Servico servico = 4;

  Filter filter = 5;

  bool ignore_situacao_padrao = 6; // Retorna tambem os servicos inativos
}

message ListServicoResponse {
  repeated Servico servico_list = 1;

  string next_page_token = 2;
}

// representa um modulo do sistema
message Module {
  string route = 1;

  string icon = 2;

  string category = 3;

  string category_icon = 4;

  string title = 5;
}

message ImportServicoRequest {
  bool validate_only = 1; // Apenas validar sem importar

  bool update_if_exists = 2; // Atualizar se já existir

  repeated Servico servicos = 3;
}

message ImportServicoResponse {
  imports.ImportResponse report = 1;
}

message SincronizarModulosRequest {
  bool atualizar_precos = 1; // Se verdadeiro, atualiza o preço dos serviços já existentes
}

message SincronizarModulosResponse {
  repeated Module all_modules = 1;
}

// Estruturas para alterações conjuntas de serviços
message AlteracaoCadastroServico {
  string id = 1;

  string nome = 2;

  string codigo = 3;
}

message AlteracoesFiltroServico {
  repeated string ids = 1;

  string nome = 2; // Filtro por nome (like)

  string codigo = 3; // Filtro por código (like)
}

message AlteracoesConjuntasServicoRequest {
  AlteracoesFiltroServico filtro = 1;

  AlteracaoCadastroServico tributacao = 2; // tributacaoId/Nome para alterar

  AlteracaoCadastroServico codigo_servico = 3; // codigoServicoId/Nome/Codigo para alterar

  string cnae_codigo = 4; // CNAE para alterar
}

message AlteracoesConjuntasServicoResponse {
  int32 quantidade_alterada = 1;

  string status = 2;
}

// Request e Response para relatório de Servicos
message ReportRequest {
  string tipoRelatorio = 1;

  ListServicoRequest listServicoRequest = 2;
}

message ReportResponse {
  report.Response response = 1;
}

message CloneServicoRequest {
  string id = 1;
}

message CloneServicoResponse {
  Servico servico = 1;
}
